    --ink-2: #6b6156;
    --ink-muted: #a89d8d;
    --line: #e6ded0;
    --line-strong: #d8cbb3;
    --accent: #5c3a4e;
    --accent-ink: #fffefc;
    --accent-soft: #efe3e9;
    --brass: #b08d57;
    --brass-soft: #f3ead9;
    --brass-ink: #4a3719;
    --good: #5b7a5b;
    --good-soft: #e7ede4;
    --warning: #b98a3d;
    --warning-soft: #f6ecd8;
    --critical: #a6503c;
    --critical-soft: #f5e3dd;
    --series-1: #b08d57;
    --series-2: #7d5064;
    --shadow: 0 1px 2px rgba(43,38,32,0.05), 0 10px 28px -14px rgba(43,38,32,0.22);
    --radius: 4px;
    font-size: 16px;
    /* The "theme" a couple picks packages a colorway with a matching
       background — built entirely from that colorway's own --accent-soft /
       --brass-soft / --paper tokens (which already change per colorway and
       per light/dark mode above), so every theme gets a distinct, on-brand
       background wash for free, with no separate image assets needed. Used
       on guest-facing pages (RSVP portal) and the first-run setup wizard —
       never on the couple's own working dashboard. */
    --theme-bg: radial-gradient(circle at 12% -10%, var(--accent-soft) 0%, transparent 48%),
                radial-gradient(circle at 92% 8%, var(--brass-soft) 0%, transparent 42%),
                radial-gradient(circle at 50% 115%, var(--accent-soft) 0%, transparent 55%),
                linear-gradient(165deg, var(--paper) 0%, var(--paper-2) 100%);
  }

     existing rule that references it, like the masthead rule and pills,
     just works) plus the neutral paper/ink tones so the whole page reads
     as one cohesive palette, not just a swapped button color. --good/
     --warning/--critical are intentionally left alone in every colorway:
     they're functional status colors (RSVP, budget), not brand colors,
     and changing their meaning per-theme would make the app harder to

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
  a { color: var(--accent); }
  h1, h2, h3, h4 { font-family: "Playfair Display", Georgia, serif; font-weight: 600; text-wrap: balance; margin: 0; }
  .mono { font-family: "Manrope", ui-sans-serif, sans-serif; font-variant-numeric: tabular-nums; font-weight: 700; }
  button { font-family: inherit; }
  input, textarea, select {
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    padding: 0.55em 0.7em;
    width: 100%;
  }
  input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--ink-2); margin-bottom: 0.35em; letter-spacing: 0.01em; }
  .field { display: flex; flex-direction: column; gap: 0; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.5em;
    padding: 0.65em 1.25em; border-radius: 2px; border: 1px solid transparent;
    font-weight: 700; font-size: 0.85rem; letter-spacing: 0.01em; cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    white-space: nowrap;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
  .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
  .btn-secondary:hover { background: var(--accent-soft); border-color: var(--accent); }
  .btn-ghost { background: transparent; color: var(--accent); border-color: transparent; padding: 0.6em 0.8em; }
  .btn-ghost:hover { background: var(--accent-soft); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .btn-sm { padding: 0.42em 0.85em; font-size: 0.78rem; }

  .shell { max-width: 1320px; margin: 0 auto; padding: 2rem 1.25rem 6rem; }

  .masthead {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1.5rem;
    padding-bottom: 1.5rem; margin-bottom: 1.5rem; border-bottom: 2px solid var(--brass);
    position: relative;
  }
  .masthead-left { display: flex; align-items: center; gap: 1rem; }
  .masthead-title { font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 600; }
  .masthead-sub { color: var(--ink-2); font-size: 0.95rem; margin-top: 0.35rem; }
  .masthead-count { text-align: right; }
  .masthead-count .num { font-family: "Manrope", sans-serif; font-variant-numeric: tabular-nums; font-size: 2.1rem; font-weight: 800; color: var(--accent); line-height: 1; }
  .masthead-count .lbl { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-muted); margin-top: 0.3rem; }

  .stat-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem; margin-bottom: 1.75rem; }
  .stat-tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0.9rem 1rem; box-shadow: var(--shadow); }
  .stat-tile .stat-val { font-family: "Manrope", sans-serif; font-variant-numeric: tabular-nums; font-size: 1.5rem; font-weight: 800; }
  .stat-tile .stat-lbl { font-size: 0.75rem; color: var(--ink-2); margin-top: 0.15rem; }
  .stat-tile.warn .stat-val { color: var(--warning); }
  .stat-tile.critical .stat-val { color: var(--critical); }
  .stat-tile.good .stat-val { color: var(--good); }

  .app-shell { display: block; }
  .main-content { min-width: 0; }

  /* Hamburger menu — a slide-out drawer replaces the old always-visible
     sidebar, so the working area reads as one calm column (closer to a
     magazine page) instead of a permanent app-chrome rail. */
  .hamburger-btn {
    display: flex; flex-direction: column; justify-content: center; gap: 4px; width: 38px; height: 38px;
    border: 1px solid var(--line-strong); border-radius: 2px; background: var(--surface); cursor: pointer;
    padding: 0 8px; flex-shrink: 0; transition: border-color 0.15s ease, background 0.15s ease;
  }
  .hamburger-btn span { display: block; height: 1.5px; background: var(--ink); border-radius: 1px; }
  .hamburger-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
  .hamburger-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }

  .nav-backdrop {
    position: fixed; inset: 0; background: rgba(43,38,32,0.35); opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease; z-index: 60;
  }
  .nav-backdrop.open { opacity: 1; pointer-events: auto; }

  .nav-drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: 280px; max-width: 82vw; background: var(--surface);
    border-right: 1px solid var(--line); box-shadow: var(--shadow); z-index: 61;
    transform: translateX(-100%); transition: transform 0.25s cubic-bezier(.4,0,.2,1);
    display: flex; flex-direction: column; padding: 1.5rem 1rem;
  }
  .nav-drawer.open { transform: translateX(0); }
  .nav-drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 0 0.6rem 1.1rem; margin-bottom: 0.6rem; border-bottom: 1px solid var(--line); }
  .nav-drawer-head h4 { font-size: 1.1rem; }
  .nav-close-btn { background: none; border: none; font-size: 1.4rem; line-height: 1; color: var(--ink-muted); cursor: pointer; padding: 0.2rem; }
  .nav-close-btn:hover { color: var(--ink); }

  .tab-btn {
    background: none; border: none; border-radius: 2px; padding: 0.75em 0.9em; font-weight: 600; font-size: 0.92rem;
    color: var(--ink-2); cursor: pointer; text-align: left; white-space: normal; width: 100%;
  }
  .tab-btn:hover { color: var(--ink); background: var(--accent-soft); }
  .tab-btn.active { color: var(--accent); background: var(--accent-soft); font-weight: 700; box-shadow: inset 2px 0 0 var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fadein 0.2s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.25rem; box-shadow: var(--shadow); margin-bottom: 1.25rem; }
  .card h2 { font-size: 1.15rem; margin-bottom: 0.9rem; }
  .card h3 { font-size: 1rem; margin-bottom: 0.6rem; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 0.9rem; }
  .card-head h2 { margin-bottom: 0; }
  .muted { color: var(--ink-2); font-size: 0.9rem; }
  .tiny { font-size: 0.78rem; color: var(--ink-muted); }

  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1rem; }

  .pill { display: inline-flex; align-items: center; gap: 0.4em; padding: 0.25em 0.65em; border-radius: 999px; font-size: 0.74rem; font-weight: 600; border: 1px solid var(--line-strong); background: var(--surface); white-space: nowrap; flex: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.good { background: var(--good); }
  .dot.warning { background: var(--warning); }
  .dot.critical { background: var(--critical); }
  .dot.neutral { background: var(--ink-muted); }
  .dot.accent { background: var(--accent); }

  .gap-list { display: flex; flex-direction: column; gap: 0.6rem; }
  .gap-item { display: flex; gap: 0.7rem; align-items: flex-start; padding: 0.75rem 0.9rem; border-radius: 8px; border: 1px solid var(--line); background: var(--paper-2); }
  .gap-item.critical { border-color: var(--critical); background: var(--critical-soft); }
  .gap-item.warning { border-color: var(--warning); background: var(--warning-soft); }
  .gap-item .stripe { width: 3px; align-self: stretch; border-radius: 2px; background: var(--ink-muted); flex: none; }
  .gap-item.critical .stripe { background: var(--critical); }
  .gap-item.warning .stripe { background: var(--warning); }
  .gap-item-body { flex: 1; }
  .gap-item-title { font-weight: 600; font-size: 0.92rem; }
  .gap-item-sub { font-size: 0.82rem; color: var(--ink-2); margin-top: 0.15rem; }
  .empty-note { text-align: center; padding: 1.5rem 1rem; color: var(--ink-2); font-size: 0.9rem; }

  .colorway-grid { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 0.75rem; }
  .colorway-option {
    display: flex; flex-direction: column; align-items: center; gap: 0.35rem; width: 108px;
    background: none; border: 1px solid transparent; border-radius: 12px; padding: 0.6rem 0.5rem 0.7rem; cursor: pointer;
  }
  .colorway-option:hover:not(:disabled) { background: var(--paper-2); }
  .colorway-option:disabled { cursor: default; }
  .colorway-option.active { border-color: var(--line-strong); background: var(--paper-2); }
  .colorway-swatch { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--line-strong); position: relative; overflow: hidden; box-shadow: var(--shadow); }
  .colorway-swatch span { position: absolute; inset: 0; }
  .colorway-swatch span:first-child { clip-path: polygon(0 0, 100% 0, 0 100%); }
  .colorway-swatch span:last-child { clip-path: polygon(100% 0, 100% 100%, 0 100%); }
  .colorway-option.active .colorway-swatch { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .colorway-label { font-size: 0.78rem; font-weight: 700; text-align: center; color: var(--ink); }
  .colorway-sub { font-size: 0.68rem; color: var(--ink-muted); text-align: center; }

  .cat-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
  .cat-card-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem 0.75rem; padding: 0.9rem 1rem; }
  .cat-card-head h3 { margin: 0; font-size: 0.98rem; font-family: "Manrope", sans-serif; font-weight: 700; min-width: 0; }
  .cat-card-body { padding: 0 1rem 1rem; }
  .cat-note { font-size: 0.82rem; color: var(--ink-2); margin: 0.4rem 0 0.7rem; }

  table { width: 100%; border-collapse: collapse; font-size: 0.87rem; }
  th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-muted); font-weight: 600; padding: 0.5em 0.6em; border-bottom: 1px solid var(--line-strong); }
  td { padding: 0.65em 0.6em; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .table-scroll { overflow-x: auto; }
  td.num, th.num { text-align: right; font-family: "Manrope", sans-serif; font-variant-numeric: tabular-nums; font-weight: 600; }

  .checklist-group { margin-bottom: 1.1rem; }
  .checklist-group h4 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-muted); margin: 0 0 0.5rem; }
  .check-row { display: flex; align-items: flex-start; gap: 0.65rem; padding: 0.5rem 0.2rem; border-bottom: 1px solid var(--line); }
  .check-row:last-child { border-bottom: none; }
  .check-row input[type="checkbox"] { width: 18px; height: 18px; margin-top: 0.15rem; accent-color: var(--accent); flex: none; }
  .check-title { font-size: 0.92rem; position: relative; display: inline-block; transition: color 0.4s ease; }
  .check-title::after { content: ""; position: absolute; left: 0; top: 0.68em; height: 1px; width: 0; background: var(--ink-muted); transition: width 0.45s cubic-bezier(.4,0,.2,1); }
  .check-row.done .check-title { color: var(--ink-muted); }
  .check-row.done .check-title::after { width: 100%; }
  .check-due { font-size: 0.76rem; color: var(--ink-muted); margin-top: 0.1rem; }
  .check-due.overdue { color: var(--critical); font-weight: 600; }
  .check-remove { margin-left: auto; }

  /* ---- Phase rail: progress-by-phase header on the checklist tab ---- */
  .phase-rail { display: flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); box-shadow: var(--shadow); margin-bottom: 1.1rem; flex-wrap: wrap; }
  .phase-tile { flex: 1 1 200px; padding: 1.1rem 1.25rem 1.2rem; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); cursor: pointer; background: none; text-align: left; font: inherit; color: inherit; }
  .phase-tile:last-child { border-right: none; }
  .phase-tile .p-eyebrow { font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); font-weight: 700; }
  .phase-tile h4 { font-size: 1.02rem; margin: 0.35rem 0 0.45rem; font-family: "Playfair Display", serif; font-weight: 600; }
  .phase-tile .p-count { font-size: 0.78rem; color: var(--ink-2); margin-bottom: 0.7rem; }
  .phase-tile .p-fill { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .phase-tile .p-fill i { display: block; height: 100%; background: var(--brass); transition: width 0.4s ease; }
  .phase-tile.current { background: var(--accent-soft); }
  .phase-tile.current .p-eyebrow { color: var(--accent); }
  .phase-tile.phase-done .p-fill i { background: var(--good); }
  .checklist-phase-group { margin-bottom: 0.6rem; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .phase-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0.75rem 1rem; background: var(--paper-2); border: none; font: inherit; cursor: pointer; text-align: left; color: var(--ink); }
  .phase-toggle .pt-title { font-family: "Playfair Display", serif; font-weight: 600; font-size: 0.98rem; }
  .phase-toggle .pt-meta { font-size: 0.78rem; color: var(--ink-muted); display: flex; align-items: center; gap: 0.6rem; }
  .phase-toggle .pt-chevron { transition: transform 0.25s ease; display: inline-block; }
  .checklist-phase-group.open .phase-toggle .pt-chevron { transform: rotate(90deg); }
  .checklist-phase-body { padding: 0.4rem 1rem 0.7rem; }

  .barchart { display: flex; flex-direction: column; gap: 0.55rem; }
  .barrow { display: grid; grid-template-columns: 130px 1fr 90px; align-items: center; gap: 0.6rem; }
  .barrow .barlabel { font-size: 0.82rem; color: var(--ink-2); }
  .bartrack { position: relative; height: 20px; background: var(--paper-2); border-radius: 4px; overflow: hidden; }
  .barfill { position: absolute; top: 0; left: 0; height: 100%; border-radius: 4px; }
  .barfill.s1 { background: var(--series-1); }
  .barfill.s2 { background: var(--series-2); opacity: 0.55; height: 8px; top: 6px; }
  .barrow .barval { font-size: 0.78rem; text-align: right; font-family: "Manrope", sans-serif; font-variant-numeric: tabular-nums; font-weight: 700; }
  .legend { display: flex; gap: 1.2rem; margin-top: 0.6rem; font-size: 0.78rem; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 0.4em; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  /* ---- Fluid budget sliders: proportional-redistribution allocation ---- */
  .fluid-row { padding: 0.85rem 0; border-bottom: 1px solid var(--line); }
  .fluid-row:last-child { border-bottom: none; }
  .fluid-row-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.55rem; gap: 0.6rem; }
  .fluid-row-head .fr-cat { font-weight: 700; font-size: 0.9rem; }
  .fluid-row-head .fr-cat .booked-badge { font-weight: 500; }
  .fluid-row-head .fr-amt { font-family: "Manrope", sans-serif; font-variant-numeric: tabular-nums; font-weight: 800; font-size: 0.95rem; }
  .fluid-row-head .fr-pct { font-size: 0.74rem; color: var(--ink-muted); margin-left: 0.35em; font-weight: 500; }
  .fluid-slider { position: relative; height: 6px; border-radius: 4px; background: var(--line); }
  .fluid-slider .fill { position: absolute; inset: 0; border-radius: 4px; background: var(--brass); width: 0%; transition: background 0.2s ease; pointer-events: none; }
  .fluid-slider input[type="range"] { -webkit-appearance: none; appearance: none; position: absolute; inset: -9px 0; width: 100%; height: 24px; background: transparent; margin: 0; cursor: grab; }
  .fluid-slider input[type="range"]:active { cursor: grabbing; }
  .fluid-slider input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 17px; height: 17px; border-radius: 50%; background: var(--surface); border: 2.5px solid var(--accent); margin-top: 0; box-shadow: var(--shadow); transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .fluid-slider input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px var(--accent-soft); }
  .fluid-slider input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.15); }
  .fluid-slider input[type="range"]::-moz-range-thumb { width: 17px; height: 17px; border-radius: 50%; background: var(--surface); border: 2.5px solid var(--accent); box-shadow: var(--shadow); }
  .fluid-actual-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; font-size: 0.78rem; color: var(--ink-2); flex-wrap: wrap; }
  .fluid-actual-row label { flex: none; }
  .fluid-actual-row input { max-width: 100px; }
  .fluid-hint { font-size: 0.78rem; color: var(--ink-muted); margin: -0.3rem 0 1rem; }
  .fluid-budget-list { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); padding: 0.15rem 1.15rem; }

  textarea { min-height: 4.5em; resize: vertical; }
  .save-row { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 0.9rem; align-items: center; }
  .save-status { font-size: 0.8rem; color: var(--ink-muted); }
  .save-status.err { color: var(--critical); }
  .save-status.ok { color: var(--good); }

  .request-item { display: flex; gap: 0.75rem; padding: 0.75rem 0; border-bottom: 1px solid var(--line); }
  .request-item:last-child { border-bottom: none; }
  .request-item .ri-body { flex: 1; }
  .request-item .ri-text { font-size: 0.9rem; }
  .request-item .ri-meta { font-size: 0.75rem; color: var(--ink-muted); margin-top: 0.15rem; }
  .request-item .ri-response { font-size: 0.85rem; margin-top: 0.4rem; padding: 0.6rem 0.75rem; background: var(--accent-soft); border-radius: 7px; }

  .booked-badge { display: inline-flex; align-items: center; gap: 0.35em; padding: 0.2em 0.6em; border-radius: 999px; background: var(--brass-soft); color: var(--brass-ink); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.03em; white-space: nowrap; flex: none; }

  footer.note { margin-top: 2.5rem; padding-top: 1.25rem; border-top: 1px solid var(--line); font-size: 0.8rem; color: var(--ink-muted); }
  .readonly-banner { background: var(--warning-soft); color: var(--brass-ink); border: 1px solid var(--warning); border-radius: 8px; padding: 0.7rem 1rem; font-size: 0.85rem; margin-bottom: 1.25rem; }
  .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 0.65em 1.2em; border-radius: 8px; font-size: 0.85rem; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; z-index: 50; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  .btn-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  select.status-select { width: auto; }

  .guest-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.75rem; margin-bottom: 1.25rem; }

  .file-input-row { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
  .file-input-row input[type="file"] { width: auto; flex: 1; min-width: 200px; font-size: 0.85rem; padding: 0.4em 0; border: none; background: none; }

  .copy-fallback { border: 1px solid var(--warning); background: var(--warning-soft); border-radius: 8px; padding: 0.9rem; margin-bottom: 1rem; }
  .copy-fallback textarea { min-height: 6em; font-family: "Manrope", sans-serif; font-size: 0.78rem; }
  .copy-fallback .save-row { margin-top: 0.6rem; }

  .guest-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 1rem; }
  .filter-group { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
  .filter-btn {
    background: var(--surface); border: 1px solid var(--line-strong); color: var(--ink-2);
    padding: 0.35em 0.8em; border-radius: 999px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
  }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .filter-label { font-size: 0.75rem; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-right: 0.2rem; }

  .guest-group-header { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; margin: 1.1rem 0 0.4rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--line-strong); }
  .guest-group-header h4 { font-size: 0.85rem; margin: 0; }
  .guest-group-header .grp-actions { font-size: 0.75rem; display: flex; gap: 0.7rem; }
  .guest-group-header .grp-actions button { background: none; border: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 0; font-size: 0.75rem; }
  .guest-group-header .grp-actions button:hover { text-decoration: underline; }

  .guest-row-name input, .guest-row-side input, .guest-row-group input { font-size: 0.85rem; padding: 0.4em 0.55em; }
  .status-btn-group { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 7px; overflow: hidden; }
  .status-btn { background: var(--surface); border: none; border-right: 1px solid var(--line-strong); color: var(--ink-2); padding: 0.35em 0.65em; font-size: 0.76rem; font-weight: 600; cursor: pointer; }
  .status-btn:last-child { border-right: none; }

  .closeness-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 0.4em; vertical-align: middle; }

  .detail-toggle { background: none; border: none; color: var(--accent); font-size: 0.76rem; font-weight: 600; cursor: pointer; padding: 0.2em 0; }
  .detail-row td { background: var(--paper-2); padding: 0.9rem 0.75rem; }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.75rem; }
  .detail-grid .field label { font-size: 0.72rem; }
  .last-contact-ago { font-size: 0.75rem; color: var(--ink-muted); margin-top: 0.25rem; }

  .import-log { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.75rem; }
  .import-item { display: flex; gap: 0.7rem; align-items: flex-start; padding: 0.65rem 0.8rem; border-radius: 8px; border: 1px solid var(--line); background: var(--paper-2); font-size: 0.85rem; }
  .import-item .imp-name { font-weight: 600; }
  .import-item .imp-meta { font-size: 0.75rem; color: var(--ink-muted); margin-top: 0.1rem; }

  .sort-select { width: auto; font-size: 0.8rem; padding: 0.35em 0.6em; }

  .seating-toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.6rem; }
  .floor-plan-canvas { position: relative; width: 100%; min-height: 600px; border: 1px dashed var(--line); border-radius: 12px; background: var(--paper-2); overflow: hidden; }
  .floor-plan-canvas.fullscreen {
    position: fixed; inset: 14px; width: auto; height: auto; min-height: 0; z-index: 901;
    background: var(--paper-2); box-shadow: 0 12px 48px rgba(0,0,0,0.4); border: 1px solid var(--line-strong);
  }
  .floor-plan-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 900; }

  .floor-table { position: absolute; transform: translate(-50%, -50%); text-align: center; }
  .floor-table.dragging { z-index: 30; }
  .seat-visual-stage { position: relative; margin: 0 auto; }
  .seat-table-visual { position: absolute; border: 2px dashed var(--line-strong); background: var(--surface); }

  .seat-table-visual[data-table-drag] { cursor: grab; touch-action: none; }
  .floor-table.dragging .seat-table-visual { cursor: grabbing; border-style: solid; border-color: var(--accent); }
  .seat-table-center { position: absolute; top: 50%; left: 50%; text-align: center; width: 74%; line-height: 1.15; }
  .seat-table-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .floor-table-actions { display: flex; gap: 0.75rem; justify-content: center; margin-top: 0.4rem; }
  .seat-pill {
    position: absolute; transform: translate(-50%, -50%); max-width: 118px; padding: 0.28rem 0.65rem; border-radius: 999px;
    font-size: 0.7rem; font-weight: 700; border: 2px solid var(--line-strong); background: var(--surface); color: var(--ink-2);

  .seat-pill.filled { cursor: pointer; }
  .seat-pill.good { border-color: var(--good); background: var(--good-soft); color: var(--good); }
  .seat-pill.critical { border-color: var(--critical); background: var(--critical-soft); color: var(--critical); }
  .seat-pill.neutral { border-color: var(--ink-muted); background: var(--paper-2); color: var(--ink-2); }
  .seat-dot { position: absolute; transform: translate(-50%, -50%); width: 12px; height: 12px; border-radius: 50%; border: 2px dashed var(--line-strong); background: var(--paper-2); }
  .seat-remove-link { background: none; border: none; color: var(--accent); font-size: 0.75rem; font-weight: 600; cursor: pointer; margin-top: 0.35rem; }

  .login-shell { max-width: 380px; margin: 4.5rem auto; padding: 0 1.25rem; }
  .login-shell h1 { font-size: 1.5rem; margin-bottom: 0.4rem; }
  .login-shell .login-sub { color: var(--ink-2); font-size: 0.9rem; margin-bottom: 1.5rem; }
  .login-error { background: var(--critical-soft); color: var(--critical); border: 1px solid var(--critical); border-radius: 8px; padding: 0.65rem 0.9rem; font-size: 0.85rem; margin-bottom: 1rem; }
  .login-notice { background: var(--good-soft); color: var(--good); border: 1px solid var(--good); border-radius: 8px; padding: 0.65rem 0.9rem; font-size: 0.85rem; margin-bottom: 1rem; }
  .login-shell .field { margin-bottom: 1rem; }
  .portal-shell { max-width: 600px; margin: 3rem auto; padding: 0 1.25rem 4rem; }
  .portal-shell h1 { font-size: 1.6rem; margin-bottom: 0.3rem; }
  .portal-sub { color: var(--ink-2); font-size: 0.95rem; margin-bottom: 1.5rem; }
  .portal-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.25rem; box-shadow: var(--shadow); margin-bottom: 1.25rem; }
  .portal-card h2 { font-size: 1.05rem; margin-bottom: 0.75rem; }

  .portal-schedule-item:last-child { border-bottom: none; }
  .portal-schedule-item .ps-time { font-family: "Manrope", sans-serif; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 0.8rem; color: var(--ink-2); }
  .portal-member { border: 1px solid var(--line); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
  .portal-member .field { margin-bottom: 0.8rem; }
  .portal-attend-row { display: flex; align-items: center; gap: 0.65em; cursor: pointer; margin-bottom: 0.7rem; }
  .portal-attend-row input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
  .portal-member-name { font-family: "Playfair Display", Georgia, serif; font-size: 1.05rem; font-weight: 600; }
  .portal-eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--brass-ink, var(--ink-2)); font-weight: 700; margin-bottom: 0.5rem; }
  .portal-shell { border-top: 3px solid var(--brass); padding-top: 1.75rem; }
  .household-members-select { min-height: 90px; }

  /* Themed pages — the RSVP portal and the first-run setup wizard. Never
     used on the couple's own working dashboard. */
  .themed-page { background: var(--theme-bg); min-height: 100vh; }
  .couple-photo-frame {
    display: block; width: 140px; height: 140px; margin: 0 auto 1rem; border-radius: 50%;
    border: 4px solid var(--brass); box-shadow: var(--shadow); object-fit: cover; background: var(--surface);
  }
  .portal-search-shell, .wizard-shell { max-width: 480px; margin: 0 auto; padding: 3.5rem 1.25rem 4rem; text-align: center; }
  .portal-search-shell h1, .wizard-shell h1 { font-size: 1.6rem; margin-bottom: 0.35rem; }
  .portal-search-shell .portal-sub, .wizard-shell .wizard-sub { color: var(--ink-2); font-size: 0.95rem; margin-bottom: 1.75rem; }
  .portal-search-shell .field, .portal-found-name { text-align: left; }
  .portal-match-list { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 1rem; }
  .portal-match-btn {
    text-align: left; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
    cursor: pointer; font-size: 0.95rem; font-weight: 600; color: var(--ink);
  }
  .portal-match-btn:hover { border-color: var(--accent); }
  .portal-addition-row { display: flex; gap: 0.6rem; margin-top: 0.75rem; align-items: flex-end; }
  .portal-addition-row .field { flex: 1; margin-bottom: 0; }
  .portal-addition-list { display: flex; flex-direction: column; gap: 0.4rem; margin: 0.75rem 0; }
  .portal-addition-chip {
    display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.5rem 0.75rem;
    border-radius: 8px; background: var(--accent-soft); font-size: 0.85rem;
  }
  .portal-addition-chip button { background: none; border: none; color: var(--ink-muted); cursor: pointer; font-size: 0.8rem; text-decoration: underline; }
  .pending-approval-badge {
    display: inline-block; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--warning); background: var(--warning-soft); border-radius: 999px; padding: 0.15em 0.55em; margin-left: 0.4em; vertical-align: middle;
  }

  /* Guest site: wedding party, FAQ, registry links */
  .party-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; margin-top: 0.5rem; }
  .party-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 1rem; text-align: center; }
  .party-photo, .party-photo-empty {
    display: block; width: 96px; height: 96px; margin: 0 auto 0.5rem; border-radius: 50%;
    border: 3px solid var(--brass); object-fit: cover; background: var(--bg-soft, var(--surface));
  }
  .party-photo-empty { display: flex; align-items: center; justify-content: center; }
  .party-photo-input { display: block; margin: 0 auto 0.75rem; font-size: 0.78rem; }
  .party-card .field { text-align: left; margin-bottom: 0.6rem; }
  .faq-row, .registry-row {
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
    padding: 1rem; margin-bottom: 0.75rem;
  }
  .faq-row .field { margin-bottom: 0.6rem; }
  .registry-row.grid-3 { align-items: end; }
  .portal-story { white-space: pre-wrap; line-height: 1.6; }
  .portal-map { width: 100%; height: 220px; border: 0; border-radius: 10px; margin-top: 0.75rem; }
  .portal-countdown {
    display: inline-flex; align-items: baseline; gap: 0.4em; margin-top: 0.5rem; font-weight: 700;
    color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 0.35em 0.9em; font-size: 0.85rem;
  }
  .portal-countdown .num { font-size: 1.1em; font-variant-numeric: tabular-nums; }
  .portal-registry-links { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.5rem; }
  .portal-registry-link {
    display: inline-block; padding: 0.6em 1.1em; border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); font-weight: 600; font-size: 0.9rem; text-decoration: none;
  }
  .portal-registry-link:hover { border-color: var(--accent); }
  .portal-party-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1.25rem; margin-top: 0.75rem; text-align: center; }
  .portal-party-photo, .portal-party-photo-empty { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; margin: 0 auto 0.5rem; border: 3px solid var(--brass); background: var(--surface); }
  .portal-party-name { font-weight: 700; font-size: 0.92rem; }
  .portal-party-role { font-size: 0.78rem; color: var(--ink-2); margin-bottom: 0.3rem; }
  .portal-party-blurb { font-size: 0.82rem; color: var(--ink-2); }
  .portal-faq-item { margin-bottom: 1rem; }
  .portal-faq-item:last-child { margin-bottom: 0; }
  .portal-faq-item .q { font-weight: 700; margin-bottom: 0.25rem; }
  .portal-faq-item .a { color: var(--ink-2); }

  /* First-run setup wizard */
  .wizard-shell { text-align: left; max-width: 640px; }
  .wizard-shell .card { margin-bottom: 1.25rem; }
  .wizard-photo-upload { text-align: center; margin-bottom: 1rem; }
  .wizard-photo-upload input[type=file] { display: block; margin: 0.6rem auto 0; }
  .wizard-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; }
  .login-links { display: flex; justify-content: space-between; margin-top: 0.9rem; }
  .link-btn { background: none; border: none; color: var(--accent); font-size: 0.82rem; font-weight: 600; cursor: pointer; text-decoration: underline; padding: 0; }
  .masthead-account { display: flex; align-items: center; gap: 0.75rem; }
  .logout-link { background: none; border: none; color: var(--ink-muted); font-size: 0.78rem; font-weight: 600; cursor: pointer; text-decoration: underline; padding: 0; }

  /* Printable seating chart / day-of run sheet. The floor-plan canvas is
     pixel-positioned for screen dragging and doesn't translate to a printed
     page, so the print button instead reveals a plain, paginated table-by-
     table list (.print-run-sheet), which is otherwise hidden on screen. */
  .print-run-sheet { display: none; }
  .print-run-sheet .prs-table { break-inside: avoid; margin-bottom: 1rem; }
  .print-run-sheet .prs-table h4 { font-size: 1rem; margin-bottom: 0.3rem; }
  .print-run-sheet .prs-table ul { margin: 0; padding-left: 1.2rem; }
  @media print {
    .sidebar, .masthead-count, .stat-strip, .tab-btn, .save-row, .guest-toolbar,
    .seating-toolbar, .floor-plan-canvas, .readonly-banner, footer.note, .btn, .hamburger-btn, .nav-drawer, .nav-backdrop { display: none !important; }
    .print-run-sheet { display: block !important; }
    .app-shell { display: block !important; }
    .card { box-shadow: none; border: none; padding: 0; }
    body { background: #fff; }
  }
</style>
</head>

<div class="shell" id="app-root">
  <!-- rendered by JS -->
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  /* ---------- constants ---------- */

  var CATEGORY_META = [
    { key: "planner", label: "Wedding Planner", lead: 11 },
    { key: "venue", label: "Venue", lead: 10 },
    { key: "photography", label: "Photography", lead: 9 },
    { key: "videography", label: "Videography", lead: 9 },
    { key: "catering", label: "Catering", lead: 8 },

    { key: "music", label: "Music (DJ / Band)", lead: 6 },
    { key: "officiant", label: "Officiant", lead: 5 },

  ];

  var CHECKLIST_DEFAULTS = [

    { id: "cl-03", title: "Book a venue", offset: -300, category: "venue" },

    { id: "cl-11", title: "Book officiant", offset: -150, category: "officiant" },
    { id: "cl-12", title: "Block hotel rooms for out-of-town guests", offset: -150 },
    { id: "cl-13", title: "Order invitations", offset: -120, category: "invitations" },
    { id: "cl-14", title: "Book rental items (linens, chairs, tenting)", offset: -120, category: "rentals" },
    { id: "cl-15", title: "Plan the honeymoon", offset: -110 },
    { id: "cl-16", title: "Order the cake", offset: -90, category: "cake" },
    { id: "cl-17", title: "Send invitations", offset: -75 },
    { id: "cl-18", title: "Book hair & makeup trial", offset: -70, category: "hairMakeup" },
    { id: "cl-19", title: "Book transportation", offset: -60, category: "transportation" },
    { id: "cl-20", title: "Apply for marriage license (check local rules)", offset: -45 },
    { id: "cl-21", title: "Final dress fitting", offset: -30 },
    { id: "cl-22", title: "Give caterer final headcount", offset: -21 },
    { id: "cl-23", title: "Finalize seating chart", offset: -14 },
    { id: "cl-24", title: "Confirm details with every vendor", offset: -10 },
    { id: "cl-25", title: "Pay final vendor balances", offset: -7 },
    { id: "cl-26", title: "Rehearsal", offset: -1 },
    { id: "cl-27", title: "Wedding day", offset: 0 }
  ];

  var TABS = [
    { key: "overview", label: "Overview" },
    { key: "profile", label: "Profile & Requests" },
    { key: "guestsite", label: "Guest Site" },
    { key: "checklist", label: "Checklist" },
    { key: "budget", label: "Budget" },
    { key: "vendors", label: "Vendors" },
    { key: "guests", label: "Guest List" },
    { key: "message", label: "Message Guests" },
    { key: "seating", label: "Seating" },
    { key: "dayof", label: "Day-of" }
  ];

  var DAY_MS = 86400000;

  // Swatch colors are each colorway's light-mode --accent / --brass so the
  // picker looks the same regardless of which colorway (or light/dark
  // mode) happens to be active while you're choosing.
  var COLORWAYS = [
    { key: "classic", label: "Ivory & Plum", sub: "The boutique default", colors: ["#5c3a4e", "#b08d57"] },
    { key: "sage", label: "Sage & Blush", sub: "Green + pink", colors: ["#6b7f5e", "#c98fa0"] },
    { key: "emerald", label: "Emerald & Mocha", sub: "Green + brown", colors: ["#0f5c46", "#8a6a52"] },
    { key: "chocolate", label: "Cocoa & Blush", sub: "Brown + pink", colors: ["#5c3a21", "#d98aa0"] },
    { key: "mocha", label: "Mocha & Sage", sub: "Brown + green", colors: ["#7a5c46", "#8fa583"] },
    { key: "dustyblue", label: "Dusty Blue & Rust", sub: "Blue + rust", colors: ["#4a6b8a", "#b5563c"] },
    { key: "plum", label: "Plum & Gold", sub: "Purple + gold", colors: ["#5b3159", "#c9a227"] },
    { key: "charcoal", label: "Charcoal & Ivory", sub: "Grey + tan", colors: ["#3a3a3a", "#b8a97c"] },
    { key: "terracotta", label: "Terracotta & Olive", sub: "Clay + olive", colors: ["#a85c3e", "#6b7a4a"] },
    { key: "burgundy", label: "Burgundy & Champagne", sub: "Wine + gold", colors: ["#6b1f2a", "#c9a86a"] }
  ];

  function applyColorway(key) {
    var known = COLORWAYS.some(function (c) { return c.key === key; });
    if (!known || key === "classic") {
      document.documentElement.removeAttribute("data-colorway");
    } else {
      document.documentElement.setAttribute("data-colorway", key);
    }
  }

  function defaultPayment() {
    return { depositAmount: null, depositPaid: false, depositDueDate: "", balanceAmount: null, balancePaid: false, balanceDueDate: "" };
  }

  function defaultState() {
    var cats = {};
    CATEGORY_META.forEach(function (c) {
      cats[c.key] = { requestStatus: "none", requestNote: "", vendors: [], bookedVendorId: null, allocated: null, actual: null, payment: defaultPayment() };
    });
    return {
      profile: { coupleNames: "", weddingDate: "", location: "", address: "", guestCount: null, budgetTotal: null, style: "", notes: "", couplePhoto: "", story: "" },
      categories: cats,
      checklist: CHECKLIST_DEFAULTS.map(function (d) {
        return { id: d.id, title: d.title, offset: d.offset, category: d.category || null, done: false, custom: false };
      }),
      requests: [],
      guests: [],
      households: [],
      fileImports: [],
      timeline: [],
      tables: [],
      weddingParty: [],
      faq: [],
      registryLinks: [],
      messageLog: [],
      settings: { colorway: "classic", onboardingComplete: false },
      writable: true,
      _rev: 0
    };
  }

  var CLOSENESS_META = [
    { value: "close", label: "Close" },
    { value: "casual", label: "Casual" },
    { value: "acquaintance", label: "Acquaintance" },
    { value: "lost_touch", label: "Lost touch" }
  ];
  var MAX_IMPORT_BYTES = 8 * 1024 * 1024;

  function partnerLabels() {
    var raw = (state.profile.coupleNames || "").split(/\s*(?:&|\+|,| and )\s*/i).map(function (s) { return s.trim(); }).filter(Boolean);
    if (raw.length === 2) return raw;
    return ["Partner 1", "Partner 2"];
  }

  /* ---------- state + persistence ---------- */

  var state = defaultState();
  var activeTab = "overview";
  var navOpen = false;
  var canWrite = true;
  var currentUser = null;

  // Auth-adjacent view state (forgot/reset-password flow). authScreen picks
  // between the login form and the "forgot password" form when signed out;
  // pendingResetToken (read from a ?resetToken=... URL param at boot, then
  // scrubbed from the URL) takes over the whole screen until consumed.
  var authScreen = "login";
  var loginNotice = "";
  var pendingResetToken = null;
  var forgotMsg = "";
  var resetMsg = "";
  var resetErr = "";
  var changePasswordMsg = "";
  var changePasswordErr = "";

  // First-run setup wizard — shown once, right after a couple's first
  // sign-in, before they ever see the normal dashboard (state.settings.
  // onboardingComplete gates it). "Skip for now" only dismisses it for the
  // current session (onboardingSkipped); it comes back next sign-in until
  // Finish is clicked. wizardDraft/wizardColorway/wizardPhoto are a local
  // scratch copy — nothing here touches the couple's real profile until
  // "Finish setup" saves it, same pattern as the RSVP portal's own _draft.
  var onboardingSkipped = false;
  var wizardDraft = null;
  var wizardColorway = null;
  var wizardPhoto = "";
  var wizardError = "";
  var photoError = ""; // upload error for the Theme card's photo control (Profile tab, post-onboarding)

  function applyLoadedState(parsed) {
    state = Object.assign(defaultState(), parsed, {
      profile: Object.assign(defaultState().profile, parsed.profile || {}),
      categories: mergeCategories(parsed.categories),
      settings: Object.assign(defaultState().settings, parsed.settings || {})
    });
    applyColorway(state.settings.colorway);
  }

  function mergeCategories(saved) {
    var base = defaultState().categories;
    if (!saved) return base;
    Object.keys(base).forEach(function (k) {
      if (saved[k]) base[k] = Object.assign(base[k], saved[k]);
    });
    return base;
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  var saving = false;
  function saveState(nextState, opts) {
    opts = opts || {};
    nextState._rev = state._rev || 0;
    if (saving) return Promise.resolve();
    saving = true;
    setSaveStatus("Saving…", "");
    return fetch("/api/state", {
      method: "PUT",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ state: nextState, expectedRev: state._rev || 0 })
    }).then(function (res) {
      saving = false;
      if (res.status === 401) {
        currentUser = null;
        render();
        setSaveStatus("Signed out — log in again to save.", "err");
        return null;
      }
      if (res.status === 409) {
        return res.json().then(function (data) {
          applyLoadedState(data.state);
          state._rev = data.rev;
          render();
          setSaveStatus("Someone updated this — refreshed with the latest.", "");
        });
      }
      if (!res.ok) {
        setSaveStatus("Could not save. Try again.", "err");
        return null;
      }
      return res.json().then(function (data) {
        state = nextState;
        state._rev = data.rev;
        render();
        setSaveStatus(opts.doneLabel || "Saved.", "ok");
      });
    }).catch(function (err) {
      saving = false;
      console.error(err);
      setSaveStatus("Could not save. Try again.", "err");
    });
  }

  function setSaveStatus(text, cls) {
    // Every tab renders its own save-status span with its own id
    // (save-status-badge, save-status-badge-3, -4, -5, …) since each tab's
    // Save button is independent. Update whichever one(s) currently exist
    // in the DOM rather than only the first tab's, so the "Saved." /
    // "Saving…" confirmation actually shows up next to the button someone
    // clicked, not just on the Profile tab.
    document.querySelectorAll(".save-status").forEach(function (el) {
      el.textContent = text;
      el.className = "save-status " + (cls || "");
    });
    showToast(text);
  }

  var toastTimer = null;
  function showToast(text) {
    var t = document.getElementById("toast");
    if (!t) return;
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }

  /* ---------- derived data ---------- */

  function parseDate(s) {
    if (!s) return null;
    var d = new Date(s + "T00:00:00");
    return isNaN(d.getTime()) ? null : d;
  }

  function today() {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function daysUntil(dateStr) {
    var d = parseDate(dateStr);
    if (!d) return null;
    return Math.round((d.getTime() - today().getTime()) / DAY_MS);
  }

  // The built-in checklist offsets assume a 12-month (365-day) runway. When
  // the wedding is sooner than that, scale every default offset down
  // proportionally so the whole plan compresses into the time actually
  // available instead of showing most of the checklist as already overdue.
  // Offset 0 (wedding day) and offsets near it barely move; the earliest
  // items (offset -365) land right around today. Custom to-dos the couple
  // added themselves are left alone — those "days before" values were
  // typed in on purpose and already mean what they say.
  var CHECKLIST_BASELINE_DAYS = 365;
  function checklistOffsetScale() {
    var du = daysUntil(state.profile.weddingDate);
    if (du === null || du <= 0) return 1;
    if (du >= CHECKLIST_BASELINE_DAYS) return 1;
    return du / CHECKLIST_BASELINE_DAYS;
  }

  function dueDateFor(item) {
    var wd = parseDate(state.profile.weddingDate);
    if (!wd) return null;
    var offset = item.offset;
    if (!item.custom) offset = Math.round(offset * checklistOffsetScale());
    return new Date(wd.getTime() + offset * DAY_MS);
  }

  function fmtDate(d) {
    if (!d) return "";
    if (typeof d === "string") d = parseDate(d);
    if (!d) return "";
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  function timeSince(dateStr) {
    var d = parseDate(dateStr);
    if (!d) return "";
    var days = Math.round((today().getTime() - d.getTime()) / DAY_MS);
    if (days < 0) return "in the future";
    if (days < 1) return "today";
    if (days < 30) return days + " day" + (days === 1 ? "" : "s") + " ago";
    if (days < 365) { var m = Math.round(days / 30.44); return m + " month" + (m === 1 ? "" : "s") + " ago"; }
    var y = Math.round(days / 365.25 * 10) / 10;
    return y + " year" + (y === 1 ? "" : "s") + " ago";
  }

  function fmtMoney(n) {
    if (n === null || n === undefined || n === "" || isNaN(n)) return "—";
    return "$" + Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
  }

  function computeGaps() {
    var gaps = [];
    var wd = state.profile.weddingDate;
    var monthsUntil = daysUntil(wd) === null ? null : daysUntil(wd) / 30.44;

    if (!wd) {
      gaps.push({ level: "warning", title: "No wedding date set", sub: "Add a date on the Profile tab to unlock timeline tracking and gap alerts." });
    }
    if (!state.profile.budgetTotal) {
      gaps.push({ level: "warning", title: "No total budget set", sub: "Add a budget on the Profile tab to track spending against it." });
    }
    if (monthsUntil !== null) {
      CATEGORY_META.forEach(function (c) {
        var cat = state.categories[c.key];
        if (cat.bookedVendorId) return;
        if (monthsUntil <= c.lead) {
          var level = monthsUntil <= c.lead / 2 ? "critical" : "warning";
          if (cat.requestStatus === "none") {
            gaps.push({ level: level, title: c.label + " — no vendors requested yet", sub: "Typically booked by about " + c.lead + " months out. Request vendors on the Profile tab." });
          } else if (cat.requestStatus === "pending") {
            gaps.push({ level: level === "critical" ? "critical" : "warning", sub: "Vendor research is still in progress.", title: c.label + " — research pending" });
          } else if (cat.requestStatus === "done" && cat.vendors.length && !cat.bookedVendorId) {
            gaps.push({ level: level, title: c.label + " — vendors found, none booked", sub: "Compare options on the Vendors tab and mark one as booked." });
          }
        }
      });
    }
    state.checklist.forEach(function (item) {
      var due = dueDateFor(item);
      if (due && !item.done && due.getTime() < today().getTime()) {
        gaps.push({ level: "critical", title: item.title, sub: "Overdue — was due " + fmtDate(due) + "." });
      }
    });
    var budget = computeBudget();
    if (budget.total && budget.spentPlusAllocated > budget.total) {
      gaps.push({ level: "critical", title: "Over budget", sub: fmtMoney(budget.spentPlusAllocated) + " allocated/spent against a " + fmtMoney(budget.total) + " budget." });
    }
    state.requests.forEach(function (r) {
      if (r.status === "pending") {
        gaps.push({ level: "warning", title: "Request pending: " + (r.category ? categoryLabel(r.category) : "general"), sub: truncate(r.text, 90) });
      }
    });
    if (monthsUntil !== null) {
      if (!state.guests.length && monthsUntil <= 10) {
        gaps.push({ level: monthsUntil <= 6 ? "critical" : "warning", title: "Guest list not started", sub: "Upload or add guests on the Guest List tab so invitations and headcounts have somewhere to start." });
      } else if (state.guests.length) {
        var gStats = computeGuestStats();
        if (gStats.undecided && monthsUntil <= 5) {
          gaps.push({ level: monthsUntil <= 3 ? "critical" : "warning", title: gStats.undecided + " guest" + (gStats.undecided === 1 ? "" : "s") + " still undecided", sub: "Work through the Guest List tab to mark everyone Invite or Not invited before invitations go out." });
        }
        if (state.profile.guestCount && gStats.estAttending > Number(state.profile.guestCount)) {
          gaps.push({ level: "warning", title: "Invited headcount is running over", sub: "About " + gStats.estAttending + " est. attending vs. a budgeted guest count of " + state.profile.guestCount + "." });
        }
        if (gStats.awaitingRsvp && monthsUntil <= 2) {
          gaps.push({ level: monthsUntil <= 1 ? "critical" : "warning", title: gStats.awaitingRsvp + " guest" + (gStats.awaitingRsvp === 1 ? "" : "s") + " still haven't RSVP'd", sub: "Follow up before finalizing headcount and seating on the Guest List and Day-of tabs." });
        }
      }
      if (monthsUntil < 0 && gStats.thankYouPending) {
        gaps.push({ level: "warning", title: gStats.thankYouPending + " thank-you note" + (gStats.thankYouPending === 1 ? "" : "s") + " still pending", sub: "Mark them sent on the Guest List tab as you go." });
      }
    }

    CATEGORY_META.forEach(function (c) {
      var cat = state.categories[c.key];
      if (!cat.bookedVendorId || !cat.payment) return;
      var p = cat.payment;
      if (p.balanceAmount && !p.balancePaid && p.balanceDueDate) {
        var dd = parseDate(p.balanceDueDate);
        if (dd && dd.getTime() < today().getTime()) {
          gaps.push({ level: "critical", title: c.label + " balance is overdue", sub: fmtMoney(p.balanceAmount) + " was due " + fmtDate(dd) + "." });
        } else if (dd && monthsUntil !== null && (dd.getTime() - today().getTime()) / DAY_MS <= 14) {
          gaps.push({ level: "warning", title: c.label + " balance due soon", sub: fmtMoney(p.balanceAmount) + " due " + fmtDate(dd) + "." });
        }
      }
    });
    var order = { critical: 0, warning: 1 };
    gaps.sort(function (a, b) { return (order[a.level] || 2) - (order[b.level] || 2); });
    return gaps;
  }

  function truncate(s, n) { s = s || ""; return s.length > n ? s.slice(0, n - 1) + "…" : s; }

  function categoryLabel(key) {
    var m = CATEGORY_META.filter(function (c) { return c.key === key; })[0];
    return m ? m.label : key;
  }

  function computeBudget() {
    var total = state.profile.budgetTotal ? Number(state.profile.budgetTotal) : 0;
    var allocated = 0, actual = 0;
    CATEGORY_META.forEach(function (c) {
      var cat = state.categories[c.key];
      if (cat.allocated) allocated += Number(cat.allocated);
      if (cat.actual) actual += Number(cat.actual);
    });
    return { total: total, allocated: allocated, actual: actual, spentPlusAllocated: actual + (allocated > actual ? allocated - actual : 0), remaining: total - actual };
  }

  // Typical U.S. wedding-budget split by category (sums to 100). A starting
  // point, not a quote — nudged below by style keywords, guest count, and
  // any real vendor prices already on file.
  var BASE_BUDGET_PCT = {
    planner: 8, venue: 15, photography: 9, videography: 5, catering: 28,
    attire: 6, florist: 7, music: 8, officiant: 1, invitations: 2,
    rentals: 5, hairMakeup: 2, transportation: 2, cake: 2
  };

  var STYLE_ADJUSTMENTS = [
    { test: /\b(luxury|black[\s-]?tie|formal|upscale|glam(orous)?)\b/i,
      mult: { venue: 1.25, catering: 1.1, attire: 1.25, florist: 1.2, hairMakeup: 1.15 } },
    { test: /\b(diy|backyard|casual|budget|small|intimate|elopement|micro[\s-]?wedding)\b/i,
      mult: { venue: 0.6, florist: 0.75, planner: 0.5, rentals: 1.3, catering: 0.9 } },
    { test: /\b(destination)\b/i,
      mult: { venue: 1.15, transportation: 1.6, invitations: 0.8, rentals: 0.8 } },
    { test: /\b(rustic|barn|garden|outdoor)\b/i,
      mult: { rentals: 1.3, florist: 1.15, venue: 0.9 } }
  ];

  function parsePriceNumber(s) {
    if (!s) return null;
    var m = String(s).replace(/,/g, "").match(/\d+(\.\d+)?/g);
    if (!m || !m.length) return null;
    var nums = m.map(Number);
    return nums.reduce(function (a, b) { return a + b; }, 0) / nums.length;
  }

  // A signal of what a category is likely to actually cost, drawn from
  // whatever's already on file for it — booked spend, a booked vendor's
  // price, or an average of researched vendor prices — in that order.
  function marketSignal(cat) {
    if (cat.actual) return Number(cat.actual);
    if (cat.bookedVendorId) {
      var booked = (cat.vendors || []).filter(function (x) { return x.id === cat.bookedVendorId; })[0];
      if (booked) {
        var n = booked.priceValue || parsePriceNumber(booked.price);
        if (n) return n;
      }
    }
    if (cat.vendors && cat.vendors.length) {
      var nums = cat.vendors.map(function (v) { return v.priceValue || parsePriceNumber(v.price); }).filter(function (n) { return n; });
      if (nums.length) return nums.reduce(function (a, b) { return a + b; }, 0) / nums.length;
    }
    return null;
  }

  // Top-down recommendation: given a total budget, suggest a $ amount per
  // category. Computed entirely client-side from BASE_BUDGET_PCT, nudged by
  // style/notes keywords, guest count, and any market signal per category —
  // then renormalized so the percentages still sum to 100.
  function computeRecommendedBudget() {
    var total = Number(state.profile.budgetTotal) || 0;
    var text = ((state.profile.style || "") + " " + (state.profile.notes || "")).toLowerCase();
    var weights = {};
    CATEGORY_META.forEach(function (c) { weights[c.key] = BASE_BUDGET_PCT[c.key] || 1; });

    STYLE_ADJUSTMENTS.forEach(function (adj) {
      if (adj.test.test(text)) {
        Object.keys(adj.mult).forEach(function (k) { if (weights[k] !== undefined) weights[k] *= adj.mult[k]; });
      }
    });

    var gc = Number(state.profile.guestCount) || 0;
    if (gc >= 150) { weights.catering *= 1.1; weights.venue *= 1.05; weights.florist *= 0.9; }
    else if (gc && gc <= 30) { weights.catering *= 0.9; weights.planner *= 1.15; }

    var usedSignal = {};
    CATEGORY_META.forEach(function (c) {
      var signal = marketSignal(state.categories[c.key]);
      if (signal && total) {
        var impliedPct = Math.min(60, (signal / total) * 100);
        weights[c.key] = weights[c.key] * 0.5 + impliedPct * 0.5;
        usedSignal[c.key] = true;
      }
    });

    var sum = 0;
    CATEGORY_META.forEach(function (c) { sum += weights[c.key]; });
    var out = {};
    CATEGORY_META.forEach(function (c) {
      var pct = sum ? (weights[c.key] / sum) * 100 : 0;
      out[c.key] = { pct: pct, amount: total ? Math.round((total * pct / 100) / 5) * 5 : 0, fromSignal: !!usedSignal[c.key] };
    });
    return out;
  }

  // Every deposit/balance across every vendor category that's due and not
  // yet marked paid, soonest first — a single place to see what to pay next
  // instead of clicking into each category on the Vendors tab.
  function computePaymentsDue() {
    var items = [];
    CATEGORY_META.forEach(function (c) {
      var cat = state.categories[c.key];
      if (!cat || !cat.payment) return;
      var pay = cat.payment;
      if (pay.depositAmount && pay.depositDueDate && !pay.depositPaid) {
        items.push({ category: c.label, kind: "Deposit", amount: pay.depositAmount, dueDate: pay.depositDueDate });
      }
      if (pay.balanceAmount && pay.balanceDueDate && !pay.balancePaid) {
        items.push({ category: c.label, kind: "Balance", amount: pay.balanceAmount, dueDate: pay.balanceDueDate });
      }
    });
    items.sort(function (a, b) { return parseDate(a.dueDate) - parseDate(b.dueDate); });
    return items;
  }

  function computeGuestStats() {
    var total = state.guests.length;
    var invite = state.guests.filter(function (g) { return g.status === "invite"; }).length;
    var no = state.guests.filter(function (g) { return g.status === "no"; }).length;
    var undecided = total - invite - no;
    var plusOnes = state.guests.filter(function (g) { return g.status === "invite" && g.plusOne; }).length;
    var confirmedAttending = 0;
    state.guests.forEach(function (g) { if (g.rsvp === "attending") confirmedAttending += 1 + (g.plusOneName ? 1 : 0); });
    var declined = state.guests.filter(function (g) { return g.rsvp === "declined"; }).length;
    var awaitingRsvp = state.guests.filter(function (g) { return g.status === "invite" && g.rsvp !== "attending" && g.rsvp !== "declined"; }).length;
    var needsHotel = state.guests.filter(function (g) { return g.needsHotel; }).length;
    var giftsReceived = state.guests.filter(function (g) { return g.giftReceived; }).length;
    var thankYouPending = state.guests.filter(function (g) { return g.giftReceived && !g.thankYouSent; }).length;
    var seated = state.guests.filter(function (g) { return g.tableId; }).length;

    // How many physical/emailed invitations to actually send: a household
    // that isn't set to "send separate invites" counts once no matter how
    // many invited guests it has; everyone else (no household, or a
    // household that opted into separate invites) counts individually.
    var invitesToSend = 0;
    var countedHouseholds = {};
    state.guests.forEach(function (g) {
      if (g.status !== "invite") return;
      var h = g.householdId ? (state.households || []).filter(function (x) { return x.id === g.householdId; })[0] : null;
      if (h && !h.sendSeparateInvites) {
        if (!countedHouseholds[h.id]) { countedHouseholds[h.id] = true; invitesToSend++; }
      } else {
        invitesToSend++;
      }
    });

    return {
      total: total, invite: invite, no: no, undecided: undecided, plusOnes: plusOnes, estAttending: invite + plusOnes,
      confirmedAttending: confirmedAttending, declined: declined, awaitingRsvp: awaitingRsvp,
      needsHotel: needsHotel, giftsReceived: giftsReceived, thankYouPending: thankYouPending, seated: seated, invitesToSend: invitesToSend
    };
  }

  function fmtTime(t) {
    if (!t) return "";
    var parts = t.split(":");
    var h = Number(parts[0]);
    if (isNaN(h)) return t;
    var ap = h >= 12 ? "PM" : "AM";
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + ":" + (parts[1] || "00") + " " + ap;
  }

  function vendorScore(v) {
    var vals = [v.scorePrice, v.scoreAvailability, v.scoreFit].filter(function (n) { return n !== null && n !== undefined && n !== ""; }).map(Number);
    if (!vals.length) return null;
    return vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
  }

  function syncCatActualFromPayments(cat) {
    var p = cat.payment;
    if (!p) return;
    var paid = (p.depositPaid ? Number(p.depositAmount) || 0 : 0) + (p.balancePaid ? Number(p.balanceAmount) || 0 : 0);
    if (paid > 0) cat.actual = paid;
  }

  /* ---------- guest list import / export ---------- */

  function parseDelimited(text) {
    var rows = [], row = [], field = "", inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQuotes) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
        else field += c;
      } else {
        if (c === '"') inQuotes = true;
        else if (c === "," || c === "\t") { row.push(field); field = ""; }
        else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
        else if (c === "\r") { /* skip */ }
        else field += c;
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (c) { return c.trim() !== ""; }); });
  }

  function guessColumns(headerRow) {
    var map = {};
    headerRow.forEach(function (h, idx) {
      var k = (h || "").toLowerCase().trim();
      if (map.name === undefined && /^(full\s*name|guest\s*name|name)$/.test(k)) map.name = idx;
      else if (map.first === undefined && /first/.test(k)) map.first = idx;
      else if (map.last === undefined && /last/.test(k)) map.last = idx;
      else if (map.side === undefined && /(side|partner)/.test(k)) map.side = idx;
      else if (map.group === undefined && /(group|relation|category)/.test(k)) map.group = idx;
      else if (map.plusOne === undefined && /plus/.test(k)) map.plusOne = idx;
      else if (map.howYouKnow === undefined && /(how.*know|relationship|connection)/.test(k)) map.howYouKnow = idx;
      else if (map.lastContact === undefined && /(last.*(contact|spoke|talk)|contact.*date)/.test(k)) map.lastContact = idx;
      else if (map.closeness === undefined && /(closeness|tier)/.test(k)) map.closeness = idx;
      else if (map.rsvp === undefined && /rsvp/.test(k)) map.rsvp = idx;
      else if (map.mealChoice === undefined && /meal/.test(k)) map.mealChoice = idx;
      else if (map.email === undefined && /e[\s-]?mail/.test(k)) map.email = idx;
      else if (map.notes === undefined && /note/.test(k)) map.notes = idx;
    });
    return map;
  }

  function normalizeRsvp(v) {
    v = (v || "").toLowerCase().trim();
    if (/^(attend|yes|coming|accept)/.test(v)) return "attending";
    if (/^(decline|no|not\s*attend|regret)/.test(v)) return "declined";
    if (/^sent/.test(v)) return "sent";
    return "not_sent";
  }

  function normalizeCloseness(v) {
    v = (v || "").toLowerCase().trim();
    var m = CLOSENESS_META.filter(function (c) { return c.value === v || c.label.toLowerCase() === v; })[0];
    return m ? m.value : "";
  }

  function makeGuestId() { return "g-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7); }
  function makeHouseholdId() { return "hh-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7); }

  // Same shape as the server's password-reset tokens (32 random bytes, hex)
  // so it's equally unguessable — minted client-side since households/guest
  // links are just ordinary fields on the shared state, saved the normal way.
  function makeRsvpToken() {
    var bytes = new Uint8Array(32);
    (window.crypto || window.msCrypto).getRandomValues(bytes);
    var hex = "";
    for (var i = 0; i < bytes.length; i++) hex += bytes[i].toString(16).padStart(2, "0");
    return hex;
  }
  function portalUrl(token) { return window.location.origin + "/rsvp/" + token; }

  function rowsToGuests(rows) {
    if (!rows.length) return [];
    var map = guessColumns(rows[0]);
    var hasHeader = map.name !== undefined || map.first !== undefined || map.last !== undefined;
    var dataRows = hasHeader ? rows.slice(1) : rows;
    return dataRows.map(function (r) {
      var name;
      if (hasHeader && map.name !== undefined) name = (r[map.name] || "").trim();
      else if (hasHeader && (map.first !== undefined || map.last !== undefined)) name = ((r[map.first] || "") + " " + (r[map.last] || "")).trim();
      else name = (r[0] || "").trim();
      if (!name) return null;
      return {
        id: makeGuestId(),
        name: name,
        side: hasHeader && map.side !== undefined ? (r[map.side] || "").trim() : "",
        group: hasHeader && map.group !== undefined ? (r[map.group] || "").trim() : "",
        plusOne: hasHeader && map.plusOne !== undefined ? /^(y|yes|true|1)/i.test((r[map.plusOne] || "").trim()) : false,
        status: "undecided",

  function importGuestsFromText(text, sourceLabel) {
    var rows = parseDelimited(text);
    var parsed = rowsToGuests(rows);
    if (!parsed.length) { showToast("Couldn't find any names in that " + sourceLabel + "."); return; }
    var existingNames = {};
    state.guests.forEach(function (g) { existingNames[g.name.trim().toLowerCase()] = true; });
    var added = parsed.filter(function (g) { return !existingNames[g.name.toLowerCase()]; });
    var skipped = parsed.length - added.length;
    state.guests = state.guests.concat(added);
    var next = clone(state);
    saveState(next, { doneLabel: "Added " + added.length + " guest" + (added.length === 1 ? "" : "s") + (skipped ? " (" + skipped + " duplicate" + (skipped === 1 ? "" : "s") + " skipped)" : ") from your " + sourceLabel + ".") });
  }

  var TEXT_LIKE_EXT = /\.(csv|txt|tsv)$/i;

  function isTextLikeFile(file) {
    return TEXT_LIKE_EXT.test(file.name || "") || /^text\//.test(file.type || "") || file.type === "text/csv";
  }

  function readFileAsDataURL(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result || "")); };
      reader.onerror = function () { reject(reader.error || new Error("read failed")); };
      reader.readAsDataURL(file);
    });
  }

  function queueFileImport(file, targetHint, note) {
    if (file.size > MAX_IMPORT_BYTES) {
      showToast("That file's too big (" + Math.round(file.size / 1024 / 1024) + " MB) — 8 MB max. Try a smaller export or a text/CSV paste instead.");
      return Promise.resolve();
    }
    return readFileAsDataURL(file).then(function (dataUrl) {
      var comma = dataUrl.indexOf(",");
      var meta = dataUrl.slice(5, comma); // "<mime>;base64"
      var mimeType = meta.split(";")[0] || file.type || "application/octet-stream";
      var base64 = dataUrl.slice(comma + 1);
      var next = clone(state);
      next.fileImports.push({
        id: "imp-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7),
        filename: file.name, mimeType: mimeType, sizeBytes: file.size,
        dataBase64: base64, targetHint: targetHint, note: note || "",
        status: "pending", createdAt: Date.now(), response: null
      });
      return saveState(next, { doneLabel: "Got “" + file.name + "” — I’ll read it and add what I find, usually within the hour." });
    }).catch(function (err) {
      console.error(err);
      showToast("Couldn't read that file.");
    });
  }

  function csvEscapeField(v) {
    v = String(v === null || v === undefined ? "" : v);
    if (/[",\n]/.test(v)) return '"' + v.replace(/"/g, '""') + '"';
    return v;
  }

  var copyFallback = null;

  function offerDownload(filename, text) {
    try {
      var blob = new Blob([text], { type: "text/csv;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
      copyFallback = null;
    } catch (err) {
      console.error(err);
      copyFallback = { filename: filename, text: text };
      render();
    }
  }

  // Reads an <input type=file> image, downscales it on a canvas, and
  // resolves a compressed JPEG data URL — kept well under the server's
  // couplePhoto size cap without needing any external image storage; the
  // photo just rides along in the same JSON state blob as everything else.
  function readAndResizeImage(file, maxDim, quality) {
    maxDim = maxDim || 900;
    quality = quality || 0.82;
    return new Promise(function (resolve, reject) {
      if (!file) { reject(new Error("No file chosen.")); return; }
      if (!/^image\//.test(file.type)) { reject(new Error("Please choose an image file.")); return; }
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error("Could not read that file.")); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error("Could not read that image.")); };
        img.onload = function () {
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var w = Math.max(1, Math.round(img.width * scale));
          var h = Math.max(1, Math.round(img.height * scale));
          var canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function bindOnboardingWizardEvents() {
    var root = document.getElementById("app-root");
    root.querySelectorAll("[data-wizard-colorway]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        wizardDraft = wizardProfileFromForm(wizardDraft);

        applyColorway(wizardColorway);
        render();
      });
    });
    var photoInput = document.getElementById("w-photo-input");
    if (photoInput) photoInput.addEventListener("change", function () {
      var file = photoInput.files && photoInput.files[0];
      if (!file) return;
      readAndResizeImage(file).then(function (dataUrl) {
        wizardDraft = wizardProfileFromForm(wizardDraft);
        wizardPhoto = dataUrl;
        wizardError = "";
        render();
      }).catch(function (e) {
        wizardDraft = wizardProfileFromForm(wizardDraft);
        wizardError = e.message || "Could not use that photo.";
        render();
      });
    });
    var skipBtn = document.getElementById("wizard-skip-btn");
    if (skipBtn) skipBtn.addEventListener("click", function () {
      onboardingSkipped = true;
      applyColorway(state.settings && state.settings.colorway);
      render();
    });
    var finishBtn = document.getElementById("wizard-finish-btn");
    if (finishBtn) finishBtn.addEventListener("click", function () {

      var next = clone(state);
      next.profile = Object.assign({}, next.profile, wizardDraft, { couplePhoto: wizardPhoto || next.profile.couplePhoto || "" });
      next.settings = Object.assign({}, next.settings, { colorway: wizardColorway, onboardingComplete: true });
      saveState(next, { doneLabel: "All set — welcome!" }).then(function () {
        wizardDraft = null; wizardColorway = null; wizardPhoto = ""; wizardError = "";
      });
    });
  }

  function requestStatusPill(cat, key) {
    if (cat.bookedVendorId) return '<span class="booked-badge">✓ Booked</span>';
    if (cat.requestStatus === "none") return '<span class="pill"><span class="dot neutral"></span>not started</span>';
    if (cat.requestStatus === "pending") return '<span class="pill"><span class="dot warning"></span>researching</span>';
    return '<span class="pill"><span class="dot good"></span>' + cat.vendors.length + ' found</span>';
