              '<td class="guest-row-group"><input type="text" data-guest-field="group|' + g.id + '" value="' + escapeHtml(g.group || "") + '" ' + (canWrite ? "" : "disabled") + '/></td>' +
              '<td class="guest-plus1"><input type="checkbox" data-guest-plusone="' + g.id + '" ' + (g.plusOne ? "checked" : "") + (canWrite ? "" : " disabled") + '/></td>' +
              '<td>' + (canWrite ? '<div class="status-btn-group">' +
                ["undecided", "invite", "no"].map(function (s) {
                  var lbl = s === "undecided" ? "?" : (s === "invite" ? "Invite" : "No");
                  return '<button class="status-btn' + (g.status === s ? " on " + s : "") + '" data-guest-status="' + s + "|" + g.id + '">' + lbl + "</button>";
                }).join("") + "</div>" : '<span class="pill"><span class="dot ' + (g.status === "invite" ? "good" : g.status === "no" ? "critical" : "neutral") + '"></span>' + (g.status === "invite" ? "Invited" : g.status === "no" ? "Not invited" : "To decide") + "</span>") + "</td>" +
              '<td><select data-guest-field="rsvp|' + g.id + '" ' + (canWrite ? "" : "disabled") + '>' + RSVP_META.map(function (r) { return '<option value="' + r.value + '"' + ((g.rsvp || "not_sent") === r.value ? " selected" : "") + '>' + r.label + "</option>"; }).join("") + "</select></td>" +
              "<td><button class=\"detail-toggle\" data-guest-toggle=\"" + g.id + '">' + (expanded ? "Hide ▾" : "Details ▸") + "</button></td>" +
              "<td>" + (canWrite ? '<button class="btn btn-ghost btn-sm" data-guest-remove="' + g.id + '">Remove</button>' : "") + "</td>" +
              "</tr>";
            var detail = expanded ? '<tr class="detail-row"><td colspan="8"><div class="detail-grid">' +
              '<div class="field"><label>How you know them</label><input type="text" data-guest-field="howYouKnow|' + g.id + '" value="' + escapeHtml(g.howYouKnow || "") + '" placeholder="e.g. College roommate" ' + (canWrite ? "" : "disabled") + '/></div>' +
              '<div class="field"><label>Last spoke</label><input type="date" data-guest-field="lastContact|' + g.id + '" value="' + escapeHtml(g.lastContact || "") + '" ' + (canWrite ? "" : "disabled") + '/>' + (g.lastContact ? '<div class="last-contact-ago">' + timeSince(g.lastContact) + "</div>" : "") + "</div>" +
              '<div class="field"><label>Closeness</label><select data-guest-field="closeness|' + g.id + '" ' + (canWrite ? "" : "disabled") + '><option value="">—</option>' + CLOSENESS_META.map(function (c) { return '<option value="' + c.value + '"' + (g.closeness === c.value ? " selected" : "") + '>' + c.label + "</option>"; }).join("") + "</select></div>" +
              '<div class="field"><label>Meal choice</label><input type="text" data-guest-field="mealChoice|' + g.id + '" value="' + escapeHtml(g.mealChoice || "") + '" placeholder="e.g. Vegetarian" ' + (canWrite ? "" : "disabled") + '/></div>' +
              '<div class="field"><label>Plus-one\'s name</label><input type="text" data-guest-field="plusOneName|' + g.id + '" value="' + escapeHtml(g.plusOneName || "") + '" ' + (canWrite ? "" : "disabled") + '/></div>' +
              '<div class="field"><label style="display:flex;align-items:center;gap:0.4em"><input type="checkbox" data-guest-check="needsHotel|' + g.id + '" ' + (g.needsHotel ? "checked" : "") + (canWrite ? "" : " disabled") + ' style="width:16px;height:16px;accent-color:var(--accent)"/> Needs a hotel room</label></div>' +
              '<div class="field"><label>Hotel block</label><input type="text" data-guest-field="hotelBlock|' + g.id + '" value="' + escapeHtml(g.hotelBlock || "") + '" ' + (canWrite ? "" : "disabled") + '/></div>' +
              '<div class="field"><label>Arrival</label><input type="date" data-guest-field="arrival|' + g.id + '" value="' + escapeHtml(g.arrival || "") + '" ' + (canWrite ? "" : "disabled") + '/></div>' +
              '<div class="field"><label>Departure</label><input type="date" data-guest-field="departure|' + g.id + '" value="' + escapeHtml(g.departure || "") + '" ' + (canWrite ? "" : "disabled") + '/></div>' +
              '<div class="field"><label style="display:flex;align-items:center;gap:0.4em"><input type="checkbox" data-guest-check="giftReceived|' + g.id + '" ' + (g.giftReceived ? "checked" : "") + (canWrite ? "" : " disabled") + ' style="width:16px;height:16px;accent-color:var(--accent)"/> Gift received</label></div>' +
              '<div class="field"><label>Gift description</label><input type="text" data-guest-field="giftDescription|' + g.id + '" value="' + escapeHtml(g.giftDescription || "") + '" ' + (canWrite ? "" : "disabled") + '/></div>' +
              '<div class="field"><label style="display:flex;align-items:center;gap:0.4em"><input type="checkbox" data-guest-check="thankYouSent|' + g.id + '" ' + (g.thankYouSent ? "checked" : "") + (canWrite ? "" : " disabled") + ' style="width:16px;height:16px;accent-color:var(--accent)"/> Thank-you sent</label></div>' +
              '<div class="field" style="grid-column:1/-1"><label>Notes</label><input type="text" data-guest-field="notes|' + g.id + '" value="' + escapeHtml(g.notes || "") + '" ' + (canWrite ? "" : "disabled") + '/></div>' +
              "</div></td></tr>" : "";
            return main + detail;
          }).join("");
          return header + '<div class="table-scroll"><table><thead><tr><th>Name</th><th>Side</th><th>Group</th><th>+1</th><th>Status</th><th>RSVP</th><th></th><th></th></tr></thead><tbody>' + rows + "</tbody></table></div>";
        }).join("");
      }
    } else {
      tableHtml = '<div class="empty-note">No guests yet — upload a file, paste a list, or add someone manually above.</div>';
    }

    var saveRow = canWrite && state.guests.length ? '<div class="save-row"><span class="save-status" id="save-status-badge-4"></span><button class="btn btn-primary" id="save-guests-btn">Save guest list</button></div>' : "";

    return panel("guests",
      '<div class="card"><h2>Guest list</h2><p class="muted">Upload or build your list here, then work through it to decide who\'s in. This feeds the headcount and budget gap checks on the Overview tab.</p>' + statTiles + "</div>" +
      importCard + manualAdd +
      '<div class="card">' + filterBar + tableHtml + saveRow + "</div>"
    );
  }

  function makeTableId() { return "tbl-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7); }
  function makeTimelineId() { return "tl-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7); }

  function renderTimeline() {
    var items = state.timeline.slice().sort(function (a, b) {
      if (!a.time && !b.time) return 0;
      if (!a.time) return 1;
      if (!b.time) return -1;
      return a.time.localeCompare(b.time);
    });
    var rows = items.map(function (it) {
      return '<tr><td class="mono">' + (it.time ? fmtTime(it.time) : "—") + "</td><td>" + escapeHtml(it.title) + "</td><td>" + escapeHtml(it.notes || "") + "</td>" +
        "<td>" + (canWrite ? '<button class="btn btn-ghost btn-sm" data-timeline-remove="' + it.id + '">Remove</button>' : "") + "</td></tr>";
    }).join("");
    var table = items.length ? '<div class="table-scroll"><table><thead><tr><th>Time</th><th>What</th><th>Notes</th><th></th></tr></thead><tbody>' + rows + "</tbody></table></div>" : '<div class="empty-note">No timeline items yet — add the ceremony start, photo blocks, reception cues, whatever the day needs.</div>';
    var addForm = canWrite ? '<div class="grid-3" style="margin-top:1rem"><div class="field"><label for="f-tl-time">Time</label><input type="time" id="f-tl-time"/></div>' +
      '<div class="field"><label for="f-tl-title">What</label><input type="text" id="f-tl-title" placeholder="e.g. Ceremony begins"/></div>' +
      '<div class="field"><label for="f-tl-notes">Notes</label><input type="text" id="f-tl-notes" placeholder="Optional"/></div></div>' +
      '<div class="save-row"><button class="btn btn-secondary" id="add-timeline-btn">Add to timeline</button></div>' : "";
    return '<div class="card"><h2>Day-of timeline</h2><p class="muted">The hour-by-hour schedule for the day itself — separate from the long-lead-time checklist.</p>' + table + addForm + "</div>";
  }

  var seatingView = "visual";

  function seatChipClass(g) {
    if (!g) return "empty";
    if (g.rsvp === "attending") return "filled good";
    if (g.rsvp === "declined") return "filled critical";
    return "filled neutral";
  }

  function guestInitials(name) {
    return (name || "").split(/\s+/).filter(Boolean).map(function (p) { return p[0]; }).slice(0, 2).join("").toUpperCase();
  }

  function renderSeatingVisual(invited) {
    if (!state.tables.length) return '<div class="empty-note">Add a table below to start the seating chart.</div>';
    var cards = state.tables.map(function (t) {
      var seated = invited.filter(function (g) { return g.tableId === t.id; });
      var capacity = Math.max(Number(t.capacity) || 0, seated.length, 1);
      var size = 190, radius = 76, chip = 34, center = size / 2;
      var over = t.capacity && seated.length > Number(t.capacity);
      var seats = [];
      for (var i = 0; i < capacity; i++) {
        var g = seated[i] || null;
        var angle = (360 / capacity) * i - 90;
        var rad = angle * Math.PI / 180;
        var x = center + radius * Math.cos(rad) - chip / 2;
        var y = center + radius * Math.sin(rad) - chip / 2;
        seats.push('<div class="seat-chip ' + seatChipClass(g) + '" style="left:' + x.toFixed(1) + 'px;top:' + y.toFixed(1) + 'px" title="' + (g ? escapeHtml(g.name) + (g.rsvp ? " · " + rsvpLabel(g.rsvp) : "") : "Empty seat") + '"' + (g && canWrite ? ' data-table-unseat="' + g.id + '"' : "") + ">" + (g ? escapeHtml(guestInitials(g.name)) : "") + "</div>");
      }
      return '<div class="seat-visual-wrap"><div class="seat-table-visual' + (over ? " over" : "") + '" style="width:' + size + 'px;height:' + size + 'px">' +
        '<div class="seat-table-center"><div class="tiny">' + seated.length + " / " + (t.capacity || capacity) + "</div></div>" +
        seats.join("") + "</div>" +
        '<div class="seat-visual-name">' + escapeHtml(t.name) + "</div>" +
        (canWrite ? '<button class="seat-remove-link" data-table-remove="' + t.id + '">Remove table</button>' : "") +
        "</div>";
    }).join("");
    return '<div class="seat-visual-grid">' + cards + "</div><p class=\"tiny\" style=\"margin-top:0.75rem\">Click a filled seat to unseat that guest. Colors follow RSVP: green attending, red declined, gray awaiting a response.</p>";
  }

  function renderSeatingList(invited) {
    if (!state.tables.length) return '<div class="empty-note">Add a table below to start the seating chart.</div>';
    return state.tables.map(function (t) {
      var seated = invited.filter(function (g) { return g.tableId === t.id; });
      var over = t.capacity && seated.length > Number(t.capacity);
      var guestRows = seated.map(function (g) {
        return '<div class="import-item"><div style="flex:1">' + escapeHtml(g.name) + "</div>" + (canWrite ? '<button class="btn btn-ghost btn-sm" data-table-unseat="' + g.id + '">Unseat</button>' : "") + "</div>";
      }).join("");
      return '<div class="cat-card" style="margin-bottom:1rem"><div class="cat-card-head"><h3>' + escapeHtml(t.name) + '</h3><span class="pill"><span class="dot ' + (over ? "critical" : "good") + '"></span>' + seated.length + (t.capacity ? " / " + t.capacity : "") + "</span></div><div class=\"cat-card-body\">" +
        (guestRows || '<div class="empty-note">No one seated here yet.</div>') +
        (canWrite ? '<div style="margin-top:0.6rem"><button class="btn btn-ghost btn-sm" data-table-remove="' + t.id + '">Remove table</button></div>' : "") +
        "</div></div>";
    }).join("");
  }

  function renderSeating() {
    var invited = state.guests.filter(function (g) { return g.status === "invite"; });
    var unseated = invited.filter(function (g) { return !g.tableId || !state.tables.some(function (t) { return t.id === g.tableId; }); });

    var toggle = '<div class="filter-group" style="margin-bottom:1rem">' +
      '<button class="filter-btn' + (seatingView === "visual" ? " active" : "") + '" data-seating-view="visual">Visual</button>' +
      '<button class="filter-btn' + (seatingView === "list" ? " active" : "") + '" data-seating-view="list">List</button>' +
      "</div>";
    var tablesBlock = seatingView === "visual" ? renderSeatingVisual(invited) : renderSeatingList(invited);

    var unseatedRows = unseated.length ? '<div class="table-scroll"><table><thead><tr><th>Name</th><th>Assign to table</th></tr></thead><tbody>' +
      unseated.map(function (g) {
        return "<tr><td>" + escapeHtml(g.name) + '</td><td><select data-guest-field="tableId|' + g.id + '" ' + (canWrite ? "" : "disabled") + '><option value="">— unseated —</option>' +
          state.tables.map(function (t) { return '<option value="' + t.id + '">' + escapeHtml(t.name) + "</option>"; }).join("") + "</select></td></tr>";
      }).join("") + "</tbody></table></div>" : '<div class="empty-note">' + (invited.length ? "Everyone invited has a seat." : "Mark guests Invited on the Guest List tab, then seat them here.") + "</div>";

    var addTableForm = canWrite ? '<div class="grid-3" style="margin-top:1rem"><div class="field"><label for="f-table-name">Table name</label><input type="text" id="f-table-name" placeholder="e.g. Table 1"/></div>' +
      '<div class="field"><label for="f-table-capacity">Capacity</label><input type="number" min="1" id="f-table-capacity"/></div></div>' +
      '<div class="save-row"><button class="btn btn-secondary" id="add-table-btn">Add table</button></div>' : "";

    return '<div class="card"><h2>Seating chart</h2><p class="muted">Add tables, then assign each invited guest to one — the visual view updates live from your guest list.</p>' + toggle + tablesBlock + addTableForm + "</div>" +
      '<div class="card"><h3>Unseated</h3>' + unseatedRows + "</div>";
  }

  function renderDayOf() {
    return panel("dayof",
      renderTimeline() + renderSeating() +
      '<div class="save-row"><span class="save-status" id="save-status-badge-5"></span>' + (canWrite ? '<button class="btn btn-primary" id="save-dayof-btn">Save day-of details</button>' : "") + "</div>"
    );
  }

  function renderFooter() {
    return '<footer class="note">Everything here is saved to your shared planner as soon as you hit Save — no need to keep this tab open.</footer>';
  }

  /* ---------- events ---------- */

  function bindEvents() {
    var root = document.getElementById("app-root");

    var logoutBtn = document.getElementById("logout-btn");
    if (logoutBtn) logoutBtn.addEventListener("click", function () {
      fetch("/api/logout", { method: "POST", credentials: "same-origin" }).then(function () {
        currentUser = null;
        state = defaultState();
        render();
      });
    });

    root.querySelectorAll(".tab-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        activeTab = btn.getAttribute("data-tab");
        render();
      });
    });

    var saveProfileBtn = document.getElementById("save-profile-btn");
    if (saveProfileBtn) saveProfileBtn.addEventListener("click", function () {
      var next = clone(state);
      next.profile.coupleNames = val("f-names");
      next.profile.weddingDate = val("f-date");
      next.profile.location = val("f-location");
      next.profile.guestCount = numOrNull(val("f-guests"));
      next.profile.budgetTotal = numOrNull(val("f-budget"));
      next.profile.style = val("f-style");
      next.profile.notes = val("f-notes", true);
      saveState(next, { doneLabel: "Profile saved." });
    });

    root.querySelectorAll("[data-request-cat]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var key = btn.getAttribute("data-request-cat");
        var next = clone(state);
        next.categories[key].requestStatus = "pending";
        next.requests.push({ id: "req-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7), kind: "category", category: key, text: "Find and compare vendors for " + categoryLabel(key) + ".", status: "pending", createdAt: Date.now(), response: null });
        saveState(next, { doneLabel: "Request sent — researching " + categoryLabel(key) + "." });
      });
    });

    var submitReqBtn = document.getElementById("submit-request-btn");
    if (submitReqBtn) submitReqBtn.addEventListener("click", function () {
      var text = val("f-adhoc", true).trim();
      if (!text) return;
      var next = clone(state);
      next.requests.push({ id: "req-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7), kind: "adhoc", category: null, text: text, status: "pending", createdAt: Date.now(), response: null });
      saveState(next, { doneLabel: "Request submitted." });
    });

    root.querySelectorAll("[data-check]").forEach(function (cb) {
      cb.addEventListener("change", function () {
        var id = cb.getAttribute("data-check");
        var next = clone(state);
        next.checklist = next.checklist.map(function (it) { return it.id === id ? Object.assign({}, it, { done: cb.checked }) : it; });
        saveState(next, { doneLabel: "Checklist updated." });
      });
    });

    root.querySelectorAll("[data-remove-check]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-remove-check");
        var next = clone(state);
        next.checklist = next.checklist.filter(function (it) { return it.id !== id; });
        saveState(next, { doneLabel: "Removed." });
      });
    });

    var addCheckBtn = document.getElementById("add-check-btn");
    if (addCheckBtn) addCheckBtn.addEventListener("click", function () {
      var title = val("f-new-check").trim();
      var offsetVal = val("f-new-check-offset");
      if (!title) return;
      var next = clone(state);
      next.checklist.push({ id: "cl-custom-" + Date.now(), title: title, offset: offsetVal ? -Math.abs(Number(offsetVal)) : -30, category: null, done: false, custom: true });
      saveState(next, { doneLabel: "Added to checklist." });
    });

    var saveChecklistBtn = document.getElementById("save-checklist-btn");
    if (saveChecklistBtn) saveChecklistBtn.addEventListener("click", function () { saveState(clone(state), { doneLabel: "Checklist saved." }); });

    root.querySelectorAll("[data-budget-alloc]").forEach(function (inp) {
      inp.addEventListener("change", function () {
        var key = inp.getAttribute("data-budget-alloc");
        state.categories[key].allocated = numOrNull(inp.value);
      });
    });
    root.querySelectorAll("[data-budget-actual]").forEach(function (inp) {
      inp.addEventListener("change", function () {
        var key = inp.getAttribute("data-budget-actual");
        state.categories[key].actual = numOrNull(inp.value);
      });
    });
    var saveBudgetBtn = document.getElementById("save-budget-btn");
    if (saveBudgetBtn) saveBudgetBtn.addEventListener("click", function () { saveState(clone(state), { doneLabel: "Budget saved." }); });

    root.querySelectorAll("[data-budget-view]").forEach(function (btn) {
      btn.addEventListener("click", function () { budgetView = btn.getAttribute("data-budget-view"); render(); });
    });
    root.querySelectorAll("[data-rec-use]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var key = btn.getAttribute("data-rec-use");
        var rec = computeRecommendedBudget();
        var next = clone(state);
        next.categories[key].allocated = rec[key].amount;
        saveState(next, { doneLabel: "Set " + categoryLabel(key) + " to " + fmtMoney(rec[key].amount) + "." });
      });
    });
    var applyEmptyBtn = document.getElementById("apply-recommended-empty-btn");
    if (applyEmptyBtn) applyEmptyBtn.addEventListener("click", function () {
      var rec = computeRecommendedBudget();
      var next = clone(state);
      var filled = 0;
      CATEGORY_META.forEach(function (c) { if (!next.categories[c.key].allocated) { next.categories[c.key].allocated = rec[c.key].amount; filled++; } });
      saveState(next, { doneLabel: filled ? "Filled in " + filled + " empty categor" + (filled === 1 ? "y" : "ies") + "." : "Every category already has a plan." });
    });
    var applyAllBtn = document.getElementById("apply-recommended-all-btn");
    if (applyAllBtn) applyAllBtn.addEventListener("click", function () {
      if (applyAllBtn.getAttribute("data-armed") !== "1") {
        applyAllBtn.setAttribute("data-armed", "1");
        var original = applyAllBtn.textContent;
        applyAllBtn.textContent = "Click again to overwrite all";
        setTimeout(function () { if (applyAllBtn.getAttribute("data-armed") === "1") { applyAllBtn.setAttribute("data-armed", "0"); applyAllBtn.textContent = original; } }, 4000);
        return;
      }
      var rec = computeRecommendedBudget();
      var next = clone(state);
      CATEGORY_META.forEach(function (c) { next.categories[c.key].allocated = rec[c.key].amount; });
      saveState(next, { doneLabel: "Every category set to the recommended amount." });
    });

    root.querySelectorAll("[data-book]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var parts = btn.getAttribute("data-book").split("|");
        var key = parts[0], vendorId = parts[1];
        var next = clone(state);
        var cat = next.categories[key];
        if (cat.bookedVendorId === vendorId) {
          cat.bookedVendorId = null;
        } else {
          cat.bookedVendorId = vendorId;
          var v = cat.vendors.filter(function (x) { return x.id === vendorId; })[0];
          if (v && v.priceValue && !cat.actual) cat.actual = v.priceValue;
        }
        saveState(next, { doneLabel: "Updated." });
      });
    });

    var exportBudgetBtn = document.getElementById("export-budget-btn");
    if (exportBudgetBtn) exportBudgetBtn.addEventListener("click", exportBudget);

    root.querySelectorAll("[data-cat-payment]").forEach(function (inp) {
      inp.addEventListener("change", function () {
        var parts = inp.getAttribute("data-cat-payment").split("|");
        var field = parts[0], key = parts[1];
        var next = clone(state);
        if (!next.categories[key].payment) next.categories[key].payment = defaultPayment();
        next.categories[key].payment[field] = field.indexOf("Amount") >= 0 ? numOrNull(inp.value) : inp.value;
        syncCatActualFromPayments(next.categories[key]);
        saveState(next, { doneLabel: "Payment info saved." });
      });
    });
    root.querySelectorAll("[data-cat-payment-check]").forEach(function (cb) {
      cb.addEventListener("change", function () {
        var parts = cb.getAttribute("data-cat-payment-check").split("|");
        var field = parts[0], key = parts[1];
        var next = clone(state);
        if (!next.categories[key].payment) next.categories[key].payment = defaultPayment();
        next.categories[key].payment[field] = cb.checked;
        syncCatActualFromPayments(next.categories[key]);
        saveState(next, { doneLabel: cb.checked ? "Marked paid." : "Updated." });
      });
    });

    root.querySelectorAll("[data-vendor-score-toggle]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var key = btn.getAttribute("data-vendor-score-toggle");
        expandedVendorScores[key] = !expandedVendorScores[key];
        render();
      });
    });
    root.querySelectorAll("[data-vendor-score]").forEach(function (inp) {
      inp.addEventListener("change", function () {
        var parts = inp.getAttribute("data-vendor-score").split("|");
        var field = parts[0], catKey = parts[1], vendorId = parts[2];
        var next = clone(state);
        var v = next.categories[catKey].vendors.filter(function (x) { return x.id === vendorId; })[0];
        if (v) v[field] = numOrNull(inp.value);
        saveState(next, { doneLabel: "Score saved." });
      });
    });

    /* guest list */

    var fileInput = document.getElementById("guest-file-input");
    if (fileInput) fileInput.addEventListener("change", function () {
      var file = fileInput.files && fileInput.files[0];
      if (!file) return;
      if (isTextLikeFile(file)) {
        var reader = new FileReader();
        reader.onload = function () { importGuestsFromText(String(reader.result || ""), "file"); };
        reader.onerror = function () { showToast("Couldn't read that file."); };
        reader.readAsText(file);
      } else {
        queueFileImport(file, "guests", "");
      }
      fileInput.value = "";
    });

    var vendorDocBtn = document.getElementById("upload-vendor-doc-btn");
    if (vendorDocBtn) vendorDocBtn.addEventListener("click", function () {
      var fileEl = document.getElementById("f-vendor-doc-file");
      var file = fileEl && fileEl.files && fileEl.files[0];
      if (!file) { showToast("Choose a file first."); return; }
      var catKey = val("f-vendor-doc-cat");
      var note = val("f-vendor-doc-note").trim();
      queueFileImport(file, "vendor:" + catKey, note).then(function () { if (fileEl) fileEl.value = ""; });
    });

    var sortSelect = document.getElementById("guest-sort-select");
    if (sortSelect) sortSelect.addEventListener("change", function () { guestSort = sortSelect.value; render(); });

    root.querySelectorAll("[data-guest-toggle]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-guest-toggle");
        expandedGuestIds[id] = !expandedGuestIds[id];
        render();
      });
    });

    var importPasteBtn = document.getElementById("import-paste-btn");
    if (importPasteBtn) importPasteBtn.addEventListener("click", function () {
      var text = val("f-guest-paste", true).trim();
      if (!text) return;
      importGuestsFromText(text, "pasted list");
    });

    var addGuestBtn = document.getElementById("add-guest-btn");
    if (addGuestBtn) addGuestBtn.addEventListener("click", function () {
      var name = val("f-guest-name").trim();
      if (!name) return;
      var sideEl = document.getElementById("f-guest-side");
      var next = clone(state);
      next.guests.push({
        id: makeGuestId(), name: name, side: sideEl ? sideEl.value : "", group: val("f-guest-group").trim(),
        plusOne: !!(document.getElementById("f-guest-plusone") || {}).checked, status: "undecided",
        howYouKnow: "", lastContact: "", closeness: "", notes: "",
        rsvp: "not_sent", mealChoice: "", plusOneName: "", needsHotel: false, hotelBlock: "", arrival: "", departure: "",
        giftReceived: false, giftDescription: "", thankYouSent: false, tableId: ""
      });
      saveState(next, { doneLabel: "Added " + name + "." });
    });

    var templateBtn = document.getElementById("download-template-btn");
    if (templateBtn) templateBtn.addEventListener("click", downloadTemplate);
    var exportBtn = document.getElementById("export-guests-btn");
    if (exportBtn) exportBtn.addEventListener("click", exportGuests);
    var dismissFallbackBtn = document.getElementById("dismiss-fallback-btn");
    if (dismissFallbackBtn) dismissFallbackBtn.addEventListener("click", function () { copyFallback = null; render(); });
    var fallbackText = document.getElementById("copy-fallback-text");
    if (fallbackText) fallbackText.addEventListener("click", function () { fallbackText.select(); });

    root.querySelectorAll("[data-guest-filter]").forEach(function (btn) {
      btn.addEventListener("click", function () { guestFilterStatus = btn.getAttribute("data-guest-filter"); render(); });
    });
    root.querySelectorAll("[data-guest-rsvp-filter]").forEach(function (btn) {
      btn.addEventListener("click", function () { guestRsvpFilter = btn.getAttribute("data-guest-rsvp-filter"); render(); });
    });
    root.querySelectorAll("[data-guest-check]").forEach(function (cb) {
      cb.addEventListener("change", function () {
        var parts = cb.getAttribute("data-guest-check").split("|");
        var field = parts[0], id = parts[1];
        var g = state.guests.filter(function (x) { return x.id === id; })[0];
        if (g) g[field] = cb.checked;
      });
    });
    root.querySelectorAll("[data-guest-groupby]").forEach(function (btn) {
      btn.addEventListener("click", function () { guestGroupBy = btn.getAttribute("data-guest-groupby"); render(); });
    });

    root.querySelectorAll("[data-guest-field]").forEach(function (inp) {
      inp.addEventListener("change", function () {
        var parts = inp.getAttribute("data-guest-field").split("|");
        var field = parts[0], id = parts[1];
        var g = state.guests.filter(function (x) { return x.id === id; })[0];
        if (g) g[field] = inp.value;
      });
    });
    root.querySelectorAll("[data-guest-plusone]").forEach(function (cb) {
      cb.addEventListener("change", function () {
        var id = cb.getAttribute("data-guest-plusone");
        var g = state.guests.filter(function (x) { return x.id === id; })[0];
        if (g) g.plusOne = cb.checked;
      });
    });
    root.querySelectorAll("[data-guest-status]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var parts = btn.getAttribute("data-guest-status").split("|");
        var status = parts[0], id = parts[1];
        var g = state.guests.filter(function (x) { return x.id === id; })[0];
        if (g) g.status = status;
        render();
      });
    });
    root.querySelectorAll("[data-guest-remove]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-guest-remove");
        state.guests = state.guests.filter(function (x) { return x.id !== id; });
        render();
      });
    });
    root.querySelectorAll("[data-guest-bulk]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var parts = btn.getAttribute("data-guest-bulk").split("|");
        var status = parts[0], groupLabel = parts[1];
        state.guests.forEach(function (g) {
          var key = guestGroupBy === "side" ? (g.side || "Unspecified") : (g.group || "Ungrouped");
          if (key === groupLabel) g.status = status;
        });
        render();
      });
    });

    var saveGuestsBtn = document.getElementById("save-guests-btn");
    if (saveGuestsBtn) saveGuestsBtn.addEventListener("click", function () { saveState(clone(state), { doneLabel: "Guest list saved." }); });

    /* day-of: timeline + seating */

    var addTimelineBtn = document.getElementById("add-timeline-btn");
    if (addTimelineBtn) addTimelineBtn.addEventListener("click", function () {
      var title = val("f-tl-title").trim();
      if (!title) return;
      var next = clone(state);
      next.timeline.push({ id: makeTimelineId(), time: val("f-tl-time"), title: title, notes: val("f-tl-notes").trim() });
      saveState(next, { doneLabel: "Added to the timeline." });
    });
    root.querySelectorAll("[data-timeline-remove]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-timeline-remove");
        state.timeline = state.timeline.filter(function (it) { return it.id !== id; });
        render();
      });
    });

    root.querySelectorAll("[data-seating-view]").forEach(function (btn) {
      btn.addEventListener("click", function () { seatingView = btn.getAttribute("data-seating-view"); render(); });
    });

    var addTableBtn = document.getElementById("add-table-btn");
    if (addTableBtn) addTableBtn.addEventListener("click", function () {
      var name = val("f-table-name").trim();
      if (!name) return;
      var next = clone(state);
      next.tables.push({ id: makeTableId(), name: name, capacity: numOrNull(val("f-table-capacity")) });
      saveState(next, { doneLabel: "Added " + name + "." });
    });
    root.querySelectorAll("[data-table-remove]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-table-remove");
        state.tables = state.tables.filter(function (t) { return t.id !== id; });
        state.guests.forEach(function (g) { if (g.tableId === id) g.tableId = ""; });
        render();
      });
    });
    root.querySelectorAll("[data-table-unseat]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-table-unseat");
        var g = state.guests.filter(function (x) { return x.id === id; })[0];
        if (g) g.tableId = "";
        render();
      });
    });

    var saveDayOfBtn = document.getElementById("save-dayof-btn");
    if (saveDayOfBtn) saveDayOfBtn.addEventListener("click", function () { saveState(clone(state), { doneLabel: "Day-of details saved." }); });
  }

  function val(id, isTextarea) { var el = document.getElementById(id); return el ? el.value : ""; }
  function numOrNull(v) { if (v === "" || v === null || v === undefined) return null; var n = Number(v); return isNaN(n) ? null : n; }
  function clone(obj) { return JSON.parse(JSON.stringify(obj)); }

  /* ---------- boot ---------- */

  function loadStateAndRender() {
    fetch("/api/state", { credentials: "same-origin" }).then(function (res) {
      if (res.status === 401) { currentUser = null; render(); return null; }
      return res.json();
    }).then(function (data) {
      if (!data) return;
      applyLoadedState(data.state);
      state._rev = data.rev;
      render();
    }).catch(function (err) {
      console.error(err);
      setSaveStatus("Could not load your data. Refresh to try again.", "err");
    });
  }

  function boot() {
    fetch("/api/me", { credentials: "same-origin" }).then(function (res) { return res.json(); })
      .then(function (data) {
        if (data && data.authenticated) {
          currentUser = data.user;
          loadStateAndRender();
        } else {
          render();
        }
      }).catch(function () {
        render();
      });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
