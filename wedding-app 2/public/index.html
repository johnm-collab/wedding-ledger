  function makeTableId() { return "tbl-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7); }
  function makeTimelineId() { return "tl-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7); }

  function renderTimeline() {
    var items = state.timeline.slice().sort(function (a, b) {
      if (!a.time && !b.time) return 0;
      if (!a.time) return 1;
      if (!b.time) return -1;
      return a.time.localeCompare(b.time);
    });
    var rows = items.map(function (it) {
      return '<tr><td class="mono">' + (it.time ? fmtTime(it.time) : "—") + "</td><td>" + escapeHtml(it.title) + "</td><td>" + escapeHtml(it.notes || "") + "</td>" +
        "<td>" + (canWrite ? '<button class="btn btn-ghost btn-sm" data-timeline-remove="' + it.id + '">Remove</button>' : "") + "</td></tr>";
    }).join("");
    var table = items.length ? '<div class="table-scroll"><table><thead><tr><th>Time</th><th>What</th><th>Notes</th><th></th></tr></thead><tbody>' + rows + "</tbody></table></div>" : '<div class="empty-note">No timeline items yet — add the ceremony start, photo blocks, reception cues, whatever the day needs.</div>';
    var addForm = canWrite ? '<div class="grid-3" style="margin-top:1rem"><div class="field"><label for="f-tl-time">Time</label><input type="time" id="f-tl-time"/></div>' +
      '<div class="field"><label for="f-tl-title">What</label><input type="text" id="f-tl-title" placeholder="e.g. Ceremony begins"/></div>' +
      '<div class="field"><label for="f-tl-notes">Notes</label><input type="text" id="f-tl-notes" placeholder="Optional"/></div></div>' +
      '<div class="save-row"><button class="btn btn-secondary" id="add-timeline-btn">Add to timeline</button></div>' : "";
    return '<div class="card"><h2>Day-of timeline</h2><p class="muted">The hour-by-hour schedule for the day itself — separate from the long-lead-time checklist.</p>' + table + addForm + "</div>";
  }

  var seatingView = "visual";
  var seatingFullscreen = false;

  function seatChipClass(g) {
    if (!g) return "empty";
    if (g.rsvp === "attending") return "filled good";
    if (g.rsvp === "declined") return "filled critical";
    return "filled neutral";
  }

  // Tables with no saved position yet (created before the free-form floor
  // plan existed, or just added) fall back to a stable, deterministic grid
  // position based on their index — so nothing starts stacked at 0,0. Once
  // a table is dragged, its real x/y is saved and this fallback no longer
  // applies to it.
  function tablePosition(t, idx) {
    if (typeof t.x === "number" && typeof t.y === "number") return { x: t.x, y: t.y };
    var col = idx % 3, row = Math.floor(idx / 3);
    // Kept well clear of the canvas edges (28-92% / 30-90%) — a table's
    // ring of seats is much bigger than the table itself, so a position
    // too close to the top used to bleed outside the canvas and sit on top
    // of the Visual/List toggle buttons above it, silently blocking clicks.
    return { x: 28 + col * 32, y: 30 + row * 34 };
  }

  // Walks the perimeter of a `w` x `h` rectangle centered on the origin,
  // starting at the top-middle and going clockwise, returning the point at
  // arc-length `dist` along that perimeter. Used to lay seats evenly around
  // a rectangular table (proportionally more seats along the long sides).
  function pointOnRectPerimeter(dist, w, h) {
    var perim = 2 * (w + h);
    dist = ((dist % perim) + perim) % perim;
    var halfW = w / 2, halfH = h / 2;
    var topLen = w / 2;
    if (dist <= topLen) return { x: dist, y: -halfH };
    dist -= topLen;
    if (dist <= h) return { x: halfW, y: -halfH + dist };
    dist -= h;
    if (dist <= w) return { x: halfW - dist, y: halfH };
    dist -= w;
    if (dist <= h) return { x: -halfW, y: halfH - dist };
    dist -= h;
    return { x: -halfW + dist, y: -halfH };
  }

  // Rotates an (x,y) offset from a table's center by `deg` degrees, so a
  // rotated table's seats stay lined up with its (also rotated) edges
  // instead of sitting where the seats would be at rotation 0.
  function rotateOffset(x, y, deg) {
    if (!deg) return { x: x, y: y };
    var rad = deg * Math.PI / 180;
    var cos = Math.cos(rad), sin = Math.sin(rad);
    return { x: x * cos - y * sin, y: x * sin + y * cos };
  }

  function renderSeatingVisual(invited) {
    if (!state.tables.length) return '<div class="empty-note">Add a table below to start the seating chart.</div>';
    var pillWidth = 108, pillGap = 16;
    var cards = state.tables.map(function (t, idx) {
      var seated = invited.filter(function (g) { return g.tableId === t.id; });
      var capacity = Math.max(Number(t.capacity) || 0, seated.length, 1);
      var over = t.capacity && seated.length > Number(t.capacity);
      var shape = t.shape === "rectangle" ? "rectangle" : "round";
      var rotation = Number(t.rotation) || 0;
      var pos = tablePosition(t, idx);
      var seats = [];
      var size, center, tableW, tableH;

      if (shape === "rectangle") {
        // The table grows with capacity (long side scales), seats walk an
        // evenly-spaced loop just outside the table's own edges.
        tableW = Math.min(220, Math.max(120, capacity * 15));
        tableH = 72;
        var seatGap = 14;
        var loopW = tableW + seatGap * 2, loopH = tableH + seatGap * 2;
        size = Math.round(Math.max(loopW, loopH) + pillWidth + 48);
        center = size / 2;
        var loopPerim = 2 * (loopW + loopH);
        for (var i = 0; i < capacity; i++) {
          var g = seated[i] || null;
          var pt = pointOnRectPerimeter((loopPerim / capacity) * i, loopW, loopH);
          var off = rotateOffset(pt.x, pt.y, rotation);
          seats.push(seatHtml(g, center + off.x, center + off.y));
        }
      } else {
        // The table itself grows a little with capacity so bigger tables
        // read as bigger, and the ring of name pills sits far enough
        // outside it (based on how many seats have to fit around the
        // circumference) that neighboring names don't overlap.
        tableW = tableH = Math.min(150, Math.max(84, capacity * 9));
        var tableRadius = tableW / 2;
        var seatRadius = Math.max(tableRadius + 46, (capacity * (pillWidth + pillGap)) / (2 * Math.PI));
        size = Math.round(seatRadius * 2 + pillWidth + 24);
        center = size / 2;
        for (var j = 0; j < capacity; j++) {
          var g2 = seated[j] || null;
          var angle = (360 / capacity) * j - 90;
          var rad = angle * Math.PI / 180;
          var off2 = rotateOffset(seatRadius * Math.cos(rad), seatRadius * Math.sin(rad), rotation);
          seats.push(seatHtml(g2, center + off2.x, center + off2.y));
        }
      }

      // The shape itself is rotated; its name/count label is counter-
      // rotated by the same amount so the text always reads upright, and
      // sits directly inside the table shape (not floating below the whole
      // stage) so it's easy to tell which label belongs to which table.
      var shapeTransform = "translate(-50%,-50%)" + (rotation ? " rotate(" + rotation + "deg)" : "");
      var centerTransform = "translate(-50%,-50%)" + (rotation ? " rotate(" + (-rotation) + "deg)" : "");

      return '<div class="floor-table" data-table-id="' + t.id + '" style="left:' + pos.x + '%;top:' + pos.y + '%">' +
        '<div class="seat-visual-stage" style="width:' + size + 'px;height:' + size + 'px">' +
        '<div class="seat-table-visual ' + shape + (over ? " over" : "") + '" style="width:' + tableW + 'px;height:' + tableH + 'px;left:' + center + 'px;top:' + center + 'px;transform:' + shapeTransform + '"' + (canWrite ? ' data-table-drag="' + t.id + '"' : "") + '>' +
        '<div class="seat-table-center" style="transform:' + centerTransform + '"><div class="tiny seat-table-name">' + escapeHtml(t.name) + '</div><div class="tiny">' + seated.length + " / " + (t.capacity || capacity) + "</div></div>" +
        "</div>" + seats.join("") + "</div>" +
        (canWrite ? '<div class="floor-table-actions"><button class="seat-remove-link" data-table-rotate="' + t.id + '">Rotate ⟳</button><button class="seat-remove-link" data-table-remove="' + t.id + '">Remove</button></div>' : "") +
        "</div>";
    }).join("");
    return '<div class="floor-plan-canvas' + (seatingFullscreen ? " fullscreen" : "") + '" id="floor-plan-canvas">' +
      (seatingFullscreen ? '<button class="btn btn-secondary btn-sm floor-plan-exit" id="exit-fullscreen-btn" type="button">✕ Exit full screen</button>' : "") +
      cards + "</div>" +
      (seatingFullscreen ? '<div class="floor-plan-backdrop" id="floor-plan-backdrop"></div>' : "") +
      '<p class="tiny" style="margin-top:0.75rem">' + (canWrite ? "Drag a table to rearrange the floor plan. " : "") + 'Click a name to unseat that guest. Colors follow RSVP: green attending, red declined, gray awaiting a response.</p>';
  }

  // "Alex Chen" -> "Alex C." — keeps pills legible in a crowded floor
  // plan; the full name is still always available in the tooltip and in
  // the List view.
  function shortGuestName(name) {
    var parts = (name || "").trim().split(/\s+/).filter(Boolean);
    if (parts.length < 2) return name || "";
    return parts[0] + " " + parts[parts.length - 1].charAt(0).toUpperCase() + ".";
  }

  function seatHtml(g, x, y) {
    if (g) {
      return '<div class="seat-pill ' + seatChipClass(g) + '" style="left:' + x.toFixed(1) + 'px;top:' + y.toFixed(1) + 'px" title="' + escapeHtml(g.name) + (g.rsvp ? " · " + rsvpLabel(g.rsvp) : "") + '"' + (canWrite ? ' data-table-unseat="' + g.id + '"' : "") + ">" + escapeHtml(shortGuestName(g.name)) + "</div>";
    }
    return '<div class="seat-dot" style="left:' + x.toFixed(1) + 'px;top:' + y.toFixed(1) + 'px" title="Empty seat"></div>';
  }

  function renderSeatingList(invited) {
    if (!state.tables.length) return '<div class="empty-note">Add a table below to start the seating chart.</div>';
    return state.tables.map(function (t) {
      var seated = invited.filter(function (g) { return g.tableId === t.id; });
      var over = t.capacity && seated.length > Number(t.capacity);
      var guestRows = seated.map(function (g) {
        return '<div class="import-item"><div style="flex:1">' + escapeHtml(g.name) + "</div>" + (canWrite ? '<button class="btn btn-ghost btn-sm" data-table-unseat="' + g.id + '">Unseat</button>' : "") + "</div>";
      }).join("");
      return '<div class="cat-card" style="margin-bottom:1rem"><div class="cat-card-head"><h3>' + escapeHtml(t.name) + '</h3><span class="pill"><span class="dot ' + (over ? "critical" : "good") + '"></span>' + seated.length + (t.capacity ? " / " + t.capacity : "") + "</span></div><div class=\"cat-card-body\">" +
        (guestRows || '<div class="empty-note">No one seated here yet.</div>') +
        (canWrite ? '<div style="margin-top:0.6rem"><button class="btn btn-ghost btn-sm" data-table-remove="' + t.id + '">Remove table</button></div>' : "") +
        "</div></div>";
    }).join("");
  }

  function renderSeating() {
    // Seating-eligible = RSVP'd attending. A guest already seated stays
    // visible even if their RSVP later changes, so a table assignment never
    // just silently vanishes — but the normal path onto this tab is
    // clicking "Attending" on the Guest List tab.
    var invited = state.guests.filter(function (g) { return g.rsvp === "attending" || !!g.tableId; });
    var unseated = invited.filter(function (g) { return !g.tableId || !state.tables.some(function (t) { return t.id === g.tableId; }); });

    var toggle = '<div class="filter-group seating-toolbar" style="margin-bottom:1rem">' +
      '<div><button class="filter-btn' + (seatingView === "visual" ? " active" : "") + '" data-seating-view="visual">Visual</button>' +
      '<button class="filter-btn' + (seatingView === "list" ? " active" : "") + '" data-seating-view="list">List</button></div>' +
      '<div>' + (seatingView === "visual" ? '<button class="btn btn-secondary btn-sm" id="fullscreen-seating-btn" type="button">' + (seatingFullscreen ? "Exit full screen" : "⤢ Full screen") + "</button> " : "") +
      '<button class="btn btn-secondary btn-sm" id="print-seating-btn" type="button">🖨 Print run sheet</button></div>' +
      "</div>";
    var tablesBlock = seatingView === "visual" ? renderSeatingVisual(invited) : renderSeatingList(invited);

    var unseatedRows = unseated.length ? '<div class="table-scroll"><table><thead><tr><th>Name</th><th>Assign to table</th></tr></thead><tbody>' +
      unseated.map(function (g) {
        return "<tr><td>" + escapeHtml(g.name) + '</td><td><select data-guest-field="tableId|' + g.id + '" ' + (canWrite ? "" : "disabled") + '><option value="">— unseated —</option>' +
          state.tables.map(function (t) { return '<option value="' + t.id + '">' + escapeHtml(t.name) + "</option>"; }).join("") + "</select></td></tr>";
      }).join("") + "</tbody></table></div>" : '<div class="empty-note">' + (invited.length ? "Everyone attending has a seat." : "Mark guests “Attending” on the Guest List tab and they’ll show up here to seat.") + "</div>";

    var addTableForm = canWrite ? '<div class="grid-3" style="margin-top:1rem"><div class="field"><label for="f-table-name">Table name</label><input type="text" id="f-table-name" placeholder="e.g. Table 1"/></div>' +
      '<div class="field"><label for="f-table-capacity">Capacity</label><input type="number" min="1" id="f-table-capacity"/></div>' +
      '<div class="field"><label for="f-table-shape">Shape</label><select id="f-table-shape"><option value="round">Round</option><option value="rectangle">Rectangular</option></select></div></div>' +
      '<div class="save-row"><button class="btn btn-secondary" id="add-table-btn">Add table</button></div>' : "";

    return '<div class="card"><h2>Seating chart</h2><p class="muted">Add tables, then assign each invited guest to one — the visual view updates live from your guest list. Round or rectangular, and drag any table to lay out the room.</p>' + toggle + tablesBlock + addTableForm + "</div>" +
      '<div class="card"><h3>Unseated</h3>' + unseatedRows + "</div>" +
      '<div class="save-row"><span class="save-status" id="save-status-badge-6"></span>' + (canWrite ? '<button class="btn btn-primary" id="save-seating-btn">Save seating chart</button>' : "") + "</div>" +
      renderSeatingPrintSheet(invited);
  }

  // A plain, page-friendly table-by-table list plus the day's schedule —
  // hidden on screen (see .print-run-sheet CSS), shown only when the
  // "Print run sheet" button triggers window.print().
  function renderSeatingPrintSheet(invited) {
    var p = state.profile;
    var header = '<div class="prs-header" style="margin-bottom:1rem"><h2 style="margin-bottom:0.2rem">' + escapeHtml(p.coupleNames || "Our Wedding") + " — Seating & Day-Of Run Sheet</h2>" +
      '<div class="tiny">' + [p.weddingDate ? fmtDate(new Date(p.weddingDate + "T00:00:00")) : "", p.location].filter(Boolean).join(" · ") + "</div></div>";

    var tablesHtml = state.tables.length ? state.tables.map(function (t) {
      var seated = invited.filter(function (g) { return g.tableId === t.id; });
      return '<div class="prs-table"><h4>' + escapeHtml(t.name) + (t.capacity ? " (" + seated.length + "/" + t.capacity + ")" : " (" + seated.length + ")") + "</h4>" +
        (seated.length ? "<ul>" + seated.map(function (g) { return "<li>" + escapeHtml(g.name) + (g.mealChoice ? " — " + escapeHtml(g.mealChoice) : "") + "</li>"; }).join("") + "</ul>" : '<div class="tiny">Empty</div>') +
        "</div>";
    }).join("") : '<div class="tiny">No tables added yet.</div>';

    var unseated = invited.filter(function (g) { return !g.tableId; });
    var unseatedHtml = unseated.length ? '<div class="prs-table"><h4>Unseated</h4><ul>' + unseated.map(function (g) { return "<li>" + escapeHtml(g.name) + "</li>"; }).join("") + "</ul></div>" : "";

    var scheduleHtml = state.timeline.length ? '<div class="prs-table"><h4>Schedule</h4><ul>' +
      state.timeline.slice().sort(function (a, b) { return (a.time || "").localeCompare(b.time || ""); }).map(function (t) {
        return "<li><strong>" + escapeHtml(fmtTime(t.time)) + "</strong> — " + escapeHtml(t.title) + (t.notes ? " (" + escapeHtml(t.notes) + ")" : "") + "</li>";
      }).join("") + "</ul></div>" : "";

    return '<div class="print-run-sheet">' + header + tablesHtml + unseatedHtml + scheduleHtml + "</div>";
  }

  function renderSeatingTab() {
    return panel("seating", renderSeating());
  }

  function renderDayOf() {
    return panel("dayof",
      renderTimeline() +
      '<div class="save-row"><span class="save-status" id="save-status-badge-5"></span>' + (canWrite ? '<button class="btn btn-primary" id="save-dayof-btn">Save timeline</button>' : "") + "</div>"
    );
  }

  function renderFooter() {
    return '<footer class="note">Everything here is saved to your shared planner as soon as you hit Save — no need to keep this tab open.</footer>';
  }

  /* ---------- events ---------- */

  function bindEvents() {
    var root = document.getElementById("app-root");

    var logoutBtn = document.getElementById("logout-btn");
    if (logoutBtn) logoutBtn.addEventListener("click", function () {
      fetch("/api/logout", { method: "POST", credentials: "same-origin" }).then(function () {
        currentUser = null;
        state = defaultState();
        render();
      });
    });

    root.querySelectorAll(".tab-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        activeTab = btn.getAttribute("data-tab");
        render();
      });
    });

    var saveProfileBtn = document.getElementById("save-profile-btn");
    if (saveProfileBtn) saveProfileBtn.addEventListener("click", function () {
      var next = clone(state);
      next.profile.coupleNames = val("f-names");
      next.profile.weddingDate = val("f-date");
      next.profile.location = val("f-location");
      next.profile.address = val("f-address");
      next.profile.guestCount = numOrNull(val("f-guests"));
      next.profile.budgetTotal = numOrNull(val("f-budget"));
      next.profile.style = val("f-style");
      next.profile.notes = val("f-notes", true);
      saveState(next, { doneLabel: "Profile saved." });
    });

    var changePasswordBtn = document.getElementById("change-password-btn");
    if (changePasswordBtn) changePasswordBtn.addEventListener("click", function () {
      var currentPassword = val("f-current-password");
      var newPassword = val("f-new-password");
      changePasswordMsg = "";
      changePasswordErr = "";
      if (!currentPassword || !newPassword) {
        changePasswordErr = "Enter your current and new password.";
        render();
        return;
      }
      if (newPassword.length < 8) {
        changePasswordErr = "New password must be at least 8 characters.";
        render();
        return;
      }
      changePasswordBtn.disabled = true;
      changePasswordBtn.textContent = "Changing…";
      fetch("/api/change-password", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ currentPassword: currentPassword, newPassword: newPassword })
      }).then(function (res) {
        if (res.status === 401) { currentUser = null; render(); return null; }
        return res.json().then(function (data) { return { ok: res.ok, data: data }; });
      }).then(function (r) {
        if (!r) return;
        if (!r.ok) {
          changePasswordErr = (r.data && r.data.error) || "Could not change your password.";
          render();
          return;
        }
        changePasswordMsg = "Password changed.";
        render();
      }).catch(function () {
        changePasswordErr = "Network error — try again.";
        render();
      });
    });

    root.querySelectorAll("[data-colorway-pick]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var key = btn.getAttribute("data-colorway-pick");
        if (key === (state.settings && state.settings.colorway)) return;
        applyColorway(key); // instant preview, doesn't wait on the save round-trip
        var next = clone(state);
        next.settings = Object.assign({}, next.settings, { colorway: key });
        var picked = COLORWAYS.filter(function (c) { return c.key === key; })[0];
        saveState(next, { doneLabel: (picked ? picked.label : "Colorway") + " applied." }).then(function () {
          // If the save failed or hit a conflict, fall back to whatever
          // colorway the reconciled/reverted state actually has.
          applyColorway(state.settings && state.settings.colorway);
        });
      });
    });

    root.querySelectorAll("[data-request-cat]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var key = btn.getAttribute("data-request-cat");
        var next = clone(state);
        next.categories[key].requestStatus = "pending";
        next.requests.push({ id: "req-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7), kind: "category", category: key, text: "Find and compare vendors for " + categoryLabel(key) + ".", status: "pending", createdAt: Date.now(), response: null });
        saveState(next, { doneLabel: "Request sent — researching " + categoryLabel(key) + "." });
      });
    });

    var submitReqBtn = document.getElementById("submit-request-btn");
    if (submitReqBtn) submitReqBtn.addEventListener("click", function () {
      var text = val("f-adhoc", true).trim();
      if (!text) return;
      var next = clone(state);
      next.requests.push({ id: "req-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7), kind: "adhoc", category: null, text: text, status: "pending", createdAt: Date.now(), response: null });
      saveState(next, { doneLabel: "Request submitted." });
    });

    root.querySelectorAll("[data-check]").forEach(function (cb) {
      cb.addEventListener("change", function () {
        var id = cb.getAttribute("data-check");
        var next = clone(state);
        next.checklist = next.checklist.map(function (it) { return it.id === id ? Object.assign({}, it, { done: cb.checked }) : it; });
        saveState(next, { doneLabel: "Checklist updated." });
      });
    });

    root.querySelectorAll("[data-remove-check]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-remove-check");
        var next = clone(state);
        next.checklist = next.checklist.filter(function (it) { return it.id !== id; });
        saveState(next, { doneLabel: "Removed." });
      });
    });

    var addCheckBtn = document.getElementById("add-check-btn");
    if (addCheckBtn) addCheckBtn.addEventListener("click", function () {
      var title = val("f-new-check").trim();
      var offsetVal = val("f-new-check-offset");
      if (!title) return;
      var next = clone(state);
      next.checklist.push({ id: "cl-custom-" + Date.now(), title: title, offset: offsetVal ? -Math.abs(Number(offsetVal)) : -30, category: null, done: false, custom: true });
      saveState(next, { doneLabel: "Added to checklist." });
    });

    var saveChecklistBtn = document.getElementById("save-checklist-btn");
    if (saveChecklistBtn) saveChecklistBtn.addEventListener("click", function () { saveState(clone(state), { doneLabel: "Checklist saved." }); });

    root.querySelectorAll("[data-budget-alloc]").forEach(function (inp) {
      inp.addEventListener("change", function () {
        var key = inp.getAttribute("data-budget-alloc");
        state.categories[key].allocated = numOrNull(inp.value);
      });
    });
    root.querySelectorAll("[data-budget-actual]").forEach(function (inp) {
      inp.addEventListener("change", function () {
        var key = inp.getAttribute("data-budget-actual");
        state.categories[key].actual = numOrNull(inp.value);
      });

    // Dragging a table: move it live with plain style updates on the one
    // element being dragged (not a full render(), which would rebuild the
    // whole app and interrupt the gesture), and only commit the new
    // position into `state` — for the next Save click — once the drag ends.
    root.querySelectorAll("[data-table-drag]").forEach(function (shapeEl) {
      shapeEl.addEventListener("pointerdown", function (e) {
        if (e.button !== undefined && e.button !== 0) return;
        var tableId = shapeEl.getAttribute("data-table-drag");
        var wrap = shapeEl.closest(".floor-table");
        var canvas = document.getElementById("floor-plan-canvas");
        if (!wrap || !canvas) return;
        e.preventDefault();
        shapeEl.setPointerCapture(e.pointerId);
        var canvasRect = canvas.getBoundingClientRect();
        wrap.classList.add("dragging");
        var pendingX = null, pendingY = null;
        function onMove(ev) {
          var xPct = ((ev.clientX - canvasRect.left) / canvasRect.width) * 100;
          var yPct = ((ev.clientY - canvasRect.top) / canvasRect.height) * 100;
          xPct = Math.max(4, Math.min(96, xPct));
          yPct = Math.max(6, Math.min(94, yPct));
          wrap.style.left = xPct.toFixed(2) + "%";
          wrap.style.top = yPct.toFixed(2) + "%";
          pendingX = xPct;
          pendingY = yPct;
        }
        function onUp() {
          shapeEl.removeEventListener("pointermove", onMove);
          shapeEl.removeEventListener("pointerup", onUp);
          shapeEl.removeEventListener("pointercancel", onUp);
          wrap.classList.remove("dragging");
          if (pendingX !== null) {
            var t = state.tables.filter(function (x) { return x.id === tableId; })[0];
            if (t) { t.x = pendingX; t.y = pendingY; }
          }
        }
        shapeEl.addEventListener("pointermove", onMove);
        shapeEl.addEventListener("pointerup", onUp);
        shapeEl.addEventListener("pointercancel", onUp);
      });
    });

  function val(id, isTextarea) { var el = document.getElementById(id); return el ? el.value : ""; }
  function numOrNull(v) { if (v === "" || v === null || v === undefined) return null; var n = Number(v); return isNaN(n) ? null : n; }
  function clone(obj) { return JSON.parse(JSON.stringify(obj)); }

  /* ---------- boot ---------- */

  function loadStateAndRender() {
    fetch("/api/state", { credentials: "same-origin" }).then(function (res) {
      if (res.status === 401) { currentUser = null; render(); return null; }
      return res.json();
    }).then(function (data) {
      if (!data) return;
      applyLoadedState(data.state);
      state._rev = data.rev;
      render();
    }).catch(function (err) {
      console.error(err);
      setSaveStatus("Could not load your data. Refresh to try again.", "err");
    });
  }

  // Bound once (not inside bindEvents, which reruns on every render — that
  // would stack up a fresh listener each time). Lets Escape close the
  // full-screen floor plan from anywhere, same as the ✕ button or backdrop.
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && seatingFullscreen) {
      seatingFullscreen = false;
      render();
    }
  });

  /* ---------- guest portal (unauthenticated, token-gated RSVP page) ----------
     Reached at /rsvp/<token> — completely separate from the login/app-shell
     flow above (no session, no `state`, no access to budget/vendors/other
     guests). It only ever talks to /api/guest-portal/:token, which the
     server scopes to just this token's household (or single guest). */
  var portalToken = null;
  var portalData = null;
  var portalError = "";
  var portalSaving = false;
  var portalDone = false;

  var PORTAL_RSVP_CHOICES = [
    { value: "attending", label: "Joyfully accepts" },
    { value: "declined", label: "Regretfully declines" }
  ];

  function loadGuestPortal(token) {
    portalToken = token;
    fetch("/api/guest-portal/" + encodeURIComponent(token), { credentials: "same-origin" })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (!r.ok) {
          portalError = (r.data && r.data.error) || "This RSVP link isn't valid.";
        } else {
          portalData = r.data;
          // Local edit buffer, seeded from the server's current values.
          portalData.members.forEach(function (m) { m._draft = { rsvp: m.rsvp, mealChoice: m.mealChoice, email: m.email }; });
        }
        renderGuestPortalPage();
      }).catch(function () {
        portalError = "Network error — try reloading this page.";
        renderGuestPortalPage();
      });
  }

  function renderGuestPortalPage() {
    var root = document.getElementById("app-root");
    if (portalError) {
      root.innerHTML = '<div class="portal-shell"><h1>The Wedding Ledger</h1>' +
        '<div class="login-error">' + escapeHtml(portalError) + "</div></div>";
      return;
    }
    if (!portalData) {
      root.innerHTML = '<div class="portal-shell"><h1>The Wedding Ledger</h1><div class="portal-sub">Loading your invitation…</div></div>';
      return;
    }
    var p = portalData.profile || {};
    var dateStr = p.weddingDate ? fmtDate(new Date(p.weddingDate + "T00:00:00")) : "";
    var scheduleHtml = (portalData.timeline || []).length
      ? '<div class="portal-card"><h2>Schedule</h2>' + portalData.timeline.map(function (t) {
          return '<div class="portal-schedule-item"><div class="ps-time">' + escapeHtml(t.time || "") + '</div><div>' + escapeHtml(t.title || "") + "</div>" +
            (t.notes ? '<div class="tiny">' + escapeHtml(t.notes) + "</div>" : "") + "</div>";
        }).join("") + "</div>"
      : "";

    var doneHtml = portalDone ? '<div class="login-notice">Thank you — your RSVP is saved. You can come back to this link any time to update it.</div>' : "";

    var membersHtml = portalData.members.map(function (m) {
      return '<div class="portal-member"><h3>' + escapeHtml(m.name) + "</h3>" +
        '<div class="field"><label>Will you be attending?</label><div class="portal-rsvp-choices">' +
        PORTAL_RSVP_CHOICES.map(function (c) {
          return '<label><input type="radio" name="portal-rsvp-' + m.id + '" value="' + c.value + '" data-portal-rsvp="' + m.id + '"' + (m._draft.rsvp === c.value ? " checked" : "") + "/>" + c.label + "</label>";
        }).join("") + "</div></div>" +
        (m._draft.rsvp === "attending" ? '<div class="field"><label>Meal choice</label><input type="text" data-portal-meal="' + m.id + '" value="' + escapeHtml(m._draft.mealChoice || "") + '" placeholder="e.g. Vegetarian, no allergies"/></div>' : "") +
        '<div class="field"><label>Email (optional — for updates from us)</label><input type="email" data-portal-email="' + m.id + '" value="' + escapeHtml(m._draft.email || "") + '" placeholder="name@example.com"/></div>' +
        "</div>";
    }).join("");

    root.innerHTML = '<div class="portal-shell"><h1>' + escapeHtml(p.coupleNames || "Our Wedding") + "</h1>" +
      '<div class="portal-sub">' + [dateStr, p.location].filter(Boolean).join(" · ") + (p.address ? "<br/>" + escapeHtml(p.address) : "") + "</div>" +
      doneHtml + scheduleHtml +
      '<div class="portal-card"><h2>RSVP' + (portalData.householdName ? " — " + escapeHtml(portalData.householdName) : "") + "</h2>" +
      '<p class="muted">Let us know if ' + (portalData.members.length > 1 ? "each of you" : "you") + " can make it.</p>" +
      membersHtml +
      (portalError ? '<div class="login-error">' + escapeHtml(portalError) + "</div>" : "") +
      '<div class="save-row"><button class="btn btn-primary" id="portal-submit-btn"' + (portalSaving ? " disabled" : "") + ">" + (portalSaving ? "Saving…" : "Save RSVP") + "</button></div></div></div>";

    bindGuestPortalEvents();
  }

  function bindGuestPortalEvents() {
    var root = document.getElementById("app-root");
    root.querySelectorAll("[data-portal-rsvp]").forEach(function (el) {
      el.addEventListener("change", function () {
        var id = el.getAttribute("data-portal-rsvp");
        var m = portalData.members.filter(function (x) { return x.id === id; })[0];
        if (m && el.checked) { m._draft.rsvp = el.value; renderGuestPortalPage(); }
      });
    });
    root.querySelectorAll("[data-portal-meal]").forEach(function (el) {
      el.addEventListener("change", function () {
        var id = el.getAttribute("data-portal-meal");
        var m = portalData.members.filter(function (x) { return x.id === id; })[0];
        if (m) m._draft.mealChoice = el.value;
      });
    });
    root.querySelectorAll("[data-portal-email]").forEach(function (el) {
      el.addEventListener("change", function () {
        var id = el.getAttribute("data-portal-email");
        var m = portalData.members.filter(function (x) { return x.id === id; })[0];
        if (m) m._draft.email = el.value;
      });
    });
    var submitBtn = document.getElementById("portal-submit-btn");
    if (submitBtn) submitBtn.addEventListener("click", function () {
      portalSaving = true;
      portalError = "";
      renderGuestPortalPage();
      var updates = portalData.members.map(function (m) {
        return { id: m.id, rsvp: m._draft.rsvp, mealChoice: m._draft.mealChoice, email: m._draft.email };
      });
      fetch("/api/guest-portal/" + encodeURIComponent(portalToken), {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ updates: updates })
      }).then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
        .then(function (r) {
          portalSaving = false;
          if (!r.ok) {
            portalError = (r.data && r.data.error) || "Could not save your RSVP.";
          } else {
            portalDone = true;
            portalData.members.forEach(function (m) { m.rsvp = m._draft.rsvp; m.mealChoice = m._draft.mealChoice; m.email = m._draft.email; });
          }
          renderGuestPortalPage();
        }).catch(function () {
          portalSaving = false;
          portalError = "Network error — try again.";
          renderGuestPortalPage();
        });
    });
  }

  function boot() {
    // A guest RSVP link lands here as /rsvp/<token> — a completely separate,
    // unauthenticated flow that never touches the couple's login or state.
    var portalMatch = /^\/rsvp\/([^\/?#]+)/.exec(window.location.pathname);
    if (portalMatch) {
      loadGuestPortal(decodeURIComponent(portalMatch[1]));
      renderGuestPortalPage();
      return;
    }

    // A password-reset email link lands here as /?resetToken=... — grab it
    // and scrub it from the URL bar so a reload/bookmark doesn't resubmit
    // (or leak) the token.
    var params = new URLSearchParams(window.location.search);
    var tokenFromUrl = params.get("resetToken");
    if (tokenFromUrl) {
      pendingResetToken = tokenFromUrl;
      var cleanUrl = window.location.pathname + window.location.hash;
      window.history.replaceState({}, document.title, cleanUrl);
      render();
      return;
    }
    fetch("/api/me", { credentials: "same-origin" }).then(function (res) { return res.json(); })
      .then(function (data) {
        if (data && data.authenticated) {
          currentUser = data.user;
          loadStateAndRender();
        } else {
          render();
        }
      }).catch(function () {
        render();
      });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
