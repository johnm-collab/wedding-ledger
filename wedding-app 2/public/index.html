<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Wedding Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --paper: #eeeef2;
    --paper-2: #e7e7ee;
    --surface: #fbfbfd;
    --ink: #23253a;
    --ink-2: #5b5e72;
    --ink-muted: #898c9e;
    --line: #d9d9e2;
    --line-strong: #c3c3d1;
    --accent: #33406b;
    --accent-ink: #ffffff;
    --accent-soft: #e3e6f0;
    --brass: #a8843d;
    --brass-soft: #f1e7d2;
    --brass-ink: #4a3a13;
    --good: #0ca30c;
    --good-soft: #e3f4e0;
    --warning: #b8790a;
    --warning-soft: #fbeed3;
    --critical: #b23a3a;
    --critical-soft: #f8e2e0;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --shadow: 0 1px 2px rgba(35,37,58,0.06), 0 8px 24px -12px rgba(35,37,58,0.18);
    --radius: 10px;
    font-size: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #15161f;
      --paper-2: #1a1b26;
      --surface: #1e1f2b;
      --ink: #e9e9f2;
      --ink-2: #a7a9c0;
      --ink-muted: #7d7f97;
      --line: #34364c;
      --line-strong: #454863;
      --accent: #8b9bd6;
      --accent-ink: #171a2b;
      --accent-soft: #262c47;
      --brass: #d2ae6b;
      --brass-soft: #362c17;
      --brass-ink: #ecd8a8;
      --good: #4fbe4f;
      --good-soft: #1c3320;
      --warning: #e0a930;
      --warning-soft: #3a2e13;
      --critical: #e37b7b;
      --critical-soft: #3a2020;
      --series-1: #3987e5;
      --series-2: #d95926;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #15161f;
    --paper-2: #1a1b26;
    --surface: #1e1f2b;
    --ink: #e9e9f2;
    --ink-2: #a7a9c0;
    --ink-muted: #7d7f97;
    --line: #34364c;
    --line-strong: #454863;
    --accent: #8b9bd6;
    --accent-ink: #171a2b;
    --accent-soft: #262c47;
    --brass: #d2ae6b;
    --brass-soft: #362c17;
    --brass-ink: #ecd8a8;
    --good: #4fbe4f;
    --good-soft: #1c3320;
    --warning: #e0a930;
    --warning-soft: #3a2e13;
    --critical: #e37b7b;
    --critical-soft: #3a2020;
    --series-1: #3987e5;
    --series-2: #d95926;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
  a { color: var(--accent); }
  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; text-wrap: balance; margin: 0; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  button { font-family: inherit; }
  input, textarea, select {
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    padding: 0.55em 0.7em;
    width: 100%;
  }
  input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--ink-2); margin-bottom: 0.35em; letter-spacing: 0.01em; }
  .field { display: flex; flex-direction: column; gap: 0; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.5em;
    padding: 0.6em 1.1em; border-radius: 7px; border: 1px solid transparent;
    font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: filter 0.12s ease, transform 0.05s ease;
    white-space: nowrap;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
  .btn-secondary:hover { background: var(--accent-soft); }
  .btn-ghost { background: transparent; color: var(--accent); border-color: transparent; padding: 0.6em 0.8em; }
  .btn-ghost:hover { background: var(--accent-soft); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-sm { padding: 0.4em 0.8em; font-size: 0.8rem; }

  .shell { max-width: 1080px; margin: 0 auto; padding: 2rem 1.25rem 6rem; }

  .masthead {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1.5rem;
    padding-bottom: 1.5rem; margin-bottom: 1.5rem; border-bottom: 2px solid var(--brass);
    position: relative;
  }
  .masthead-title { font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 500; }
  .masthead-sub { color: var(--ink-2); font-size: 0.95rem; margin-top: 0.35rem; }
  .masthead-count { text-align: right; }
  .masthead-count .num { font-family: "IBM Plex Mono", monospace; font-size: 2.1rem; font-weight: 500; color: var(--accent); line-height: 1; }
  .masthead-count .lbl { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-muted); margin-top: 0.3rem; }

  .stat-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem; margin-bottom: 1.75rem; }
  .stat-tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0.9rem 1rem; box-shadow: var(--shadow); }
  .stat-tile .stat-val { font-family: "IBM Plex Mono", monospace; font-size: 1.5rem; font-weight: 500; }
  .stat-tile .stat-lbl { font-size: 0.75rem; color: var(--ink-2); margin-top: 0.15rem; }
  .stat-tile.warn .stat-val { color: var(--warning); }
  .stat-tile.critical .stat-val { color: var(--critical); }
  .stat-tile.good .stat-val { color: var(--good); }

  .app-shell { display: flex; gap: 1.75rem; align-items: flex-start; }
  .sidebar { display: flex; flex-direction: column; gap: 0.2rem; width: 196px; flex: none; position: sticky; top: 1.25rem; }
  .main-content { flex: 1; min-width: 0; }
  .tab-btn {
    background: none; border: none; border-radius: 8px; padding: 0.65em 0.9em; font-weight: 600; font-size: 0.87rem;
    color: var(--ink-2); cursor: pointer; text-align: left; white-space: nowrap;
  }
  .sidebar .tab-btn { white-space: normal; }
  .tab-btn:hover { color: var(--ink); background: var(--accent-soft); }
  .tab-btn.active { color: var(--accent-ink); background: var(--accent); }
  .tab-btn.active:hover { color: var(--accent-ink); background: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fadein 0.15s ease; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  @media (max-width: 760px) {
    .app-shell { flex-direction: column; }
    .sidebar { flex-direction: row; width: 100%; overflow-x: auto; position: static; border-bottom: 1px solid var(--line); padding-bottom: 0.6rem; margin-bottom: 0.25rem; }
    .sidebar .tab-btn { white-space: nowrap; flex: none; }
  }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.25rem; box-shadow: var(--shadow); margin-bottom: 1.25rem; }
  .card h2 { font-size: 1.15rem; margin-bottom: 0.9rem; }
  .card h3 { font-size: 1rem; margin-bottom: 0.6rem; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 0.9rem; }
  .card-head h2 { margin-bottom: 0; }
  .muted { color: var(--ink-2); font-size: 0.9rem; }
  .tiny { font-size: 0.78rem; color: var(--ink-muted); }

  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1rem; }

  .pill { display: inline-flex; align-items: center; gap: 0.4em; padding: 0.25em 0.65em; border-radius: 999px; font-size: 0.74rem; font-weight: 600; border: 1px solid var(--line-strong); background: var(--surface); white-space: nowrap; flex: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.good { background: var(--good); }
  .dot.warning { background: var(--warning); }
  .dot.critical { background: var(--critical); }
  .dot.neutral { background: var(--ink-muted); }
  .dot.accent { background: var(--accent); }

  .gap-list { display: flex; flex-direction: column; gap: 0.6rem; }
  .gap-item { display: flex; gap: 0.7rem; align-items: flex-start; padding: 0.75rem 0.9rem; border-radius: 8px; border: 1px solid var(--line); background: var(--paper-2); }
  .gap-item.critical { border-color: var(--critical); background: var(--critical-soft); }
  .gap-item.warning { border-color: var(--warning); background: var(--warning-soft); }
  .gap-item .stripe { width: 3px; align-self: stretch; border-radius: 2px; background: var(--ink-muted); flex: none; }
  .gap-item.critical .stripe { background: var(--critical); }
  .gap-item.warning .stripe { background: var(--warning); }
  .gap-item-body { flex: 1; }
  .gap-item-title { font-weight: 600; font-size: 0.92rem; }
  .gap-item-sub { font-size: 0.82rem; color: var(--ink-2); margin-top: 0.15rem; }
  .empty-note { text-align: center; padding: 1.5rem 1rem; color: var(--ink-2); font-size: 0.9rem; }

  .cat-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
  .cat-card-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem 0.75rem; padding: 0.9rem 1rem; }
  .cat-card-head h3 { margin: 0; font-size: 0.98rem; font-family: "Public Sans", sans-serif; font-weight: 700; min-width: 0; }
  .cat-card-body { padding: 0 1rem 1rem; }
  .cat-note { font-size: 0.82rem; color: var(--ink-2); margin: 0.4rem 0 0.7rem; }

  table { width: 100%; border-collapse: collapse; font-size: 0.87rem; }
  th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-muted); font-weight: 600; padding: 0.5em 0.6em; border-bottom: 1px solid var(--line-strong); }
  td { padding: 0.65em 0.6em; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .table-scroll { overflow-x: auto; }
  td.num, th.num { text-align: right; font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }

  .checklist-group { margin-bottom: 1.1rem; }
  .checklist-group h4 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-muted); margin: 0 0 0.5rem; }
  .check-row { display: flex; align-items: flex-start; gap: 0.65rem; padding: 0.5rem 0.2rem; border-bottom: 1px solid var(--line); }
  .check-row:last-child { border-bottom: none; }
  .check-row input[type="checkbox"] { width: 18px; height: 18px; margin-top: 0.15rem; accent-color: var(--accent); flex: none; }
  .check-row.done .check-title { text-decoration: line-through; color: var(--ink-muted); }
  .check-title { font-size: 0.92rem; }
  .check-due { font-size: 0.76rem; color: var(--ink-muted); margin-top: 0.1rem; }
  .check-due.overdue { color: var(--critical); font-weight: 600; }
  .check-remove { margin-left: auto; }

  .barchart { display: flex; flex-direction: column; gap: 0.55rem; }
  .barrow { display: grid; grid-template-columns: 130px 1fr 90px; align-items: center; gap: 0.6rem; }
  .barrow .barlabel { font-size: 0.82rem; color: var(--ink-2); }
  .bartrack { position: relative; height: 20px; background: var(--paper-2); border-radius: 4px; overflow: hidden; }
  .barfill { position: absolute; top: 0; left: 0; height: 100%; border-radius: 4px; }
  .barfill.s1 { background: var(--series-1); }
  .barfill.s2 { background: var(--series-2); opacity: 0.55; height: 8px; top: 6px; }
  .barrow .barval { font-size: 0.78rem; text-align: right; font-family: "IBM Plex Mono", monospace; }
  .legend { display: flex; gap: 1.2rem; margin-top: 0.6rem; font-size: 0.78rem; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 0.4em; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  textarea { min-height: 4.5em; resize: vertical; }
  .save-row { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 0.9rem; align-items: center; }
  .save-status { font-size: 0.8rem; color: var(--ink-muted); }
  .save-status.err { color: var(--critical); }
  .save-status.ok { color: var(--good); }

  .request-item { display: flex; gap: 0.75rem; padding: 0.75rem 0; border-bottom: 1px solid var(--line); }
  .request-item:last-child { border-bottom: none; }
  .request-item .ri-body { flex: 1; }
  .request-item .ri-text { font-size: 0.9rem; }
  .request-item .ri-meta { font-size: 0.75rem; color: var(--ink-muted); margin-top: 0.15rem; }
  .request-item .ri-response { font-size: 0.85rem; margin-top: 0.4rem; padding: 0.6rem 0.75rem; background: var(--accent-soft); border-radius: 7px; }

  .booked-badge { display: inline-flex; align-items: center; gap: 0.35em; padding: 0.2em 0.6em; border-radius: 999px; background: var(--brass-soft); color: var(--brass-ink); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.03em; white-space: nowrap; flex: none; }

  footer.note { margin-top: 2.5rem; padding-top: 1.25rem; border-top: 1px solid var(--line); font-size: 0.8rem; color: var(--ink-muted); }
  .readonly-banner { background: var(--warning-soft); color: var(--brass-ink); border: 1px solid var(--warning); border-radius: 8px; padding: 0.7rem 1rem; font-size: 0.85rem; margin-bottom: 1.25rem; }
  .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 0.65em 1.2em; border-radius: 8px; font-size: 0.85rem; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; z-index: 50; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  .btn-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  select.status-select { width: auto; }

  .guest-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.75rem; margin-bottom: 1.25rem; }

  .file-input-row { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
  .file-input-row input[type="file"] { width: auto; flex: 1; min-width: 200px; font-size: 0.85rem; padding: 0.4em 0; border: none; background: none; }

  .copy-fallback { border: 1px solid var(--warning); background: var(--warning-soft); border-radius: 8px; padding: 0.9rem; margin-bottom: 1rem; }
  .copy-fallback textarea { min-height: 6em; font-family: "IBM Plex Mono", monospace; font-size: 0.78rem; }
  .copy-fallback .save-row { margin-top: 0.6rem; }

  .guest-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 1rem; }
  .filter-group { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
  .filter-btn {
    background: var(--surface); border: 1px solid var(--line-strong); color: var(--ink-2);
    padding: 0.35em 0.8em; border-radius: 999px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
  }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .filter-label { font-size: 0.75rem; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-right: 0.2rem; }

  .guest-group-header { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; margin: 1.1rem 0 0.4rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--line-strong); }
  .guest-group-header h4 { font-size: 0.85rem; margin: 0; }
  .guest-group-header .grp-actions { font-size: 0.75rem; display: flex; gap: 0.7rem; }
  .guest-group-header .grp-actions button { background: none; border: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 0; font-size: 0.75rem; }
  .guest-group-header .grp-actions button:hover { text-decoration: underline; }

  .guest-row-name input, .guest-row-side input, .guest-row-group input { font-size: 0.85rem; padding: 0.4em 0.55em; }
  .status-btn-group { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 7px; overflow: hidden; }
  .status-btn { background: var(--surface); border: none; border-right: 1px solid var(--line-strong); color: var(--ink-2); padding: 0.35em 0.65em; font-size: 0.76rem; font-weight: 600; cursor: pointer; }
  .status-btn:last-child { border-right: none; }
  .status-btn.on.invite { background: var(--good-soft); color: var(--good); }
  .status-btn.on.no { background: var(--critical-soft); color: var(--critical); }
  .status-btn.on.undecided { background: var(--paper-2); color: var(--ink); }
  td.guest-plus1 { text-align: center; }
  td.guest-plus1 input { width: 16px; height: 16px; accent-color: var(--accent); }

  .closeness-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 0.4em; vertical-align: middle; }
  .closeness-close { background: var(--good); }
  .closeness-casual { background: var(--series-1); }
  .closeness-acquaintance { background: var(--warning); }
  .closeness-lost_touch { background: var(--ink-muted); }

  .detail-toggle { background: none; border: none; color: var(--accent); font-size: 0.76rem; font-weight: 600; cursor: pointer; padding: 0.2em 0; }
  .detail-row td { background: var(--paper-2); padding: 0.9rem 0.75rem; }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.75rem; }
  .detail-grid .field label { font-size: 0.72rem; }
  .last-contact-ago { font-size: 0.75rem; color: var(--ink-muted); margin-top: 0.25rem; }

  .import-log { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.75rem; }
  .import-item { display: flex; gap: 0.7rem; align-items: flex-start; padding: 0.65rem 0.8rem; border-radius: 8px; border: 1px solid var(--line); background: var(--paper-2); font-size: 0.85rem; }
  .import-item .imp-name { font-weight: 600; }
  .import-item .imp-meta { font-size: 0.75rem; color: var(--ink-muted); margin-top: 0.1rem; }
  .import-item .imp-response { font-size: 0.82rem; margin-top: 0.35rem; padding: 0.5rem 0.65rem; background: var(--accent-soft); border-radius: 6px; }

  .sort-select { width: auto; font-size: 0.8rem; padding: 0.35em 0.6em; }

  .seat-visual-grid { display: flex; flex-wrap: wrap; gap: 0.5rem 1.75rem; }
  .seat-visual-wrap { text-align: center; padding-bottom: 0.5rem; }
  .seat-visual-wrap .seat-visual-name { font-weight: 700; font-size: 0.85rem; margin-top: 0.4rem; }
  .seat-table-visual { position: relative; border-radius: 50%; border: 2px dashed var(--line-strong); background: var(--paper-2); margin: 0 auto; }
  .seat-table-visual.over { border-color: var(--critical); }
  .seat-table-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; width: 70%; }
  .seat-chip {
    position: absolute; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 0.66rem; font-weight: 700; border: 2px solid var(--line-strong); background: var(--surface); color: var(--ink-2);
  }
  .seat-chip.empty { border-style: dashed; color: var(--ink-muted); }
  .seat-chip.filled { cursor: pointer; }
  .seat-chip.good { border-color: var(--good); background: var(--good-soft); color: var(--good); }
  .seat-chip.critical { border-color: var(--critical); background: var(--critical-soft); color: var(--critical); }
  .seat-chip.neutral { border-color: var(--ink-muted); background: var(--paper-2); color: var(--ink-2); }
  .seat-remove-link { background: none; border: none; color: var(--accent); font-size: 0.75rem; font-weight: 600; cursor: pointer; margin-top: 0.35rem; }

  .login-shell { max-width: 380px; margin: 4.5rem auto; padding: 0 1.25rem; }
  .login-shell h1 { font-size: 1.5rem; margin-bottom: 0.4rem; }
  .login-shell .login-sub { color: var(--ink-2); font-size: 0.9rem; margin-bottom: 1.5rem; }
  .login-error { background: var(--critical-soft); color: var(--critical); border: 1px solid var(--critical); border-radius: 8px; padding: 0.65rem 0.9rem; font-size: 0.85rem; margin-bottom: 1rem; }
  .login-shell .field { margin-bottom: 1rem; }
  .masthead-account { display: flex; align-items: center; gap: 0.75rem; }
  .logout-link { background: none; border: none; color: var(--ink-muted); font-size: 0.78rem; font-weight: 600; cursor: pointer; text-decoration: underline; padding: 0; }
</style>
</head>
<body>
<div class="shell" id="app-root">
  <!-- rendered by JS -->
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  /* ---------- constants ---------- */

  var CATEGORY_META = [
    { key: "planner", label: "Wedding Planner", lead: 11 },
    { key: "venue", label: "Venue", lead: 10 },
    { key: "photography", label: "Photography", lead: 9 },
    { key: "videography", label: "Videography", lead: 9 },
    { key: "catering", label: "Catering", lead: 8 },
    { key: "attire", label: "Attire", lead: 7 },
    { key: "florist", label: "Florist & Décor", lead: 6 },
    { key: "music", label: "Music (DJ / Band)", lead: 6 },
    { key: "officiant", label: "Officiant", lead: 5 },
    { key: "invitations", label: "Invitations & Stationery", lead: 4 },
    { key: "rentals", label: "Rentals", lead: 4 },
    { key: "hairMakeup", label: "Hair & Makeup", lead: 4 },
    { key: "transportation", label: "Transportation", lead: 3 },
    { key: "cake", label: "Cake & Desserts", lead: 3 }
  ];

  var CHECKLIST_DEFAULTS = [
    { id: "cl-01", title: "Set a total budget and rough guest count", offset: -365 },
    { id: "cl-02", title: "Draft the guest list", offset: -330 },
    { id: "cl-03", title: "Book a venue", offset: -300, category: "venue" },
    { id: "cl-04", title: "Book a wedding planner (if using one)", offset: -300, category: "planner" },
    { id: "cl-05", title: "Book photographer and videographer", offset: -270, category: "photography" },
    { id: "cl-06", title: "Choose the wedding party", offset: -260 },
    { id: "cl-07", title: "Book catering", offset: -240, category: "catering" },
    { id: "cl-08", title: "Start dress / attire shopping", offset: -210, category: "attire" },
    { id: "cl-09", title: "Book florist", offset: -180, category: "florist" },
    { id: "cl-10", title: "Book music (DJ or band)", offset: -180, category: "music" },
    { id: "cl-11", title: "Book officiant", offset: -150, category: "officiant" },
    { id: "cl-12", title: "Block hotel rooms for out-of-town guests", offset: -150 },
    { id: "cl-13", title: "Order invitations", offset: -120, category: "invitations" },
    { id: "cl-14", title: "Book rental items (linens, chairs, tenting)", offset: -120, category: "rentals" },
    { id: "cl-15", title: "Plan the honeymoon", offset: -110 },
    { id: "cl-16", title: "Order the cake", offset: -90, category: "cake" },
    { id: "cl-17", title: "Send invitations", offset: -75 },
    { id: "cl-18", title: "Book hair & makeup trial", offset: -70, category: "hairMakeup" },
    { id: "cl-19", title: "Book transportation", offset: -60, category: "transportation" },
    { id: "cl-20", title: "Apply for marriage license (check local rules)", offset: -45 },
    { id: "cl-21", title: "Final dress fitting", offset: -30 },
    { id: "cl-22", title: "Give caterer final headcount", offset: -21 },
    { id: "cl-23", title: "Finalize seating chart", offset: -14 },
    { id: "cl-24", title: "Confirm details with every vendor", offset: -10 },
    { id: "cl-25", title: "Pay final vendor balances", offset: -7 },
    { id: "cl-26", title: "Rehearsal", offset: -1 },
    { id: "cl-27", title: "Wedding day", offset: 0 }
  ];

  var TABS = [
    { key: "overview", label: "Overview" },
    { key: "profile", label: "Profile & Requests" },
    { key: "checklist", label: "Checklist" },
    { key: "budget", label: "Budget" },
    { key: "vendors", label: "Vendors" },
    { key: "guests", label: "Guest List" },
    { key: "dayof", label: "Day-of" }
  ];

  var DAY_MS = 86400000;

  function defaultPayment() {
    return { depositAmount: null, depositPaid: false, depositDueDate: "", balanceAmount: null, balancePaid: false, balanceDueDate: "" };
  }

  function defaultState() {
    var cats = {};
    CATEGORY_META.forEach(function (c) {
      cats[c.key] = { requestStatus: "none", requestNote: "", vendors: [], bookedVendorId: null, allocated: null, actual: null, payment: defaultPayment() };
    });
    return {
      profile: { coupleNames: "", weddingDate: "", location: "", guestCount: null, budgetTotal: null, style: "", notes: "" },
      categories: cats,
      checklist: CHECKLIST_DEFAULTS.map(function (d) {
        return { id: d.id, title: d.title, offset: d.offset, category: d.category || null, done: false, custom: false };
      }),
      requests: [],
      guests: [],
      fileImports: [],
      timeline: [],
      tables: [],
      writable: true,
      _rev: 0
    };
  }

  var CLOSENESS_META = [
    { value: "close", label: "Close" },
    { value: "casual", label: "Casual" },
    { value: "acquaintance", label: "Acquaintance" },
    { value: "lost_touch", label: "Lost touch" }
  ];
  var MAX_IMPORT_BYTES = 8 * 1024 * 1024;

  function partnerLabels() {
    var raw = (state.profile.coupleNames || "").split(/\s*(?:&|\+|,| and )\s*/i).map(function (s) { return s.trim(); }).filter(Boolean);
    if (raw.length === 2) return raw;
    return ["Partner 1", "Partner 2"];
  }

  /* ---------- state + persistence ---------- */

  var state = defaultState();
  var activeTab = "overview";
  var canWrite = true;
  var currentUser = null;

  function applyLoadedState(parsed) {
    state = Object.assign(defaultState(), parsed, {
      profile: Object.assign(defaultState().profile, parsed.profile || {}),
      categories: mergeCategories(parsed.categories)
    });
  }

  function mergeCategories(saved) {
    var base = defaultState().categories;
    if (!saved) return base;
    Object.keys(base).forEach(function (k) {
      if (saved[k]) base[k] = Object.assign(base[k], saved[k]);
    });
    return base;
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  var saving = false;
  function saveState(nextState, opts) {
    opts = opts || {};
    nextState._rev = state._rev || 0;
    if (saving) return Promise.resolve();
    saving = true;
    setSaveStatus("Saving…", "");
    return fetch("/api/state", {
      method: "PUT",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ state: nextState, expectedRev: state._rev || 0 })
    }).then(function (res) {
      saving = false;
      if (res.status === 401) {
        currentUser = null;
        render();
        setSaveStatus("Signed out — log in again to save.", "err");
        return null;
      }
      if (res.status === 409) {
        return res.json().then(function (data) {
          applyLoadedState(data.state);
          state._rev = data.rev;
          render();
          setSaveStatus("Someone updated this — refreshed with the latest.", "");
        });
      }
      if (!res.ok) {
        setSaveStatus("Could not save. Try again.", "err");
        return null;
      }
      return res.json().then(function (data) {
        state = nextState;
        state._rev = data.rev;
        setSaveStatus(opts.doneLabel || "Saved.", "ok");
      });
    }).catch(function (err) {
      saving = false;
      console.error(err);
      setSaveStatus("Could not save. Try again.", "err");
    });
  }

  function setSaveStatus(text, cls) {
    var el = document.getElementById("save-status-badge");
    if (el) {
      el.textContent = text;
      el.className = "save-status " + (cls || "");
    }
    showToast(text);
  }

  var toastTimer = null;
  function showToast(text) {
    var t = document.getElementById("toast");
    if (!t) return;
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }

  /* ---------- derived data ---------- */

  function parseDate(s) {
    if (!s) return null;
    var d = new Date(s + "T00:00:00");
    return isNaN(d.getTime()) ? null : d;
  }

  function today() {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function daysUntil(dateStr) {
    var d = parseDate(dateStr);
    if (!d) return null;
    return Math.round((d.getTime() - today().getTime()) / DAY_MS);
  }

  function dueDateFor(item) {
    var wd = parseDate(state.profile.weddingDate);
    if (!wd) return null;
    return new Date(wd.getTime() + item.offset * DAY_MS);
  }

  function fmtDate(d) {
    if (!d) return "";
    if (typeof d === "string") d = parseDate(d);
    if (!d) return "";
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  function timeSince(dateStr) {
    var d = parseDate(dateStr);
    if (!d) return "";
    var days = Math.round((today().getTime() - d.getTime()) / DAY_MS);
    if (days < 0) return "in the future";
    if (days < 1) return "today";
    if (days < 30) return days + " day" + (days === 1 ? "" : "s") + " ago";
    if (days < 365) { var m = Math.round(days / 30.44); return m + " month" + (m === 1 ? "" : "s") + " ago"; }
    var y = Math.round(days / 365.25 * 10) / 10;
    return y + " year" + (y === 1 ? "" : "s") + " ago";
  }

  function fmtMoney(n) {
    if (n === null || n === undefined || n === "" || isNaN(n)) return "—";
    return "$" + Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
  }

  function computeGaps() {
    var gaps = [];
    var wd = state.profile.weddingDate;
    var monthsUntil = daysUntil(wd) === null ? null : daysUntil(wd) / 30.44;

    if (!wd) {
      gaps.push({ level: "warning", title: "No wedding date set", sub: "Add a date on the Profile tab to unlock timeline tracking and gap alerts." });
    }
    if (!state.profile.budgetTotal) {
      gaps.push({ level: "warning", title: "No total budget set", sub: "Add a budget on the Profile tab to track spending against it." });
    }
    if (monthsUntil !== null) {
      CATEGORY_META.forEach(function (c) {
        var cat = state.categories[c.key];
        if (cat.bookedVendorId) return;
        if (monthsUntil <= c.lead) {
          var level = monthsUntil <= c.lead / 2 ? "critical" : "warning";
          if (cat.requestStatus === "none") {
            gaps.push({ level: level, title: c.label + " — no vendors requested yet", sub: "Typically booked by about " + c.lead + " months out. Request vendors on the Profile tab." });
          } else if (cat.requestStatus === "pending") {
            gaps.push({ level: level === "critical" ? "critical" : "warning", sub: "Vendor research is still in progress.", title: c.label + " — research pending" });
          } else if (cat.requestStatus === "done" && cat.vendors.length && !cat.bookedVendorId) {
            gaps.push({ level: level, title: c.label + " — vendors found, none booked", sub: "Compare options on the Vendors tab and mark one as booked." });
          }
        }
      });
    }
    state.checklist.forEach(function (item) {
      var due = dueDateFor(item);
      if (due && !item.done && due.getTime() < today().getTime()) {
        gaps.push({ level: "critical", title: item.title, sub: "Overdue — was due " + fmtDate(due) + "." });
      }
    });
    var budget = computeBudget();
    if (budget.total && budget.spentPlusAllocated > budget.total) {
      gaps.push({ level: "critical", title: "Over budget", sub: fmtMoney(budget.spentPlusAllocated) + " allocated/spent against a " + fmtMoney(budget.total) + " budget." });
    }
    state.requests.forEach(function (r) {
      if (r.status === "pending") {
        gaps.push({ level: "warning", title: "Request pending: " + (r.category ? categoryLabel(r.category) : "general"), sub: truncate(r.text, 90) });
      }
    });
    if (monthsUntil !== null) {
      if (!state.guests.length && monthsUntil <= 10) {
        gaps.push({ level: monthsUntil <= 6 ? "critical" : "warning", title: "Guest list not started", sub: "Upload or add guests on the Guest List tab so invitations and headcounts have somewhere to start." });
      } else if (state.guests.length) {
        var gStats = computeGuestStats();
        if (gStats.undecided && monthsUntil <= 5) {
          gaps.push({ level: monthsUntil <= 3 ? "critical" : "warning", title: gStats.undecided + " guest" + (gStats.undecided === 1 ? "" : "s") + " still undecided", sub: "Work through the Guest List tab to mark everyone Invite or Not invited before invitations go out." });
        }
        if (state.profile.guestCount && gStats.estAttending > Number(state.profile.guestCount)) {
          gaps.push({ level: "warning", title: "Invited headcount is running over", sub: "About " + gStats.estAttending + " est. attending vs. a budgeted guest count of " + state.profile.guestCount + "." });
        }
        if (gStats.awaitingRsvp && monthsUntil <= 2) {
          gaps.push({ level: monthsUntil <= 1 ? "critical" : "warning", title: gStats.awaitingRsvp + " guest" + (gStats.awaitingRsvp === 1 ? "" : "s") + " still haven't RSVP'd", sub: "Follow up before finalizing headcount and seating on the Guest List and Day-of tabs." });
        }
      }
      if (monthsUntil < 0 && gStats.thankYouPending) {
        gaps.push({ level: "warning", title: gStats.thankYouPending + " thank-you note" + (gStats.thankYouPending === 1 ? "" : "s") + " still pending", sub: "Mark them sent on the Guest List tab as you go." });
      }
    }

    CATEGORY_META.forEach(function (c) {
      var cat = state.categories[c.key];
      if (!cat.bookedVendorId || !cat.payment) return;
      var p = cat.payment;
      if (p.balanceAmount && !p.balancePaid && p.balanceDueDate) {
        var dd = parseDate(p.balanceDueDate);
        if (dd && dd.getTime() < today().getTime()) {
          gaps.push({ level: "critical", title: c.label + " balance is overdue", sub: fmtMoney(p.balanceAmount) + " was due " + fmtDate(dd) + "." });
        } else if (dd && monthsUntil !== null && (dd.getTime() - today().getTime()) / DAY_MS <= 14) {
          gaps.push({ level: "warning", title: c.label + " balance due soon", sub: fmtMoney(p.balanceAmount) + " due " + fmtDate(dd) + "." });
        }
      }
    });
    var order = { critical: 0, warning: 1 };
    gaps.sort(function (a, b) { return (order[a.level] || 2) - (order[b.level] || 2); });
    return gaps;
  }

  function truncate(s, n) { s = s || ""; return s.length > n ? s.slice(0, n - 1) + "…" : s; }

  function categoryLabel(key) {
    var m = CATEGORY_META.filter(function (c) { return c.key === key; })[0];
    return m ? m.label : key;
  }

  function computeBudget() {
    var total = state.profile.budgetTotal ? Number(state.profile.budgetTotal) : 0;
    var allocated = 0, actual = 0;
    CATEGORY_META.forEach(function (c) {
      var cat = state.categories[c.key];
      if (cat.allocated) allocated += Number(cat.allocated);
      if (cat.actual) actual += Number(cat.actual);
    });
    return { total: total, allocated: allocated, actual: actual, spentPlusAllocated: actual + (allocated > actual ? allocated - actual : 0), remaining: total - actual };
  }

  // Typical U.S. wedding-budget split by category (sums to 100). A starting
  // point, not a quote — nudged below by style keywords, guest count, and
  // any real vendor prices already on file.
  var BASE_BUDGET_PCT = {
    planner: 8, venue: 15, photography: 9, videography: 5, catering: 28,
    attire: 6, florist: 7, music: 8, officiant: 1, invitations: 2,
    rentals: 5, hairMakeup: 2, transportation: 2, cake: 2
  };

  var STYLE_ADJUSTMENTS = [
    { test: /\b(luxury|black[\s-]?tie|formal|upscale|glam(orous)?)\b/i,
      mult: { venue: 1.25, catering: 1.1, attire: 1.25, florist: 1.2, hairMakeup: 1.15 } },
    { test: /\b(diy|backyard|casual|budget|small|intimate|elopement|micro[\s-]?wedding)\b/i,
      mult: { venue: 0.6, florist: 0.75, planner: 0.5, rentals: 1.3, catering: 0.9 } },
    { test: /\b(destination)\b/i,
      mult: { venue: 1.15, transportation: 1.6, invitations: 0.8, rentals: 0.8 } },
    { test: /\b(rustic|barn|garden|outdoor)\b/i,
      mult: { rentals: 1.3, florist: 1.15, venue: 0.9 } }
  ];

  function parsePriceNumber(s) {
    if (!s) return null;
    var m = String(s).replace(/,/g, "").match(/\d+(\.\d+)?/g);
    if (!m || !m.length) return null;
    var nums = m.map(Number);
    return nums.reduce(function (a, b) { return a + b; }, 0) / nums.length;
  }

  // A signal of what a category is likely to actually cost, drawn from
  // whatever's already on file for it — booked spend, a booked vendor's
  // price, or an average of researched vendor prices — in that order.
  function marketSignal(cat) {
    if (cat.actual) return Number(cat.actual);
    if (cat.bookedVendorId) {
      var booked = (cat.vendors || []).filter(function (x) { return x.id === cat.bookedVendorId; })[0];
      if (booked) {
        var n = booked.priceValue || parsePriceNumber(booked.price);
        if (n) return n;
      }
    }
    if (cat.vendors && cat.vendors.length) {
      var nums = cat.vendors.map(function (v) { return v.priceValue || parsePriceNumber(v.price); }).filter(function (n) { return n; });
      if (nums.length) return nums.reduce(function (a, b) { return a + b; }, 0) / nums.length;
    }
    return null;
  }

  // Top-down recommendation: given a total budget, suggest a $ amount per
  // category. Computed entirely client-side from BASE_BUDGET_PCT, nudged by
  // style/notes keywords, guest count, and any market signal per category —
  // then renormalized so the percentages still sum to 100.
  function computeRecommendedBudget() {
    var total = Number(state.profile.budgetTotal) || 0;
    var text = ((state.profile.style || "") + " " + (state.profile.notes || "")).toLowerCase();
    var weights = {};
    CATEGORY_META.forEach(function (c) { weights[c.key] = BASE_BUDGET_PCT[c.key] || 1; });

    STYLE_ADJUSTMENTS.forEach(function (adj) {
      if (adj.test.test(text)) {
        Object.keys(adj.mult).forEach(function (k) { if (weights[k] !== undefined) weights[k] *= adj.mult[k]; });
      }
    });

    var gc = Number(state.profile.guestCount) || 0;
    if (gc >= 150) { weights.catering *= 1.1; weights.venue *= 1.05; weights.florist *= 0.9; }
    else if (gc && gc <= 30) { weights.catering *= 0.9; weights.planner *= 1.15; }

    var usedSignal = {};
    CATEGORY_META.forEach(function (c) {
      var signal = marketSignal(state.categories[c.key]);
      if (signal && total) {
        var impliedPct = Math.min(60, (signal / total) * 100);
        weights[c.key] = weights[c.key] * 0.5 + impliedPct * 0.5;
        usedSignal[c.key] = true;
      }
    });

    var sum = 0;
    CATEGORY_META.forEach(function (c) { sum += weights[c.key]; });
    var out = {};
    CATEGORY_META.forEach(function (c) {
      var pct = sum ? (weights[c.key] / sum) * 100 : 0;
      out[c.key] = { pct: pct, amount: total ? Math.round((total * pct / 100) / 5) * 5 : 0, fromSignal: !!usedSignal[c.key] };
    });
    return out;
  }

  function computeGuestStats() {
    var total = state.guests.length;
    var invite = state.guests.filter(function (g) { return g.status === "invite"; }).length;
    var no = state.guests.filter(function (g) { return g.status === "no"; }).length;
    var undecided = total - invite - no;
    var plusOnes = state.guests.filter(function (g) { return g.status === "invite" && g.plusOne; }).length;
    var confirmedAttending = 0;
    state.guests.forEach(function (g) { if (g.rsvp === "attending") confirmedAttending += 1 + (g.plusOneName ? 1 : 0); });
    var declined = state.guests.filter(function (g) { return g.rsvp === "declined"; }).length;
    var awaitingRsvp = state.guests.filter(function (g) { return g.status === "invite" && g.rsvp !== "attending" && g.rsvp !== "declined"; }).length;
    var needsHotel = state.guests.filter(function (g) { return g.needsHotel; }).length;
    var thankYouPending = state.guests.filter(function (g) { return g.giftReceived && !g.thankYouSent; }).length;
    var seated = state.guests.filter(function (g) { return g.tableId; }).length;
    return {
      total: total, invite: invite, no: no, undecided: undecided, plusOnes: plusOnes, estAttending: invite + plusOnes,
      confirmedAttending: confirmedAttending, declined: declined, awaitingRsvp: awaitingRsvp,
      needsHotel: needsHotel, thankYouPending: thankYouPending, seated: seated
    };
  }

  function fmtTime(t) {
    if (!t) return "";
    var parts = t.split(":");
    var h = Number(parts[0]);
    if (isNaN(h)) return t;
    var ap = h >= 12 ? "PM" : "AM";
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + ":" + (parts[1] || "00") + " " + ap;
  }

  function vendorScore(v) {
    var vals = [v.scorePrice, v.scoreAvailability, v.scoreFit].filter(function (n) { return n !== null && n !== undefined && n !== ""; }).map(Number);
    if (!vals.length) return null;
    return vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
  }

  function syncCatActualFromPayments(cat) {
    var p = cat.payment;
    if (!p) return;
    var paid = (p.depositPaid ? Number(p.depositAmount) || 0 : 0) + (p.balancePaid ? Number(p.balanceAmount) || 0 : 0);
    if (paid > 0) cat.actual = paid;
  }

  /* ---------- guest list import / export ---------- */

  function parseDelimited(text) {
    var rows = [], row = [], field = "", inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQuotes) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
        else field += c;
      } else {
        if (c === '"') inQuotes = true;
        else if (c === "," || c === "\t") { row.push(field); field = ""; }
        else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
        else if (c === "\r") { /* skip */ }
        else field += c;
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (c) { return c.trim() !== ""; }); });
  }

  function guessColumns(headerRow) {
    var map = {};
    headerRow.forEach(function (h, idx) {
      var k = (h || "").toLowerCase().trim();
      if (map.name === undefined && /^(full\s*name|guest\s*name|name)$/.test(k)) map.name = idx;
      else if (map.first === undefined && /first/.test(k)) map.first = idx;
      else if (map.last === undefined && /last/.test(k)) map.last = idx;
      else if (map.side === undefined && /(side|partner)/.test(k)) map.side = idx;
      else if (map.group === undefined && /(group|relation|category)/.test(k)) map.group = idx;
      else if (map.plusOne === undefined && /plus/.test(k)) map.plusOne = idx;
      else if (map.howYouKnow === undefined && /(how.*know|relationship|connection)/.test(k)) map.howYouKnow = idx;
      else if (map.lastContact === undefined && /(last.*(contact|spoke|talk)|contact.*date)/.test(k)) map.lastContact = idx;
      else if (map.closeness === undefined && /(closeness|tier)/.test(k)) map.closeness = idx;
      else if (map.rsvp === undefined && /rsvp/.test(k)) map.rsvp = idx;
      else if (map.mealChoice === undefined && /meal/.test(k)) map.mealChoice = idx;
      else if (map.notes === undefined && /note/.test(k)) map.notes = idx;
    });
    return map;
  }

  function normalizeRsvp(v) {
    v = (v || "").toLowerCase().trim();
    if (/^(attend|yes|coming|accept)/.test(v)) return "attending";
    if (/^(decline|no|not\s*attend|regret)/.test(v)) return "declined";
    if (/^sent/.test(v)) return "sent";
    return "not_sent";
  }

  function normalizeCloseness(v) {
    v = (v || "").toLowerCase().trim();
    var m = CLOSENESS_META.filter(function (c) { return c.value === v || c.label.toLowerCase() === v; })[0];
    return m ? m.value : "";
  }

  function makeGuestId() { return "g-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7); }

  function rowsToGuests(rows) {
    if (!rows.length) return [];
    var map = guessColumns(rows[0]);
    var hasHeader = map.name !== undefined || map.first !== undefined || map.last !== undefined;
    var dataRows = hasHeader ? rows.slice(1) : rows;
    return dataRows.map(function (r) {
      var name;
      if (hasHeader && map.name !== undefined) name = (r[map.name] || "").trim();
      else if (hasHeader && (map.first !== undefined || map.last !== undefined)) name = ((r[map.first] || "") + " " + (r[map.last] || "")).trim();
      else name = (r[0] || "").trim();
      if (!name) return null;
      return {
        id: makeGuestId(),
        name: name,
        side: hasHeader && map.side !== undefined ? (r[map.side] || "").trim() : "",
        group: hasHeader && map.group !== undefined ? (r[map.group] || "").trim() : "",
        plusOne: hasHeader && map.plusOne !== undefined ? /^(y|yes|true|1)/i.test((r[map.plusOne] || "").trim()) : false,
        status: "undecided",
        howYouKnow: hasHeader && map.howYouKnow !== undefined ? (r[map.howYouKnow] || "").trim() : "",
        lastContact: hasHeader && map.lastContact !== undefined ? (r[map.lastContact] || "").trim() : "",
        closeness: hasHeader && map.closeness !== undefined ? normalizeCloseness(r[map.closeness]) : "",
        notes: hasHeader && map.notes !== undefined ? (r[map.notes] || "").trim() : "",
        rsvp: hasHeader && map.rsvp !== undefined ? normalizeRsvp(r[map.rsvp]) : "not_sent",
        mealChoice: hasHeader && map.mealChoice !== undefined ? (r[map.mealChoice] || "").trim() : "",
        plusOneName: "", needsHotel: false, hotelBlock: "", arrival: "", departure: "",
        giftReceived: false, giftDescription: "", thankYouSent: false, tableId: ""
      };
    }).filter(Boolean);
  }

  function importGuestsFromText(text, sourceLabel) {
    var rows = parseDelimited(text);
    var parsed = rowsToGuests(rows);
    if (!parsed.length) { showToast("Couldn't find any names in that " + sourceLabel + "."); return; }
    var existingNames = {};
    state.guests.forEach(function (g) { existingNames[g.name.trim().toLowerCase()] = true; });
    var added = parsed.filter(function (g) { return !existingNames[g.name.toLowerCase()]; });
    var skipped = parsed.length - added.length;
    state.guests = state.guests.concat(added);
    var next = clone(state);
    saveState(next, { doneLabel: "Added " + added.length + " guest" + (added.length === 1 ? "" : "s") + (skipped ? " (" + skipped + " duplicate" + (skipped === 1 ? "" : "s") + " skipped)" : ") from your " + sourceLabel + ".") });
  }

  var TEXT_LIKE_EXT = /\.(csv|txt|tsv)$/i;

  function isTextLikeFile(file) {
    return TEXT_LIKE_EXT.test(file.name || "") || /^text\//.test(file.type || "") || file.type === "text/csv";
  }

  function readFileAsDataURL(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result || "")); };
      reader.onerror = function () { reject(reader.error || new Error("read failed")); };
      reader.readAsDataURL(file);
    });
  }

  function queueFileImport(file, targetHint, note) {
    if (file.size > MAX_IMPORT_BYTES) {
      showToast("That file's too big (" + Math.round(file.size / 1024 / 1024) + " MB) — 8 MB max. Try a smaller export or a text/CSV paste instead.");
      return Promise.resolve();
    }
    return readFileAsDataURL(file).then(function (dataUrl) {
      var comma = dataUrl.indexOf(",");
      var meta = dataUrl.slice(5, comma); // "<mime>;base64"
      var mimeType = meta.split(";")[0] || file.type || "application/octet-stream";
      var base64 = dataUrl.slice(comma + 1);
      var next = clone(state);
      next.fileImports.push({
        id: "imp-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7),
        filename: file.name, mimeType: mimeType, sizeBytes: file.size,
        dataBase64: base64, targetHint: targetHint, note: note || "",
        status: "pending", createdAt: Date.now(), response: null
      });
      return saveState(next, { doneLabel: "Got “" + file.name + "” — I’ll read it and add what I find, usually within the hour." });
    }).catch(function (err) {
      console.error(err);
      showToast("Couldn't read that file.");
    });
  }

  function csvEscapeField(v) {
    v = String(v === null || v === undefined ? "" : v);
    if (/[",\n]/.test(v)) return '"' + v.replace(/"/g, '""') + '"';
    return v;
  }

  var copyFallback = null;

  function offerDownload(filename, text) {
    try {
      var blob = new Blob([text], { type: "text/csv;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
      copyFallback = null;
    } catch (err) {
      console.error(err);
      copyFallback = { filename: filename, text: text };
      render();
    }
  }

  function downloadTemplate() {
    var csv = "Name,Side,Group,Plus One,How You Know Them,Last Contact,Closeness,RSVP,Meal Choice,Notes\n" +
      "Jamie Rivera," + partnerLabels()[0] + ",College friends,Yes,College roommate,2026-03-01,close,,,\n" +
      "Alex Chen," + partnerLabels()[1] + ",Coworkers,No,Coworker,,acquaintance,,,Vegetarian\n";
    offerDownload("guest-list-template.csv", csv);
  }

  function exportGuests() {
    var rows = [["Name", "Side", "Group", "Plus One", "Status", "How You Know Them", "Last Contact", "Closeness", "RSVP", "Plus-One Name", "Meal Choice", "Needs Hotel", "Hotel Block", "Arrival", "Departure", "Gift Received", "Thank-You Sent", "Table", "Notes"]];
    state.guests.forEach(function (g) {
      var table = state.tables.filter(function (t) { return t.id === g.tableId; })[0];
      rows.push([
        g.name, g.side, g.group, g.plusOne ? "Yes" : "No", g.status, g.howYouKnow || "", g.lastContact || "", g.closeness || "",
        g.rsvp || "not_sent", g.plusOneName || "", g.mealChoice || "",
        g.needsHotel ? "Yes" : "No", g.hotelBlock || "", g.arrival || "", g.departure || "",
        g.giftReceived ? (g.giftDescription || "Yes") : "", g.thankYouSent ? "Yes" : "No",
        table ? table.name : "", g.notes || ""
      ]);
    });
    var csv = rows.map(function (r) { return r.map(csvEscapeField).join(","); }).join("\n");
    offerDownload("guest-list.csv", csv);
  }

  function exportBudget() {
    var b = computeBudget();
    var rows = [["Category", "Recommended %", "Recommended $", "Your Plan (Allocated)", "Actually Spent", "Diff"]];
    var rec = computeRecommendedBudget();
    CATEGORY_META.forEach(function (c) {
      var cat = state.categories[c.key];
      var r = rec[c.key];
      rows.push([c.label, b.total ? Math.round(r.pct) + "%" : "", b.total ? r.amount : "", cat.allocated || "", cat.actual || "", (cat.allocated && cat.actual) ? (cat.allocated - cat.actual) : ""]);
    });
    rows.push([]);
    rows.push(["Total budget", "", "", b.total || "", "", ""]);
    rows.push(["Predicted total (your plan)", "", "", b.allocated || "", "", ""]);
    rows.push(["Spent so far", "", "", "", b.actual || "", ""]);
    rows.push(["Remaining", "", "", "", "", b.total ? (b.total - b.actual) : ""]);
    var csv = rows.map(function (r) { return r.map(csvEscapeField).join(","); }).join("\n");
    offerDownload("wedding-budget.csv", csv);
  }

  /* ---------- rendering ---------- */

  function render() {
    var root = document.getElementById("app-root");
    if (!currentUser) {
      root.innerHTML = renderLogin();
      bindLoginEvents();
      return;
    }
    root.innerHTML = renderMasthead() + renderReadonlyBanner() + renderStatStrip() +
      '<div class="app-shell">' + renderTabs() +
      '<div class="main-content"><div class="tab-panels">' +
      renderOverview() + renderProfile() + renderChecklist() + renderBudget() + renderVendors() + renderGuestList() + renderDayOf() +
      "</div></div></div>" + renderFooter();
    bindEvents();
  }

  var loginError = "";
  function renderLogin() {
    return '<div class="login-shell"><h1>The Wedding Ledger</h1><div class="login-sub">Sign in to view and edit your planner.</div>' +
      (loginError ? '<div class="login-error">' + escapeHtml(loginError) + "</div>" : "") +
      '<form id="login-form">' +
      '<div class="field"><label for="login-email">Email</label><input id="login-email" type="email" autocomplete="username" required/></div>' +
      '<div class="field"><label for="login-password">Password</label><input id="login-password" type="password" autocomplete="current-password" required/></div>' +
      '<button class="btn btn-primary" type="submit" style="width:100%">Sign in</button>' +
      "</form></div>";
  }

  function bindLoginEvents() {
    var form = document.getElementById("login-form");
    if (!form) return;
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var email = document.getElementById("login-email").value.trim();
      var password = document.getElementById("login-password").value;
      var btn = form.querySelector("button[type=submit]");
      btn.disabled = true;
      btn.textContent = "Signing in…";
      fetch("/api/login", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, password: password })
      }).then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
        .then(function (r) {
          if (!r.ok) {
            loginError = (r.data && r.data.error) || "Could not sign in.";
            render();
            return;
          }
          loginError = "";
          currentUser = r.data.user;
          loadStateAndRender();
        }).catch(function () {
          loginError = "Network error — try again.";
          render();
        });
    });
  }

  function renderReadonlyBanner() {
    if (canWrite) return "";
    return '<div class="readonly-banner">You\'re viewing a read-only copy of this planner. Ask the owner to share edit access to make changes.</div>';
  }

  function renderMasthead() {
    var p = state.profile;
    var title = p.coupleNames ? escapeHtml(p.coupleNames) : "Our Wedding";
    var sub = [];
    if (p.weddingDate) sub.push(fmtDate(p.weddingDate));
    if (p.location) sub.push(escapeHtml(p.location));
    var du = daysUntil(p.weddingDate);
    var countBlock = "";
    if (du !== null) {
      var num = du >= 0 ? du : Math.abs(du);
      var lbl = du > 0 ? "days to go" : (du === 0 ? "today!" : "days married");
      countBlock = '<div class="masthead-count"><div class="num mono">' + num + '</div><div class="lbl">' + lbl + "</div></div>";
    }

    return '<div class="masthead"><div><h1 class="masthead-title">' + title + "</h1>" +
      (sub.length ? '<div class="masthead-sub">' + sub.join(" · ") + "</div>" : '<div class="masthead-sub">Fill in your profile to get started</div>') +

  function renderStatStrip() {
    var gaps = computeGaps();
    var critical = gaps.filter(function (g) { return g.level === "critical"; }).length;
    var warn = gaps.filter(function (g) { return g.level === "warning"; }).length;
    var budget = computeBudget();
    var pending = state.requests.filter(function (r) { return r.status === "pending"; }).length;
    var bookedCount = CATEGORY_META.filter(function (c) { return state.categories[c.key].bookedVendorId; }).length;

    function tile(val, lbl, cls) {
      return '<div class="stat-tile ' + (cls || "") + '"><div class="stat-val mono">' + val + '</div><div class="stat-lbl">' + lbl + "</div></div>";
    }
    return '<div class="stat-strip">' +
      tile(critical + warn, "open gaps", critical ? "critical" : (warn ? "warn" : "good")) +
      tile(bookedCount + " / " + CATEGORY_META.length, "categories booked", "") +
      tile(budget.total ? fmtMoney(budget.remaining) : "—", "budget remaining", budget.total && budget.remaining < 0 ? "critical" : "") +
      tile(pending, "requests pending", pending ? "warn" : "good") +
      "</div>";
  }

  function renderTabs() {
    return '<div class="sidebar" role="tablist">' + TABS.map(function (t) {

    }).join("") + "</div>";

  function panel(key, html) {
    return '<div class="tab-panel' + (key === activeTab ? " active" : "") + '" data-panel="' + key + '">' + html + "</div>";
  }

  function renderOverview() {
    var gaps = computeGaps();
    var body;
    if (!gaps.length) {
      body = '<div class="empty-note">No open gaps right now — nicely done. Keep an eye on the Vendors tab as your date gets closer.</div>';
    } else {
      body = '<div class="gap-list">' + gaps.map(function (g) {
        return '<div class="gap-item ' + g.level + '"><div class="stripe"></div><div class="gap-item-body"><div class="gap-item-title">' + escapeHtml(g.title) + '</div><div class="gap-item-sub">' + escapeHtml(g.sub) + "</div></div></div>";

        }).join("") + "</div>"
      : '<div class="empty-note">Set your wedding date to see upcoming to-dos here.</div>';

      '<div class="card"><div class="card-head"><h2>Gaps & alerts</h2></div>' + body + "</div>" +
      '<div class="grid-2">' +
      '<div class="card"><h3>Coming up</h3>' + upcomingHtml + "</div>" +
      '<div class="card"><h3>Budget snapshot</h3>' + renderBudgetBars(true) + "</div>" +
      "</div>"

    };
    var profileForm =
      '<div class="grid-2">' +

    var adhoc = canWrite ? '<div class="field" style="margin-top:0.5rem"><label for="f-adhoc">Ask for something specific</label><textarea id="f-adhoc" placeholder="e.g. Find 3 more florists near the venue under $2,500, or update the budget now that catering is booked at $9,200"></textarea></div><div class="save-row"><button class="btn btn-primary" id="submit-request-btn">Submit request</button></div>' : "";

  function requestStatusPill(cat, key) {
    if (cat.bookedVendorId) return '<span class="booked-badge">✓ Booked</span>';
    if (cat.requestStatus === "none") return '<span class="pill"><span class="dot neutral"></span>not started</span>';

    return '<span class="pill"><span class="dot good"></span>' + cat.vendors.length + ' found</span>';

  function renderChecklist() {
    var groups = [
      { label: "12+ months before", test: function (o) { return o <= -300; } },
      { label: "9–11 months before", test: function (o) { return o <= -270 && o > -300; } },
      { label: "6–8 months before", test: function (o) { return o <= -180 && o > -270; } },
      { label: "3–5 months before", test: function (o) { return o <= -90 && o > -180; } },
      { label: "1–2 months before", test: function (o) { return o <= -30 && o > -90; } },
      { label: "Final weeks", test: function (o) { return o > -30; } }
    ];
    var items = state.checklist.slice().sort(function (a, b) { return a.offset - b.offset; });
    var html = groups.map(function (g) {
      var rows = items.filter(function (it) { return g.test(it.offset); });
      if (!rows.length) return "";
      var rowsHtml = rows.map(function (it) {
        var due = dueDateFor(it);
        var overdue = due && !it.done && due.getTime() < today().getTime();

  function renderBudgetBars(compact) {

      var allocPct = Math.min(100, (r.alloc / max) * 100);

      return '<div class="barrow"><div class="barlabel">' + r.label + '</div><div class="bartrack"><div class="barfill s1" style="width:' + allocPct + '%"></div><div class="barfill s2" style="width:' + actPct + '%"></div></div><div class="barval">' + fmtMoney(r.act || r.alloc) + "</div></div>";
