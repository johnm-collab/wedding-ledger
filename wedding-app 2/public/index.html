  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
  a { color: var(--accent); }
  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; text-wrap: balance; margin: 0; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  button { font-family: inherit; }
  input, textarea, select {
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    padding: 0.55em 0.7em;
    width: 100%;
  }
  input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--ink-2); margin-bottom: 0.35em; letter-spacing: 0.01em; }

     pixel-positioned for screen dragging and doesn't translate to a printed
     page, so the print button instead reveals a plain, paginated table-by-
     table list (.print-run-sheet), which is otherwise hidden on screen. */
  .print-run-sheet { display: none; }
  .print-run-sheet .prs-table { break-inside: avoid; margin-bottom: 1rem; }
  .print-run-sheet .prs-table h4 { font-size: 1rem; margin-bottom: 0.3rem; }
  .print-run-sheet .prs-table ul { margin: 0; padding-left: 1.2rem; }
  @media print {
    .sidebar, .masthead-count, .stat-strip, .tab-btn, .save-row, .guest-toolbar,
    .seating-toolbar, .floor-plan-canvas, .readonly-banner, footer.note, .btn { display: none !important; }
    .print-run-sheet { display: block !important; }
    .app-shell { display: block !important; }
    .card { box-shadow: none; border: none; padding: 0; }
    body { background: #fff; }
  }
</style>
</head>
<body>
<div class="shell" id="app-root">
  <!-- rendered by JS -->
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  /* ---------- constants ---------- */

  var CATEGORY_META = [
    { key: "planner", label: "Wedding Planner", lead: 11 },
    { key: "venue", label: "Venue", lead: 10 },
    { key: "photography", label: "Photography", lead: 9 },
    { key: "videography", label: "Videography", lead: 9 },
    { key: "catering", label: "Catering", lead: 8 },
    { key: "attire", label: "Attire", lead: 7 },
    { key: "florist", label: "Florist & Décor", lead: 6 },
    { key: "music", label: "Music (DJ / Band)", lead: 6 },
    { key: "officiant", label: "Officiant", lead: 5 },
    { key: "invitations", label: "Invitations & Stationery", lead: 4 },
    { key: "rentals", label: "Rentals", lead: 4 },
    { key: "hairMakeup", label: "Hair & Makeup", lead: 4 },
    { key: "transportation", label: "Transportation", lead: 3 },
    { key: "cake", label: "Cake & Desserts", lead: 3 }
  ];

  var CHECKLIST_DEFAULTS = [
    { id: "cl-01", title: "Set a total budget and rough guest count", offset: -365 },
    { id: "cl-02", title: "Draft the guest list", offset: -330 },
    { id: "cl-03", title: "Book a venue", offset: -300, category: "venue" },
    { id: "cl-04", title: "Book a wedding planner (if using one)", offset: -300, category: "planner" },
    { id: "cl-05", title: "Book photographer and videographer", offset: -270, category: "photography" },
    { id: "cl-06", title: "Choose the wedding party", offset: -260 },
    { id: "cl-07", title: "Book catering", offset: -240, category: "catering" },
    { id: "cl-08", title: "Start dress / attire shopping", offset: -210, category: "attire" },
    { id: "cl-09", title: "Book florist", offset: -180, category: "florist" },
    { id: "cl-10", title: "Book music (DJ or band)", offset: -180, category: "music" },
    { id: "cl-11", title: "Book officiant", offset: -150, category: "officiant" },
    { id: "cl-12", title: "Block hotel rooms for out-of-town guests", offset: -150 },
    { id: "cl-13", title: "Order invitations", offset: -120, category: "invitations" },
    { id: "cl-14", title: "Book rental items (linens, chairs, tenting)", offset: -120, category: "rentals" },
    { id: "cl-15", title: "Plan the honeymoon", offset: -110 },
    { id: "cl-16", title: "Order the cake", offset: -90, category: "cake" },
    { id: "cl-17", title: "Send invitations", offset: -75 },
    { id: "cl-18", title: "Book hair & makeup trial", offset: -70, category: "hairMakeup" },
    { id: "cl-19", title: "Book transportation", offset: -60, category: "transportation" },
    { id: "cl-20", title: "Apply for marriage license (check local rules)", offset: -45 },
    { id: "cl-21", title: "Final dress fitting", offset: -30 },
    { id: "cl-22", title: "Give caterer final headcount", offset: -21 },
    { id: "cl-23", title: "Finalize seating chart", offset: -14 },
    { id: "cl-24", title: "Confirm details with every vendor", offset: -10 },
    { id: "cl-25", title: "Pay final vendor balances", offset: -7 },
    { id: "cl-26", title: "Rehearsal", offset: -1 },
    { id: "cl-27", title: "Wedding day", offset: 0 }
  ];

  var TABS = [
    { key: "overview", label: "Overview" },
    { key: "profile", label: "Profile & Requests" },
    { key: "checklist", label: "Checklist" },
    { key: "budget", label: "Budget" },
    { key: "vendors", label: "Vendors" },
    { key: "guests", label: "Guest List" },
    { key: "seating", label: "Seating" },
    { key: "dayof", label: "Day-of" }
  ];

  var DAY_MS = 86400000;

  // Swatch colors are each colorway's light-mode --accent / --brass so the
  // picker looks the same regardless of which colorway (or light/dark
  // mode) happens to be active while you're choosing.
  var COLORWAYS = [
    { key: "classic", label: "Classic", sub: "Navy & Brass", colors: ["#33406b", "#a8843d"] },
    { key: "sage", label: "Sage & Blush", sub: "Green + pink", colors: ["#6b7f5e", "#c98fa0"] },
    { key: "emerald", label: "Emerald & Mocha", sub: "Green + brown", colors: ["#0f5c46", "#8a6a52"] },
    { key: "chocolate", label: "Cocoa & Blush", sub: "Brown + pink", colors: ["#5c3a21", "#d98aa0"] },
    { key: "mocha", label: "Mocha & Sage", sub: "Brown + green", colors: ["#7a5c46", "#8fa583"] },
    { key: "dustyblue", label: "Dusty Blue & Rust", sub: "Blue + rust", colors: ["#4a6b8a", "#b5563c"] },
    { key: "plum", label: "Plum & Gold", sub: "Purple + gold", colors: ["#5b3159", "#c9a227"] },
    { key: "charcoal", label: "Charcoal & Ivory", sub: "Grey + tan", colors: ["#3a3a3a", "#b8a97c"] },
    { key: "terracotta", label: "Terracotta & Olive", sub: "Clay + olive", colors: ["#a85c3e", "#6b7a4a"] },
    { key: "burgundy", label: "Burgundy & Champagne", sub: "Wine + gold", colors: ["#6b1f2a", "#c9a86a"] }
  ];

  function applyColorway(key) {
    var known = COLORWAYS.some(function (c) { return c.key === key; });
    if (!known || key === "classic") {
      document.documentElement.removeAttribute("data-colorway");
    } else {
      document.documentElement.setAttribute("data-colorway", key);
    }
  }

  function defaultPayment() {
    return { depositAmount: null, depositPaid: false, depositDueDate: "", balanceAmount: null, balancePaid: false, balanceDueDate: "" };
  }

  function defaultState() {
    var cats = {};
    CATEGORY_META.forEach(function (c) {
      cats[c.key] = { requestStatus: "none", requestNote: "", vendors: [], bookedVendorId: null, allocated: null, actual: null, payment: defaultPayment() };
    });
    return {
      profile: { coupleNames: "", weddingDate: "", location: "", address: "", guestCount: null, budgetTotal: null, style: "", notes: "" },
      categories: cats,
      checklist: CHECKLIST_DEFAULTS.map(function (d) {
        return { id: d.id, title: d.title, offset: d.offset, category: d.category || null, done: false, custom: false };
      }),
      requests: [],
      guests: [],
      households: [],
      fileImports: [],
      timeline: [],
      tables: [],
      settings: { colorway: "classic" },
      writable: true,
      _rev: 0
    };
  }

  var CLOSENESS_META = [
    { value: "close", label: "Close" },
    { value: "casual", label: "Casual" },
    { value: "acquaintance", label: "Acquaintance" },
    { value: "lost_touch", label: "Lost touch" }
  ];
  var MAX_IMPORT_BYTES = 8 * 1024 * 1024;

  function partnerLabels() {
    var raw = (state.profile.coupleNames || "").split(/\s*(?:&|\+|,| and )\s*/i).map(function (s) { return s.trim(); }).filter(Boolean);
    if (raw.length === 2) return raw;
    return ["Partner 1", "Partner 2"];
  }

  /* ---------- state + persistence ---------- */

  var state = defaultState();
  var activeTab = "overview";
  var canWrite = true;
  var currentUser = null;

  // Auth-adjacent view state (forgot/reset-password flow). authScreen picks
  // between the login form and the "forgot password" form when signed out;
  // pendingResetToken (read from a ?resetToken=... URL param at boot, then
  // scrubbed from the URL) takes over the whole screen until consumed.
  var authScreen = "login";
  var loginNotice = "";
  var pendingResetToken = null;
  var forgotMsg = "";
  var resetMsg = "";
  var resetErr = "";
  var changePasswordMsg = "";
  var changePasswordErr = "";

  function applyLoadedState(parsed) {
    state = Object.assign(defaultState(), parsed, {
      profile: Object.assign(defaultState().profile, parsed.profile || {}),
      categories: mergeCategories(parsed.categories),
      settings: Object.assign(defaultState().settings, parsed.settings || {})
    });
    applyColorway(state.settings.colorway);
  }

  function mergeCategories(saved) {
    var base = defaultState().categories;
    if (!saved) return base;
    Object.keys(base).forEach(function (k) {
      if (saved[k]) base[k] = Object.assign(base[k], saved[k]);
    });
    return base;
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  var saving = false;
  function saveState(nextState, opts) {
    opts = opts || {};
    nextState._rev = state._rev || 0;
    if (saving) return Promise.resolve();
    saving = true;
    setSaveStatus("Saving…", "");
    return fetch("/api/state", {
      method: "PUT",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ state: nextState, expectedRev: state._rev || 0 })
    }).then(function (res) {
      saving = false;
      if (res.status === 401) {
        currentUser = null;
        render();
        setSaveStatus("Signed out — log in again to save.", "err");
        return null;
      }
      if (res.status === 409) {
        return res.json().then(function (data) {
          applyLoadedState(data.state);
          state._rev = data.rev;
          render();
          setSaveStatus("Someone updated this — refreshed with the latest.", "");
        });
      }
      if (!res.ok) {
        setSaveStatus("Could not save. Try again.", "err");
        return null;
      }
      return res.json().then(function (data) {
        state = nextState;
        state._rev = data.rev;
        render();
        setSaveStatus(opts.doneLabel || "Saved.", "ok");
      });
    }).catch(function (err) {
      saving = false;
      console.error(err);
      setSaveStatus("Could not save. Try again.", "err");
    });
  }

  function setSaveStatus(text, cls) {
    // Every tab renders its own save-status span with its own id
    // (save-status-badge, save-status-badge-3, -4, -5, …) since each tab's
    // Save button is independent. Update whichever one(s) currently exist
    // in the DOM rather than only the first tab's, so the "Saved." /
    // "Saving…" confirmation actually shows up next to the button someone
    // clicked, not just on the Profile tab.
    document.querySelectorAll(".save-status").forEach(function (el) {
      el.textContent = text;
      el.className = "save-status " + (cls || "");
    });
    showToast(text);
  }

  var toastTimer = null;
  function showToast(text) {
    var t = document.getElementById("toast");
    if (!t) return;
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }

  /* ---------- derived data ---------- */

  function parseDate(s) {
    if (!s) return null;
    var d = new Date(s + "T00:00:00");
    return isNaN(d.getTime()) ? null : d;
  }

  function today() {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function daysUntil(dateStr) {
    var d = parseDate(dateStr);
    if (!d) return null;
    return Math.round((d.getTime() - today().getTime()) / DAY_MS);
  }

  // The built-in checklist offsets assume a 12-month (365-day) runway. When
  // the wedding is sooner than that, scale every default offset down
  // proportionally so the whole plan compresses into the time actually
  // available instead of showing most of the checklist as already overdue.
  // Offset 0 (wedding day) and offsets near it barely move; the earliest
  // items (offset -365) land right around today. Custom to-dos the couple
  // added themselves are left alone — those "days before" values were
  // typed in on purpose and already mean what they say.
  var CHECKLIST_BASELINE_DAYS = 365;
  function checklistOffsetScale() {
    var du = daysUntil(state.profile.weddingDate);
    if (du === null || du <= 0) return 1;
    if (du >= CHECKLIST_BASELINE_DAYS) return 1;
    return du / CHECKLIST_BASELINE_DAYS;
  }

  function dueDateFor(item) {
    var wd = parseDate(state.profile.weddingDate);
    if (!wd) return null;
    var offset = item.offset;
    if (!item.custom) offset = Math.round(offset * checklistOffsetScale());
    return new Date(wd.getTime() + offset * DAY_MS);
  }

  function fmtDate(d) {
    if (!d) return "";
    if (typeof d === "string") d = parseDate(d);
    if (!d) return "";
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  function timeSince(dateStr) {
    var d = parseDate(dateStr);
    if (!d) return "";
    var days = Math.round((today().getTime() - d.getTime()) / DAY_MS);
    if (days < 0) return "in the future";
    if (days < 1) return "today";
    if (days < 30) return days + " day" + (days === 1 ? "" : "s") + " ago";
    if (days < 365) { var m = Math.round(days / 30.44); return m + " month" + (m === 1 ? "" : "s") + " ago"; }
    var y = Math.round(days / 365.25 * 10) / 10;
    return y + " year" + (y === 1 ? "" : "s") + " ago";
  }

  function fmtMoney(n) {
    if (n === null || n === undefined || n === "" || isNaN(n)) return "—";
    return "$" + Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
  }

  function computeGaps() {
    var gaps = [];
    var wd = state.profile.weddingDate;
    var monthsUntil = daysUntil(wd) === null ? null : daysUntil(wd) / 30.44;

    if (!wd) {
      gaps.push({ level: "warning", title: "No wedding date set", sub: "Add a date on the Profile tab to unlock timeline tracking and gap alerts." });
    }
    if (!state.profile.budgetTotal) {
      gaps.push({ level: "warning", title: "No total budget set", sub: "Add a budget on the Profile tab to track spending against it." });
    }
    if (monthsUntil !== null) {
      CATEGORY_META.forEach(function (c) {
        var cat = state.categories[c.key];
        if (cat.bookedVendorId) return;
        if (monthsUntil <= c.lead) {
          var level = monthsUntil <= c.lead / 2 ? "critical" : "warning";
          if (cat.requestStatus === "none") {
            gaps.push({ level: level, title: c.label + " — no vendors requested yet", sub: "Typically booked by about " + c.lead + " months out. Request vendors on the Profile tab." });
          } else if (cat.requestStatus === "pending") {
            gaps.push({ level: level === "critical" ? "critical" : "warning", sub: "Vendor research is still in progress.", title: c.label + " — research pending" });
          } else if (cat.requestStatus === "done" && cat.vendors.length && !cat.bookedVendorId) {
            gaps.push({ level: level, title: c.label + " — vendors found, none booked", sub: "Compare options on the Vendors tab and mark one as booked." });
          }
        }
      });
    }
    state.checklist.forEach(function (item) {
      var due = dueDateFor(item);
      if (due && !item.done && due.getTime() < today().getTime()) {
        gaps.push({ level: "critical", title: item.title, sub: "Overdue — was due " + fmtDate(due) + "." });
      }
    });
    var budget = computeBudget();
    if (budget.total && budget.spentPlusAllocated > budget.total) {
      gaps.push({ level: "critical", title: "Over budget", sub: fmtMoney(budget.spentPlusAllocated) + " allocated/spent against a " + fmtMoney(budget.total) + " budget." });
    }
    state.requests.forEach(function (r) {
      if (r.status === "pending") {
        gaps.push({ level: "warning", title: "Request pending: " + (r.category ? categoryLabel(r.category) : "general"), sub: truncate(r.text, 90) });
      }
    });
    if (monthsUntil !== null) {
      if (!state.guests.length && monthsUntil <= 10) {
        gaps.push({ level: monthsUntil <= 6 ? "critical" : "warning", title: "Guest list not started", sub: "Upload or add guests on the Guest List tab so invitations and headcounts have somewhere to start." });
      } else if (state.guests.length) {
        var gStats = computeGuestStats();
        if (gStats.undecided && monthsUntil <= 5) {
          gaps.push({ level: monthsUntil <= 3 ? "critical" : "warning", title: gStats.undecided + " guest" + (gStats.undecided === 1 ? "" : "s") + " still undecided", sub: "Work through the Guest List tab to mark everyone Invite or Not invited before invitations go out." });
        }
        if (state.profile.guestCount && gStats.estAttending > Number(state.profile.guestCount)) {
          gaps.push({ level: "warning", title: "Invited headcount is running over", sub: "About " + gStats.estAttending + " est. attending vs. a budgeted guest count of " + state.profile.guestCount + "." });
        }
        if (gStats.awaitingRsvp && monthsUntil <= 2) {
          gaps.push({ level: monthsUntil <= 1 ? "critical" : "warning", title: gStats.awaitingRsvp + " guest" + (gStats.awaitingRsvp === 1 ? "" : "s") + " still haven't RSVP'd", sub: "Follow up before finalizing headcount and seating on the Guest List and Day-of tabs." });
        }
      }
      if (monthsUntil < 0 && gStats.thankYouPending) {
        gaps.push({ level: "warning", title: gStats.thankYouPending + " thank-you note" + (gStats.thankYouPending === 1 ? "" : "s") + " still pending", sub: "Mark them sent on the Guest List tab as you go." });
      }
    }

    CATEGORY_META.forEach(function (c) {
      var cat = state.categories[c.key];
      if (!cat.bookedVendorId || !cat.payment) return;
      var p = cat.payment;
      if (p.balanceAmount && !p.balancePaid && p.balanceDueDate) {
        var dd = parseDate(p.balanceDueDate);
        if (dd && dd.getTime() < today().getTime()) {
          gaps.push({ level: "critical", title: c.label + " balance is overdue", sub: fmtMoney(p.balanceAmount) + " was due " + fmtDate(dd) + "." });
        } else if (dd && monthsUntil !== null && (dd.getTime() - today().getTime()) / DAY_MS <= 14) {
          gaps.push({ level: "warning", title: c.label + " balance due soon", sub: fmtMoney(p.balanceAmount) + " due " + fmtDate(dd) + "." });
        }
      }
    });
    var order = { critical: 0, warning: 1 };
    gaps.sort(function (a, b) { return (order[a.level] || 2) - (order[b.level] || 2); });
    return gaps;
  }

  function truncate(s, n) { s = s || ""; return s.length > n ? s.slice(0, n - 1) + "…" : s; }

  function categoryLabel(key) {
    var m = CATEGORY_META.filter(function (c) { return c.key === key; })[0];
    return m ? m.label : key;
  }

  function computeBudget() {
    var total = state.profile.budgetTotal ? Number(state.profile.budgetTotal) : 0;
    var allocated = 0, actual = 0;
    CATEGORY_META.forEach(function (c) {
      var cat = state.categories[c.key];
      if (cat.allocated) allocated += Number(cat.allocated);
      if (cat.actual) actual += Number(cat.actual);
    });
    return { total: total, allocated: allocated, actual: actual, spentPlusAllocated: actual + (allocated > actual ? allocated - actual : 0), remaining: total - actual };
  }

  // Typical U.S. wedding-budget split by category (sums to 100). A starting
  // point, not a quote — nudged below by style keywords, guest count, and
  // any real vendor prices already on file.
  var BASE_BUDGET_PCT = {
    planner: 8, venue: 15, photography: 9, videography: 5, catering: 28,
    attire: 6, florist: 7, music: 8, officiant: 1, invitations: 2,
    rentals: 5, hairMakeup: 2, transportation: 2, cake: 2
  };

  var STYLE_ADJUSTMENTS = [
    { test: /\b(luxury|black[\s-]?tie|formal|upscale|glam(orous)?)\b/i,
      mult: { venue: 1.25, catering: 1.1, attire: 1.25, florist: 1.2, hairMakeup: 1.15 } },
    { test: /\b(diy|backyard|casual|budget|small|intimate|elopement|micro[\s-]?wedding)\b/i,
      mult: { venue: 0.6, florist: 0.75, planner: 0.5, rentals: 1.3, catering: 0.9 } },
    { test: /\b(destination)\b/i,
      mult: { venue: 1.15, transportation: 1.6, invitations: 0.8, rentals: 0.8 } },
    { test: /\b(rustic|barn|garden|outdoor)\b/i,
      mult: { rentals: 1.3, florist: 1.15, venue: 0.9 } }
  ];

  function parsePriceNumber(s) {
    if (!s) return null;
    var m = String(s).replace(/,/g, "").match(/\d+(\.\d+)?/g);
    if (!m || !m.length) return null;
    var nums = m.map(Number);
    return nums.reduce(function (a, b) { return a + b; }, 0) / nums.length;
  }

  // A signal of what a category is likely to actually cost, drawn from
  // whatever's already on file for it — booked spend, a booked vendor's
  // price, or an average of researched vendor prices — in that order.
  function marketSignal(cat) {
    if (cat.actual) return Number(cat.actual);
    if (cat.bookedVendorId) {
      var booked = (cat.vendors || []).filter(function (x) { return x.id === cat.bookedVendorId; })[0];
      if (booked) {
        var n = booked.priceValue || parsePriceNumber(booked.price);
        if (n) return n;
      }
    }
    if (cat.vendors && cat.vendors.length) {
      var nums = cat.vendors.map(function (v) { return v.priceValue || parsePriceNumber(v.price); }).filter(function (n) { return n; });
      if (nums.length) return nums.reduce(function (a, b) { return a + b; }, 0) / nums.length;
    }
    return null;
  }

  // Top-down recommendation: given a total budget, suggest a $ amount per
  // category. Computed entirely client-side from BASE_BUDGET_PCT, nudged by
  // style/notes keywords, guest count, and any market signal per category —
  // then renormalized so the percentages still sum to 100.
  function computeRecommendedBudget() {
    var total = Number(state.profile.budgetTotal) || 0;
    var text = ((state.profile.style || "") + " " + (state.profile.notes || "")).toLowerCase();
    var weights = {};
    CATEGORY_META.forEach(function (c) { weights[c.key] = BASE_BUDGET_PCT[c.key] || 1; });

    STYLE_ADJUSTMENTS.forEach(function (adj) {
      if (adj.test.test(text)) {
        Object.keys(adj.mult).forEach(function (k) { if (weights[k] !== undefined) weights[k] *= adj.mult[k]; });
      }
    });

    var gc = Number(state.profile.guestCount) || 0;
    if (gc >= 150) { weights.catering *= 1.1; weights.venue *= 1.05; weights.florist *= 0.9; }
    else if (gc && gc <= 30) { weights.catering *= 0.9; weights.planner *= 1.15; }

    var usedSignal = {};
    CATEGORY_META.forEach(function (c) {
      var signal = marketSignal(state.categories[c.key]);
      if (signal && total) {
        var impliedPct = Math.min(60, (signal / total) * 100);
        weights[c.key] = weights[c.key] * 0.5 + impliedPct * 0.5;
        usedSignal[c.key] = true;
      }
    });

    var sum = 0;
    CATEGORY_META.forEach(function (c) { sum += weights[c.key]; });
    var out = {};
    CATEGORY_META.forEach(function (c) {
      var pct = sum ? (weights[c.key] / sum) * 100 : 0;
      out[c.key] = { pct: pct, amount: total ? Math.round((total * pct / 100) / 5) * 5 : 0, fromSignal: !!usedSignal[c.key] };
    });
    return out;
  }

  // Every deposit/balance across every vendor category that's due and not
  // yet marked paid, soonest first — a single place to see what to pay next
  // instead of clicking into each category on the Vendors tab.
  function computePaymentsDue() {
    var items = [];
    CATEGORY_META.forEach(function (c) {
      var cat = state.categories[c.key];
      if (!cat || !cat.payment) return;
      var pay = cat.payment;
      if (pay.depositAmount && pay.depositDueDate && !pay.depositPaid) {
        items.push({ category: c.label, kind: "Deposit", amount: pay.depositAmount, dueDate: pay.depositDueDate });
      }
      if (pay.balanceAmount && pay.balanceDueDate && !pay.balancePaid) {
        items.push({ category: c.label, kind: "Balance", amount: pay.balanceAmount, dueDate: pay.balanceDueDate });
      }
    });
    items.sort(function (a, b) { return parseDate(a.dueDate) - parseDate(b.dueDate); });
    return items;
  }

  function computeGuestStats() {
    var total = state.guests.length;
    var invite = state.guests.filter(function (g) { return g.status === "invite"; }).length;
    var no = state.guests.filter(function (g) { return g.status === "no"; }).length;
    var undecided = total - invite - no;
    var plusOnes = state.guests.filter(function (g) { return g.status === "invite" && g.plusOne; }).length;
    var confirmedAttending = 0;
    state.guests.forEach(function (g) { if (g.rsvp === "attending") confirmedAttending += 1 + (g.plusOneName ? 1 : 0); });
    var declined = state.guests.filter(function (g) { return g.rsvp === "declined"; }).length;
    var awaitingRsvp = state.guests.filter(function (g) { return g.status === "invite" && g.rsvp !== "attending" && g.rsvp !== "declined"; }).length;
    var needsHotel = state.guests.filter(function (g) { return g.needsHotel; }).length;
    var thankYouPending = state.guests.filter(function (g) { return g.giftReceived && !g.thankYouSent; }).length;
    var seated = state.guests.filter(function (g) { return g.tableId; }).length;

    // How many physical/emailed invitations to actually send: a household
    // that isn't set to "send separate invites" counts once no matter how
    // many invited guests it has; everyone else (no household, or a
    // household that opted into separate invites) counts individually.
    var invitesToSend = 0;
    var countedHouseholds = {};
    state.guests.forEach(function (g) {
      if (g.status !== "invite") return;
      var h = g.householdId ? (state.households || []).filter(function (x) { return x.id === g.householdId; })[0] : null;
      if (h && !h.sendSeparateInvites) {
        if (!countedHouseholds[h.id]) { countedHouseholds[h.id] = true; invitesToSend++; }
      } else {
        invitesToSend++;
      }
    });

    return {
      total: total, invite: invite, no: no, undecided: undecided, plusOnes: plusOnes, estAttending: invite + plusOnes,
      confirmedAttending: confirmedAttending, declined: declined, awaitingRsvp: awaitingRsvp,
      needsHotel: needsHotel, thankYouPending: thankYouPending, seated: seated, invitesToSend: invitesToSend
    };
  }

  function fmtTime(t) {
    if (!t) return "";
    var parts = t.split(":");
    var h = Number(parts[0]);
    if (isNaN(h)) return t;
    var ap = h >= 12 ? "PM" : "AM";
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + ":" + (parts[1] || "00") + " " + ap;
  }

  function vendorScore(v) {
    var vals = [v.scorePrice, v.scoreAvailability, v.scoreFit].filter(function (n) { return n !== null && n !== undefined && n !== ""; }).map(Number);
    if (!vals.length) return null;
    return vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
  }

  function syncCatActualFromPayments(cat) {
    var p = cat.payment;
    if (!p) return;
    var paid = (p.depositPaid ? Number(p.depositAmount) || 0 : 0) + (p.balancePaid ? Number(p.balanceAmount) || 0 : 0);
    if (paid > 0) cat.actual = paid;
  }

  /* ---------- guest list import / export ---------- */

  function parseDelimited(text) {
    var rows = [], row = [], field = "", inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQuotes) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
        else field += c;
      } else {
        if (c === '"') inQuotes = true;
        else if (c === "," || c === "\t") { row.push(field); field = ""; }
        else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
        else if (c === "\r") { /* skip */ }
        else field += c;
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (c) { return c.trim() !== ""; }); });
  }

  function guessColumns(headerRow) {
    var map = {};
    headerRow.forEach(function (h, idx) {
      var k = (h || "").toLowerCase().trim();
      if (map.name === undefined && /^(full\s*name|guest\s*name|name)$/.test(k)) map.name = idx;
      else if (map.first === undefined && /first/.test(k)) map.first = idx;
      else if (map.last === undefined && /last/.test(k)) map.last = idx;
      else if (map.side === undefined && /(side|partner)/.test(k)) map.side = idx;
      else if (map.group === undefined && /(group|relation|category)/.test(k)) map.group = idx;
      else if (map.plusOne === undefined && /plus/.test(k)) map.plusOne = idx;
      else if (map.howYouKnow === undefined && /(how.*know|relationship|connection)/.test(k)) map.howYouKnow = idx;
      else if (map.lastContact === undefined && /(last.*(contact|spoke|talk)|contact.*date)/.test(k)) map.lastContact = idx;
      else if (map.closeness === undefined && /(closeness|tier)/.test(k)) map.closeness = idx;
      else if (map.rsvp === undefined && /rsvp/.test(k)) map.rsvp = idx;
      else if (map.mealChoice === undefined && /meal/.test(k)) map.mealChoice = idx;
      else if (map.email === undefined && /e[\s-]?mail/.test(k)) map.email = idx;
      else if (map.notes === undefined && /note/.test(k)) map.notes = idx;
    });
    return map;
  }

  function normalizeRsvp(v) {
    v = (v || "").toLowerCase().trim();
    if (/^(attend|yes|coming|accept)/.test(v)) return "attending";
    if (/^(decline|no|not\s*attend|regret)/.test(v)) return "declined";
    if (/^sent/.test(v)) return "sent";
    return "not_sent";
  }

  function normalizeCloseness(v) {
    v = (v || "").toLowerCase().trim();
    var m = CLOSENESS_META.filter(function (c) { return c.value === v || c.label.toLowerCase() === v; })[0];
    return m ? m.value : "";
  }

  function makeGuestId() { return "g-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7); }
  function makeHouseholdId() { return "hh-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7); }

  // Same shape as the server's password-reset tokens (32 random bytes, hex)
  // so it's equally unguessable — minted client-side since households/guest
  // links are just ordinary fields on the shared state, saved the normal way.
  function makeRsvpToken() {
    var bytes = new Uint8Array(32);
    (window.crypto || window.msCrypto).getRandomValues(bytes);
    var hex = "";
    for (var i = 0; i < bytes.length; i++) hex += bytes[i].toString(16).padStart(2, "0");
    return hex;
  }
  function portalUrl(token) { return window.location.origin + "/rsvp/" + token; }

  function rowsToGuests(rows) {
    if (!rows.length) return [];
    var map = guessColumns(rows[0]);
    var hasHeader = map.name !== undefined || map.first !== undefined || map.last !== undefined;
    var dataRows = hasHeader ? rows.slice(1) : rows;
    return dataRows.map(function (r) {
      var name;
      if (hasHeader && map.name !== undefined) name = (r[map.name] || "").trim();
      else if (hasHeader && (map.first !== undefined || map.last !== undefined)) name = ((r[map.first] || "") + " " + (r[map.last] || "")).trim();
      else name = (r[0] || "").trim();
      if (!name) return null;
      return {
        id: makeGuestId(),
        name: name,
        side: hasHeader && map.side !== undefined ? (r[map.side] || "").trim() : "",
        group: hasHeader && map.group !== undefined ? (r[map.group] || "").trim() : "",
        plusOne: hasHeader && map.plusOne !== undefined ? /^(y|yes|true|1)/i.test((r[map.plusOne] || "").trim()) : false,
        status: "undecided",
        howYouKnow: hasHeader && map.howYouKnow !== undefined ? (r[map.howYouKnow] || "").trim() : "",
        lastContact: hasHeader && map.lastContact !== undefined ? (r[map.lastContact] || "").trim() : "",
        closeness: hasHeader && map.closeness !== undefined ? normalizeCloseness(r[map.closeness]) : "",
        notes: hasHeader && map.notes !== undefined ? (r[map.notes] || "").trim() : "",
        rsvp: hasHeader && map.rsvp !== undefined ? normalizeRsvp(r[map.rsvp]) : "not_sent",
        mealChoice: hasHeader && map.mealChoice !== undefined ? (r[map.mealChoice] || "").trim() : "",
        email: hasHeader && map.email !== undefined ? (r[map.email] || "").trim() : "",
        plusOneName: "", needsHotel: false, hotelBlock: "", arrival: "", departure: "",
        giftReceived: false, giftDescription: "", thankYouSent: false, tableId: "", householdId: "", rsvpToken: ""
      };
    }).filter(Boolean);
  }

  function importGuestsFromText(text, sourceLabel) {
    var rows = parseDelimited(text);
    var parsed = rowsToGuests(rows);
    if (!parsed.length) { showToast("Couldn't find any names in that " + sourceLabel + "."); return; }
    var existingNames = {};
    state.guests.forEach(function (g) { existingNames[g.name.trim().toLowerCase()] = true; });
    var added = parsed.filter(function (g) { return !existingNames[g.name.toLowerCase()]; });
    var skipped = parsed.length - added.length;
    state.guests = state.guests.concat(added);
    var next = clone(state);
    saveState(next, { doneLabel: "Added " + added.length + " guest" + (added.length === 1 ? "" : "s") + (skipped ? " (" + skipped + " duplicate" + (skipped === 1 ? "" : "s") + " skipped)" : ") from your " + sourceLabel + ".") });
  }

  var TEXT_LIKE_EXT = /\.(csv|txt|tsv)$/i;

  function isTextLikeFile(file) {
    return TEXT_LIKE_EXT.test(file.name || "") || /^text\//.test(file.type || "") || file.type === "text/csv";
  }

  function readFileAsDataURL(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result || "")); };
      reader.onerror = function () { reject(reader.error || new Error("read failed")); };
      reader.readAsDataURL(file);
    });
  }

  function queueFileImport(file, targetHint, note) {
    if (file.size > MAX_IMPORT_BYTES) {
      showToast("That file's too big (" + Math.round(file.size / 1024 / 1024) + " MB) — 8 MB max. Try a smaller export or a text/CSV paste instead.");
      return Promise.resolve();
    }
    return readFileAsDataURL(file).then(function (dataUrl) {
      var comma = dataUrl.indexOf(",");
      var meta = dataUrl.slice(5, comma); // "<mime>;base64"
      var mimeType = meta.split(";")[0] || file.type || "application/octet-stream";
      var base64 = dataUrl.slice(comma + 1);
      var next = clone(state);
      next.fileImports.push({
        id: "imp-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7),
        filename: file.name, mimeType: mimeType, sizeBytes: file.size,
        dataBase64: base64, targetHint: targetHint, note: note || "",
        status: "pending", createdAt: Date.now(), response: null
      });
      return saveState(next, { doneLabel: "Got “" + file.name + "” — I’ll read it and add what I find, usually within the hour." });
    }).catch(function (err) {
      console.error(err);
      showToast("Couldn't read that file.");
    });
  }

  function csvEscapeField(v) {
    v = String(v === null || v === undefined ? "" : v);
    if (/[",\n]/.test(v)) return '"' + v.replace(/"/g, '""') + '"';
    return v;
  }

  var copyFallback = null;

  function offerDownload(filename, text) {
    try {
      var blob = new Blob([text], { type: "text/csv;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
      copyFallback = null;
    } catch (err) {
      console.error(err);
      copyFallback = { filename: filename, text: text };
      render();
    }
  }

  function downloadTemplate() {
    var csv = "Name,Side,Group,Plus One,How You Know Them,Last Contact,Closeness,RSVP,Meal Choice,Email,Notes\n" +
      "Jamie Rivera," + partnerLabels()[0] + ",College friends,Yes,College roommate,2026-03-01,close,,,jamie@example.com,\n" +
      "Alex Chen," + partnerLabels()[1] + ",Coworkers,No,Coworker,,acquaintance,,,alex@example.com,Vegetarian\n";
    offerDownload("guest-list-template.csv", csv);
  }

  function exportGuests() {
    var rows = [["Name", "Side", "Group", "Household", "Plus One", "Status", "How You Know Them", "Last Contact", "Closeness", "RSVP", "Plus-One Name", "Meal Choice", "Email", "Needs Hotel", "Hotel Block", "Arrival", "Departure", "Gift Received", "Thank-You Sent", "Table", "Notes"]];
    state.guests.forEach(function (g) {
      var table = state.tables.filter(function (t) { return t.id === g.tableId; })[0];
      var household = (state.households || []).filter(function (h) { return h.id === g.householdId; })[0];
      rows.push([
        g.name, g.side, g.group, household ? household.name : "", g.plusOne ? "Yes" : "No", g.status, g.howYouKnow || "", g.lastContact || "", g.closeness || "",
        g.rsvp || "not_sent", g.plusOneName || "", g.mealChoice || "", g.email || "",
        g.needsHotel ? "Yes" : "No", g.hotelBlock || "", g.arrival || "", g.departure || "",
        g.giftReceived ? (g.giftDescription || "Yes") : "", g.thankYouSent ? "Yes" : "No",
        table ? table.name : "", g.notes || ""
      ]);
    });
    var csv = rows.map(function (r) { return r.map(csvEscapeField).join(","); }).join("\n");
    offerDownload("guest-list.csv", csv);
  }

  function exportBudget() {
    var b = computeBudget();
    var rows = [["Category", "Recommended %", "Recommended $", "Your Plan (Allocated)", "Actually Spent", "Diff"]];
    var rec = computeRecommendedBudget();
    CATEGORY_META.forEach(function (c) {
      var cat = state.categories[c.key];
      var r = rec[c.key];
      rows.push([c.label, b.total ? Math.round(r.pct) + "%" : "", b.total ? r.amount : "", cat.allocated || "", cat.actual || "", (cat.allocated && cat.actual) ? (cat.allocated - cat.actual) : ""]);
    });
    rows.push([]);
    rows.push(["Total budget", "", "", b.total || "", "", ""]);
    rows.push(["Predicted total (your plan)", "", "", b.allocated || "", "", ""]);
    rows.push(["Spent so far", "", "", "", b.actual || "", ""]);
    rows.push(["Remaining", "", "", "", "", b.total ? (b.total - b.actual) : ""]);
    var csv = rows.map(function (r) { return r.map(csvEscapeField).join(","); }).join("\n");
    offerDownload("wedding-budget.csv", csv);
  }

  /* ---------- rendering ---------- */

  function render() {
    var root = document.getElementById("app-root");
    if (pendingResetToken) {
      root.innerHTML = renderResetPassword();
      bindResetPasswordEvents();
      return;
    }
    if (!currentUser) {
      if (authScreen === "forgot") {
        root.innerHTML = renderForgotPassword();
        bindForgotPasswordEvents();
      } else {
        root.innerHTML = renderLogin();
        bindLoginEvents();
      }
      return;
    }
    root.innerHTML = renderMasthead() + renderReadonlyBanner() + renderStatStrip() +
      '<div class="app-shell">' + renderTabs() +
      '<div class="main-content"><div class="tab-panels">' +
      renderOverview() + renderProfile() + renderChecklist() + renderBudget() + renderVendors() + renderGuestList() + renderSeatingTab() + renderDayOf() +
      "</div></div></div>" + renderFooter();
    bindEvents();
  }

  var loginError = "";
  function renderLogin() {
    return '<div class="login-shell"><h1>The Wedding Ledger</h1><div class="login-sub">Sign in to view and edit your planner.</div>' +
      (loginNotice ? '<div class="login-notice">' + escapeHtml(loginNotice) + "</div>" : "") +
      (loginError ? '<div class="login-error">' + escapeHtml(loginError) + "</div>" : "") +
      '<form id="login-form">' +
      '<div class="field"><label for="login-email">Email</label><input id="login-email" type="email" autocomplete="username" required/></div>' +
      '<div class="field"><label for="login-password">Password</label><input id="login-password" type="password" autocomplete="current-password" required/></div>' +
      '<button class="btn btn-primary" type="submit" style="width:100%">Sign in</button>' +
      '<div class="login-links"><button class="link-btn" type="button" id="show-forgot-btn">Forgot password?</button></div>' +
      "</form></div>";
  }

  function bindLoginEvents() {
    var form = document.getElementById("login-form");
    if (!form) return;
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var email = document.getElementById("login-email").value.trim();
      var password = document.getElementById("login-password").value;
      var btn = form.querySelector("button[type=submit]");
      btn.disabled = true;
      btn.textContent = "Signing in…";
      fetch("/api/login", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, password: password })
      }).then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
        .then(function (r) {
          if (!r.ok) {
            loginError = (r.data && r.data.error) || "Could not sign in.";
            render();
            return;
          }
          loginError = "";
          loginNotice = "";
          currentUser = r.data.user;
          loadStateAndRender();
        }).catch(function () {
          loginError = "Network error — try again.";
          render();
        });
    });
    var showForgotBtn = document.getElementById("show-forgot-btn");
    if (showForgotBtn) showForgotBtn.addEventListener("click", function () {
      loginError = "";

  function renderForgotPassword() {
    return '<div class="login-shell"><h1>Reset your password</h1><div class="login-sub">Enter your account email and we\'ll send a link to set a new password.</div>' +
      (forgotMsg ? '<div class="login-notice">' + escapeHtml(forgotMsg) + "</div>" : "") +
      '<form id="forgot-form">' +
      '<div class="field"><label for="forgot-email">Email</label><input id="forgot-email" type="email" autocomplete="username" required/></div>' +
      '<button class="btn btn-primary" type="submit" style="width:100%">Send reset link</button>' +
      '<div class="login-links"><button class="link-btn" type="button" id="back-to-login-btn">Back to sign in</button></div>' +
      "</form></div>";
  }

  function bindForgotPasswordEvents() {
    var form = document.getElementById("forgot-form");
    if (form) form.addEventListener("submit", function (e) {
      e.preventDefault();
      var emailVal = document.getElementById("forgot-email").value.trim();
      var btn = form.querySelector("button[type=submit]");
      btn.disabled = true;
      btn.textContent = "Sending…";
      fetch("/api/forgot-password", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },

      }).then(function (res) { return res.json(); })

  function renderResetPassword() {
    return '<div class="login-shell"><h1>Set a new password</h1><div class="login-sub">Choose a new password for your account.</div>' +
      (resetErr ? '<div class="login-error">' + escapeHtml(resetErr) + "</div>" : "") +
      '<form id="reset-form">' +
      '<div class="field"><label for="reset-password">New password</label><input id="reset-password" type="password" autocomplete="new-password" minlength="8" required/></div>' +
      '<div class="field"><label for="reset-password-confirm">Confirm new password</label><input id="reset-password-confirm" type="password" autocomplete="new-password" minlength="8" required/></div>' +
      '<button class="btn btn-primary" type="submit" style="width:100%">Set new password</button>' +

  function bindResetPasswordEvents() {
    var form = document.getElementById("reset-form");
    if (!form) return;
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var pw = document.getElementById("reset-password").value;

      fetch("/api/reset-password", {
        method: "POST",
        credentials: "same-origin",

      }).then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
        .then(function (r) {
          if (!r.ok) {
            resetErr = (r.data && r.data.error) || "Could not reset your password.";
            render();

          resetErr = "";

          loginNotice = "Password updated — sign in with your new password.";

  function renderMasthead() {

      var lbl = du > 0 ? "days to go" : (du === 0 ? "today!" : "days married");

  function renderStatStrip() {
    var gaps = computeGaps();
    var critical = gaps.filter(function (g) { return g.level === "critical"; }).length;
    var warn = gaps.filter(function (g) { return g.level === "warning"; }).length;
    var budget = computeBudget();
    var pending = state.requests.filter(function (r) { return r.status === "pending"; }).length;
    var bookedCount = CATEGORY_META.filter(function (c) { return state.categories[c.key].bookedVendorId; }).length;

    function tile(val, lbl, cls) {
      return '<div class="stat-tile ' + (cls || "") + '"><div class="stat-val mono">' + val + '</div><div class="stat-lbl">' + lbl + "</div></div>";
    }
    return '<div class="stat-strip">' +
      tile(critical + warn, "open gaps", critical ? "critical" : (warn ? "warn" : "good")) +
      tile(bookedCount + " / " + CATEGORY_META.length, "categories booked", "") +
      tile(budget.total ? fmtMoney(budget.remaining) : "—", "budget remaining", budget.total && budget.remaining < 0 ? "critical" : "") +
      tile(pending, "requests pending", pending ? "warn" : "good") +
      "</div>";
  }

  function renderTabs() {
    return '<div class="sidebar" role="tablist">' + TABS.map(function (t) {
      return '<button class="tab-btn' + (t.key === activeTab ? " active" : "") + '" data-tab="' + t.key + '" role="tab">' + t.label + "</button>";
    }).join("") + "</div>";
  }

  function panel(key, html) {
    return '<div class="tab-panel' + (key === activeTab ? " active" : "") + '" data-panel="' + key + '">' + html + "</div>";
  }

  function renderOverview() {
    var gaps = computeGaps();
    var body;
    if (!gaps.length) {
      body = '<div class="empty-note">No open gaps right now — nicely done. Keep an eye on the Vendors tab as your date gets closer.</div>';
    } else {
      body = '<div class="gap-list">' + gaps.map(function (g) {
        return '<div class="gap-item ' + g.level + '"><div class="stripe"></div><div class="gap-item-body"><div class="gap-item-title">' + escapeHtml(g.title) + '</div><div class="gap-item-sub">' + escapeHtml(g.sub) + "</div></div></div>";
      }).join("") + "</div>";
    }
    var upcoming = state.checklist
      .map(function (it) { return { it: it, due: dueDateFor(it) }; })
      .filter(function (x) { return x.due && !x.it.done && x.due.getTime() >= today().getTime(); })
      .sort(function (a, b) { return a.due - b.due; })
      .slice(0, 5);
    var upcomingHtml = upcoming.length
      ? '<div class="checklist-group">' + upcoming.map(function (x) {
          return '<div class="check-row"><input type="checkbox" data-check="' + x.it.id + '" ' + (x.it.done ? "checked" : "") + '/><div><div class="check-title">' + escapeHtml(x.it.title) + '</div><div class="check-due">' + fmtDate(x.due) + "</div></div></div>";
        }).join("") + "</div>"
      : '<div class="empty-note">Set your wedding date to see upcoming to-dos here.</div>';

    var duesList = computePaymentsDue();
    var duesHtml = duesList.length
      ? '<div class="table-scroll"><table><thead><tr><th>Category</th><th>What</th><th>Amount</th><th>Due</th></tr></thead><tbody>' +
        duesList.map(function (d) {
          var due = parseDate(d.dueDate);
          var overdue = due && due.getTime() < today().getTime();
          return "<tr" + (overdue ? ' style="color:var(--critical)"' : "") + "><td>" + escapeHtml(d.category) + "</td><td>" + d.kind + '</td><td class="mono">' + fmtMoney(d.amount) + '</td><td class="mono">' + (due ? fmtDate(due) : d.dueDate) + (overdue ? " (overdue)" : "") + "</td></tr>";
        }).join("") + "</tbody></table></div>"
      : '<div class="empty-note">No deposits or balances due — or everything\'s already marked paid.</div>';

    return panel("overview",
      '<div class="card"><div class="card-head"><h2>Gaps & alerts</h2></div>' + body + "</div>" +
      '<div class="grid-2">' +
      '<div class="card"><h3>Coming up</h3>' + upcomingHtml + "</div>" +
      '<div class="card"><h3>Budget snapshot</h3>' + renderBudgetBars(true) + "</div>" +
      "</div>" +
      '<div class="card"><h3>Payments due</h3>' + duesHtml + "</div>"
    );
  }

  function renderColorwayPicker() {
    var current = (state.settings && state.settings.colorway) || "classic";
    var options = COLORWAYS.map(function (c) {
      var active = c.key === current;
      return '<button type="button" class="colorway-option' + (active ? " active" : "") + '" data-colorway-pick="' + c.key + '" ' + (canWrite ? "" : "disabled") + '>' +
        '<span class="colorway-swatch"><span style="background:' + c.colors[0] + '"></span><span style="background:' + c.colors[1] + '"></span></span>' +
        '<span class="colorway-label">' + escapeHtml(c.label) + (active ? " ✓" : "") + '</span>' +
        '<span class="colorway-sub">' + escapeHtml(c.sub) + "</span>" +
        "</button>";
    }).join("");
    return '<div class="card"><h2>Site colorway</h2><p class="muted">' +
      (canWrite ? "Pick a palette — it applies for both of you right away." : "The site's current color palette. Ask the owner to change it.") +
      '</p><div class="colorway-grid">' + options + "</div></div>";
  }

  function renderProfile() {
    var p = state.profile;
    var f = function (id, label, value, type, extra) {
      type = type || "text";
      return '<div class="field"><label for="' + id + '">' + label + '</label><input id="' + id + '" type="' + type + '" value="' + escapeHtml(value === null || value === undefined ? "" : value) + '" ' + (extra || "") + (canWrite ? "" : " disabled") + "/></div>";
    };
    var profileForm =
      '<div class="grid-2">' +
      f("f-names", "Couple's names", p.coupleNames) +
      f("f-date", "Wedding date", p.weddingDate, "date") +
      f("f-location", "Location (city, state / country)", p.location) +
      f("f-address", "Address (venue or general area)", p.address, "text", 'placeholder="e.g. 123 Main St, Austin, TX — vendor searches use this"') +
      f("f-guests", "Guest count", p.guestCount, "number", 'min="0"') +
      f("f-budget", "Total budget (USD)", p.budgetTotal, "number", 'min="0"') +
      f("f-style", "Style / vibe", p.style) +
      "</div>" +
      '<div class="field" style="margin-top:1rem"><label for="f-notes">Notes for planning (traditions, must-haves, anything I should know)</label><textarea id="f-notes" ' + (canWrite ? "" : "disabled") + ">" + escapeHtml(p.notes || "") + "</textarea></div>" +
      '<div class="save-row"><span class="save-status" id="save-status-badge"></span>' +
      (canWrite ? '<button class="btn btn-primary" id="save-profile-btn">Save profile</button>' : "") + "</div>";

    var catCards = CATEGORY_META.map(function (c) {
      var cat = state.categories[c.key];
      var statusPill = requestStatusPill(cat, c.key);
      var actionBtn = "";
      if (canWrite) {
        if (cat.requestStatus === "none") {
          actionBtn = '<button class="btn btn-secondary btn-sm" data-request-cat="' + c.key + '">Request vendors</button>';
        } else if (cat.requestStatus === "pending") {
          actionBtn = '<button class="btn btn-secondary btn-sm" disabled>Waiting…</button>';
        } else {
          actionBtn = '<button class="btn btn-secondary btn-sm" data-request-cat="' + c.key + '">Request more</button>';
        }
      }
      return '<div class="cat-card"><div class="cat-card-head"><h3>' + c.label + "</h3>" + statusPill + "</div>" +
        '<div class="cat-card-body"><div class="cat-note">' + (cat.vendors.length ? cat.vendors.length + " vendor" + (cat.vendors.length === 1 ? "" : "s") + " on file" : "No vendors researched yet") + "</div>" + actionBtn + "</div></div>";
    }).join("");

    var adhoc = canWrite ? '<div class="field" style="margin-top:0.5rem"><label for="f-adhoc">Ask for something specific</label><textarea id="f-adhoc" placeholder="e.g. Find 3 more florists near the venue under $2,500, or update the budget now that catering is booked at $9,200"></textarea></div><div class="save-row"><button class="btn btn-primary" id="submit-request-btn">Submit request</button></div>' : "";

    var log = state.requests.slice().reverse().map(function (r) {
      var statusPill = r.status === "pending"
        ? '<span class="pill"><span class="dot warning"></span>pending</span>'
        : '<span class="pill"><span class="dot good"></span>done</span>';
      return '<div class="request-item"><div class="ri-body"><div class="ri-text">' + escapeHtml(r.text) + "</div><div class=\"ri-meta\">" + (r.category ? categoryLabel(r.category) + " · " : "") + fmtDate(new Date(r.createdAt)) + " " + statusPill + "</div>" +
        (r.response ? '<div class="ri-response">' + escapeHtml(r.response) + "</div>" : "") +
        "</div></div>";
    }).join("") || '<div class="empty-note">No requests yet — request a category above or ask for something specific.</div>';

    var vendorImports = state.fileImports.filter(function (fi) { return (fi.targetHint || "").indexOf("vendor:") === 0; }).slice().reverse();
    var vendorImportLog = vendorImports.length ? '<div class="import-log">' + vendorImports.map(function (fi) {
      var catKey = fi.targetHint.split(":")[1];
      var statusPill = fi.status === "pending" ? '<span class="pill"><span class="dot warning"></span>reading…</span>' : '<span class="pill"><span class="dot good"></span>done</span>';
      return '<div class="import-item"><div style="flex:1"><div class="imp-name">' + escapeHtml(fi.filename) + "</div><div class=\"imp-meta\">" + categoryLabel(catKey) + " · " + fmtDate(new Date(fi.createdAt)) + " " + statusPill + "</div>" +
        (fi.response ? '<div class="imp-response">' + escapeHtml(fi.response) + "</div>" : "") + "</div></div>";
    }).join("") + "</div>" : "";

    var vendorUpload = canWrite ? '<div class="card"><h2>Have a quote or brochure?</h2><p class="muted">Upload a PDF, Word doc, spreadsheet, screenshot — whatever a vendor sent you. It\'s logged here for now; automatic parsing into a comparison row isn\'t wired up yet.</p>' +
      '<div class="grid-3"><div class="field"><label for="f-vendor-doc-cat">Category</label><select id="f-vendor-doc-cat">' + CATEGORY_META.map(function (c) { return '<option value="' + c.key + '">' + c.label + "</option>"; }).join("") + '</select></div>' +
      '<div class="field" style="grid-column:span 2"><label for="f-vendor-doc-file">File</label><input type="file" id="f-vendor-doc-file"/></div></div>' +
      '<div class="field" style="margin-top:0.7rem"><label for="f-vendor-doc-note">Anything I should know? (optional)</label><input type="text" id="f-vendor-doc-note" placeholder="e.g. this is their 2027 peak-season pricing"/></div>' +
      '<div class="save-row"><button class="btn btn-primary" id="upload-vendor-doc-btn">Upload document</button></div>' + vendorImportLog + "</div>" : (vendorImportLog ? '<div class="card"><h2>Uploaded documents</h2>' + vendorImportLog + "</div>" : "");

    return panel("profile",
      renderColorwayPicker() +
      '<div class="card"><h2>Wedding profile</h2><p class="muted">This is what I use to research vendors and build your timeline. Fill it in and save — updates flow back into this dashboard.</p>' + profileForm + "</div>" +
      '<div class="card"><h2>Vendor categories</h2><p class="muted">Log a research request for any category, or add options yourself on the Vendors tab. Automatic research isn\'t wired up yet — requests just sit logged below until you follow up.</p><div class="grid-3">' + catCards + "</div>" + adhoc + "</div>" +
      vendorUpload +
      '<div class="card"><h2>Request log</h2>' + log + "</div>" +
      renderAccountSecurity()
    );
  }

  function renderAccountSecurity() {
    return '<div class="card"><h2>Account security</h2><p class="muted">Change the password for ' + escapeHtml(currentUser ? currentUser.email : "your account") + ".</p>" +
      (changePasswordMsg ? '<div class="login-notice">' + escapeHtml(changePasswordMsg) + "</div>" : "") +
      (changePasswordErr ? '<div class="login-error">' + escapeHtml(changePasswordErr) + "</div>" : "") +
      '<div class="grid-2">' +
      '<div class="field"><label for="f-current-password">Current password</label><input id="f-current-password" type="password" autocomplete="current-password"/></div>' +
      '<div class="field"><label for="f-new-password">New password</label><input id="f-new-password" type="password" autocomplete="new-password" minlength="8"/></div>' +
      "</div>" +
      '<div class="save-row"><span></span><button class="btn btn-primary" id="change-password-btn">Change password</button></div>' +
      "</div>";
  }

  function requestStatusPill(cat, key) {
    if (cat.bookedVendorId) return '<span class="booked-badge">✓ Booked</span>';
    if (cat.requestStatus === "none") return '<span class="pill"><span class="dot neutral"></span>not started</span>';
    if (cat.requestStatus === "pending") return '<span class="pill"><span class="dot warning"></span>researching</span>';
    return '<span class="pill"><span class="dot good"></span>' + cat.vendors.length + ' found</span>';
  }

  // Labels for the fixed checklist buckets below. On a normal 12+ month
  // runway these print as-is. On a compressed timeline, the same buckets
  // (grouped by the item's original, unscaled offset — so items keep a
  // stable, sensible order) get relabeled with the actual compressed lead
  // time instead of a now-inaccurate "months before".
  function fmtLeadLabel(bound, scale) {
    if (bound === 0) return "Final weeks";
    if (scale >= 1) {
      var months = { "-300": "12+ months before", "-270": "9–11 months before", "-180": "6–8 months before", "-90": "3–5 months before", "-30": "1–2 months before" };
      return months[String(bound)] || (Math.abs(bound) + " days before");
    }
    var days = Math.max(1, Math.round(Math.abs(bound) * scale));
    if (days < 14) return "~" + days + " day" + (days === 1 ? "" : "s") + " before";
    if (days < 60) { var wks = Math.round(days / 7); return "~" + wks + " week" + (wks === 1 ? "" : "s") + " before"; }
    var mos = Math.round(days / 30.44);
    return "~" + mos + " month" + (mos === 1 ? "" : "s") + " before";
  }

  function renderChecklist() {
    var scale = checklistOffsetScale();
    var bounds = [-300, -270, -180, -90, -30, 0];
    var tests = [
      function (o) { return o <= -300; },
      function (o) { return o <= -270 && o > -300; },
      function (o) { return o <= -180 && o > -270; },
      function (o) { return o <= -90 && o > -180; },
      function (o) { return o <= -30 && o > -90; },
      function (o) { return o > -30; }
    ];
    var groups = bounds.map(function (bound, i) { return { label: fmtLeadLabel(bound, scale), test: tests[i] }; });
    var compressionNote = scale < 1
      ? '<p class="tiny" style="margin:-0.4rem 0 0.9rem">Your wedding is ' + daysUntil(state.profile.weddingDate) + ' days away — the standard 12-month checklist below has been compressed to fit that timeline. Skip or remove anything that doesn\'t apply.</p>'
      : "";
    var items = state.checklist.slice().sort(function (a, b) { return a.offset - b.offset; });
    var html = groups.map(function (g) {
      var rows = items.filter(function (it) { return g.test(it.offset); });
      if (!rows.length) return "";
      var rowsHtml = rows.map(function (it) {
        var due = dueDateFor(it);
        var overdue = due && !it.done && due.getTime() < today().getTime();
        return '<div class="check-row' + (it.done ? " done" : "") + '"><input type="checkbox" data-check="' + it.id + '" ' + (it.done ? "checked" : "") + (canWrite ? "" : " disabled") + '/><div style="flex:1"><div class="check-title">' + escapeHtml(it.title) + (it.category ? ' <span class="tiny">· ' + categoryLabel(it.category) + "</span>" : "") + '</div><div class="check-due' + (overdue ? " overdue" : "") + '">' + (due ? (overdue ? "Overdue — was due " : "Due ") + fmtDate(due) : "Set a wedding date for a due date") + "</div></div>" +
          (canWrite && it.custom ? '<button class="btn btn-ghost btn-sm check-remove" data-remove-check="' + it.id + '">Remove</button>' : "") +
          "</div>";
      }).join("");
      return '<div class="checklist-group"><h4>' + g.label + "</h4>" + rowsHtml + "</div>";
    }).join("");

    var addRow = canWrite ? '<div class="grid-2" style="margin-top:0.5rem"><div class="field"><label for="f-new-check">Add a custom to-do</label><input id="f-new-check" type="text" placeholder="e.g. Order welcome bags"/></div><div class="field"><label for="f-new-check-offset">Due (days before wedding)</label><input id="f-new-check-offset" type="number" placeholder="e.g. 30"/></div></div><div class="save-row"><button class="btn btn-secondary" id="add-check-btn">Add to-do</button><span class="save-status" id="save-status-badge-2"></span><button class="btn btn-primary" id="save-checklist-btn">Save checklist</button></div>' : "";

    return panel("checklist", '<div class="card"><h2>Wedding timeline</h2><p class="muted">Auto-generated from your wedding date, in the order most couples tackle them. Check items off as you go.</p>' + compressionNote + html + addRow + "</div>");
  }

  function renderBudgetBars(compact) {
    var rows = CATEGORY_META.map(function (c) {
      var cat = state.categories[c.key];
      var alloc = Number(cat.allocated) || 0;
      var act = Number(cat.actual) || 0;
      return { key: c.key, label: c.label, alloc: alloc, act: act };
    }).filter(function (r) { return !compact || r.alloc || r.act; });
    var max = Math.max(1, Math.max.apply(null, rows.map(function (r) { return Math.max(r.alloc, r.act); }).concat([1])));
    if (!rows.length) return '<div class="empty-note">Add allocated or actual costs per category to see this chart.</div>';
    var body = rows.map(function (r) {
      var allocPct = Math.min(100, (r.alloc / max) * 100);
      var actPct = Math.min(100, (r.act / max) * 100);
      return '<div class="barrow"><div class="barlabel">' + r.label + '</div><div class="bartrack"><div class="barfill s1" style="width:' + allocPct + '%"></div><div class="barfill s2" style="width:' + actPct + '%"></div></div><div class="barval">' + fmtMoney(r.act || r.alloc) + "</div></div>";
    }).join("");
    return '<div class="barchart">' + body + '</div><div class="legend"><span><i style="background:var(--series-1)"></i>Allocated</span><span><i style="background:var(--series-2)"></i>Actual</span></div>';
  }

  var budgetView = "recommended";

  function renderRecommendedBudget() {
    var b = computeBudget();
    if (!b.total) {
      return '<div class="card"><h2>Recommended breakdown</h2><div class="empty-note">Add a total budget on the Profile tab to see a recommended split by category.</div></div>';
    }
    var rec = computeRecommendedBudget();
    var rows = CATEGORY_META.map(function (c) {
      var cat = state.categories[c.key];
      var r = rec[c.key];
      return '<tr><td>' + c.label + (r.fromSignal ? ' <span class="tiny muted">(using your vendor research)</span>' : "") + '</td>' +
        '<td class="num">' + Math.round(r.pct) + '%</td>' +
        '<td class="num mono">' + fmtMoney(r.amount) + '</td>' +
        '<td class="num">' + (cat.allocated ? fmtMoney(cat.allocated) : "—") + "</td>" +
        "<td>" + (canWrite ? '<button class="btn btn-secondary btn-sm" data-rec-use="' + c.key + '">Use ' + fmtMoney(r.amount) + "</button>" : "") + "</td></tr>";
    }).join("");

    return '<div class="card"><h2>Recommended breakdown</h2>' +
      '<p class="muted">Typical percentage splits for a ' + fmtMoney(b.total) + ' wedding, nudged by your guest count, style notes, and any vendor quotes you\'ve already gathered. A starting point, not a quote.</p>' +
      '<div class="table-scroll"><table><thead><tr><th>Category</th><th class="num">Typical %</th><th class="num">Recommended</th><th class="num">Your allocation</th><th></th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
      (canWrite ? '<div class="save-row"><span class="save-status" id="save-status-badge-3"></span><button class="btn btn-secondary btn-sm" id="apply-recommended-empty-btn">Fill in empty categories</button><button class="btn btn-ghost btn-sm" id="apply-recommended-all-btn" data-armed="0">Overwrite all with recommended</button></div>' : "") +
      "</div>";
  }

  function renderYourBudget() {
    var b = computeBudget();
    var gc = Number(state.profile.guestCount) || 0;
    var rows = CATEGORY_META.map(function (c) {
      var cat = state.categories[c.key];
      var perGuest = c.key === "catering" && gc && cat.allocated ? '<div class="tiny muted">≈ ' + fmtMoney(Math.round((Number(cat.allocated) / gc) * 100) / 100) + " / guest</div>" : "";
      return '<tr><td>' + c.label + (cat.bookedVendorId ? ' <span class="booked-badge">✓</span>' : "") + '</td>' +
        '<td class="num"><input type="number" min="0" data-budget-alloc="' + c.key + '" value="' + (cat.allocated || "") + '" style="max-width:100px" ' + (canWrite ? "" : "disabled") + "/>" + perGuest + "</td>" +
        '<td class="num"><input type="number" min="0" data-budget-actual="' + c.key + '" value="' + (cat.actual || "") + '" style="max-width:100px" ' + (canWrite ? "" : "disabled") + "/></td>" +
        '<td class="num">' + (cat.allocated && cat.actual ? fmtMoney(cat.allocated - cat.actual) : "—") + "</td></tr>";
    }).join("");
    var predictedNote = b.total
      ? (b.allocated > b.total
          ? '<span style="color:var(--critical)">' + fmtMoney(b.allocated - b.total) + " over your " + fmtMoney(b.total) + " budget</span>"
          : fmtMoney(b.total - b.allocated) + " under your " + fmtMoney(b.total) + " budget")
      : "Add a total budget on the Profile tab to compare.";

    return '<div class="card"><h2>Your breakdown</h2><p class="muted">Enter what you plan to spend per category — your predicted total is the sum, shown above and compared to your budget here: ' + predictedNote + '</p>' +
      '<div class="table-scroll"><table><thead><tr><th>Category</th><th class="num">Your plan (allocated)</th><th class="num">Actually spent</th><th class="num">Diff</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
      '<div class="save-row"><span class="save-status" id="save-status-badge-3"></span>' + (canWrite ? '<button class="btn btn-primary" id="save-budget-btn">Save budget</button>' : "") + '<button class="btn btn-secondary btn-sm" id="export-budget-btn">Export budget (CSV)</button>' + "</div></div>";
  }

  function renderBudget() {
    var b = computeBudget();
    var toggle = '<div class="filter-group" style="margin-bottom:1rem">' +
      '<button class="filter-btn' + (budgetView === "recommended" ? " active" : "") + '" data-budget-view="recommended">Recommended breakdown</button>' +
      '<button class="filter-btn' + (budgetView === "yours" ? " active" : "") + '" data-budget-view="yours">Your breakdown</button>' +
      "</div>";

    return panel("budget",
      '<div class="card"><h2>Budget overview</h2>' +
      '<div class="grid-3" style="margin-bottom:1rem">' +
      '<div><div class="tiny">Total budget</div><div class="mono" style="font-size:1.3rem">' + fmtMoney(b.total || null) + '</div></div>' +
      '<div><div class="tiny">Predicted total (your plan)</div><div class="mono" style="font-size:1.3rem;' + (b.total && b.allocated > b.total ? "color:var(--critical)" : "") + '">' + (b.allocated ? fmtMoney(b.allocated) : "—") + '</div></div>' +
      '<div><div class="tiny">Spent so far</div><div class="mono" style="font-size:1.3rem">' + fmtMoney(b.actual) + '</div></div>' +
      '<div><div class="tiny">Remaining</div><div class="mono" style="font-size:1.3rem;' + (b.total && b.remaining < 0 ? "color:var(--critical)" : "") + '">' + (b.total ? fmtMoney(b.remaining) : "—") + "</div></div>" +
      "</div>" + renderBudgetBars(false) + "</div>" +
      toggle +
      (budgetView === "recommended" ? renderRecommendedBudget() : renderYourBudget())
    );
  }

  var expandedVendorScores = {};

  function renderVendorPayment(c, cat) {
    if (!cat.bookedVendorId) return "";
    var p = cat.payment || defaultPayment();
    return '<div class="card" style="margin-top:-0.5rem;margin-bottom:1rem;border-top:none;border-top-left-radius:0;border-top-right-radius:0"><h4 style="margin-top:0">Payments — ' + c.label + '</h4><div class="detail-grid">' +

          return header + '<div class="table-scroll"><table><thead><tr><th>Name</th><th>Side</th><th>Group</th><th>+1</th><th>Status</th><th>RSVP</th><th></th><th></th></tr></thead><tbody>' + rows + "</tbody></table></div>";
        }).join("");
      }
    } else {
      tableHtml = '<div class="empty-note">No guests yet — upload a file, paste a list, or add someone manually above.</div>';
    }

    var saveRow = canWrite && state.guests.length ? '<div class="save-row"><span class="save-status" id="save-status-badge-4"></span><button class="btn btn-primary" id="save-guests-btn">Save guest list</button></div>' : "";

    return panel("guests",
      '<div class="card"><h2>Guest list</h2><p class="muted">Upload or build your list here, then work through it to decide who\'s in. This feeds the headcount and budget gap checks on the Overview tab.</p>' + statTiles + "</div>" +
      importCard + householdsCard + manualAdd +
      '<div class="card">' + filterBar + tableHtml + saveRow + "</div>"
    );
