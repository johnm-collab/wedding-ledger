  // Labels for the fixed checklist buckets below. On a normal 12+ month
  // runway these print as-is. On a compressed timeline, the same buckets
  // (grouped by the item's original, unscaled offset — so items keep a
  // stable, sensible order) get relabeled with the actual compressed lead
  // time instead of a now-inaccurate "months before".
  function fmtLeadLabel(bound, scale) {
    if (bound === 0) return "Final weeks";
    if (scale >= 1) {
      var months = { "-300": "12+ months before", "-270": "9–11 months before", "-180": "6–8 months before", "-90": "3–5 months before", "-30": "1–2 months before" };
      return months[String(bound)] || (Math.abs(bound) + " days before");
    }
    var days = Math.max(1, Math.round(Math.abs(bound) * scale));
    if (days < 14) return "~" + days + " day" + (days === 1 ? "" : "s") + " before";
    if (days < 60) { var wks = Math.round(days / 7); return "~" + wks + " week" + (wks === 1 ? "" : "s") + " before"; }
    var mos = Math.round(days / 30.44);
    return "~" + mos + " month" + (mos === 1 ? "" : "s") + " before";
  }

  // Four narrative phases (per the "stress-free mental model" IA) instead
  // of six flat lead-time buckets. Boundaries were chosen by walking every
  // CHECKLIST_DEFAULTS item's offset so each lands somewhere sensible —
  // e.g. "Give caterer final headcount" at -21 correctly falls in
  // Executing, not Polishing.
  var CHECKLIST_PHASES = [
    { key: "dreaming", label: "Dreaming", blurb: "The big-picture decisions — budget, guest count, the people you want by your side.", test: function (o) { return o < -300; } },
    { key: "booking", label: "Booking", blurb: "Lock in the venue and the vendors that book up first.", test: function (o) { return o < -100 && o >= -300; } },
    { key: "polishing", label: "Polishing", blurb: "The details that make it yours — stationery, cake, final fittings.", test: function (o) { return o < -25 && o >= -100; } },
    { key: "executing", label: "Executing", blurb: "Final counts, final payments, and the day itself.", test: function (o) { return o >= -25; } }
  ];
  var checklistPhaseOverride = {};

  function renderChecklist() {
    var scale = checklistOffsetScale();
    var compressionNote = scale < 1
      ? '<p class="tiny" style="margin:-0.4rem 0 0.9rem">Your wedding is ' + daysUntil(state.profile.weddingDate) + ' days away — the standard 12-month checklist below has been compressed to fit that timeline. Skip or remove anything that doesn\'t apply.</p>'
      : "";
    var items = state.checklist.slice().sort(function (a, b) { return a.offset - b.offset; });

    var phaseData = CHECKLIST_PHASES.map(function (p) {
      var rows = items.filter(function (it) { return p.test(it.offset); });
      var doneCount = rows.filter(function (it) { return it.done; }).length;
      return { phase: p, rows: rows, doneCount: doneCount, total: rows.length, pct: rows.length ? Math.round((doneCount / rows.length) * 100) : 0 };
    }).filter(function (pd) { return pd.total > 0; });

    var currentKey = null;
    for (var i = 0; i < phaseData.length; i++) {
      if (phaseData[i].doneCount < phaseData[i].total) { currentKey = phaseData[i].phase.key; break; }
    }
    if (!currentKey && phaseData.length) currentKey = phaseData[phaseData.length - 1].phase.key;

    var rail = '<div class="phase-rail">' + phaseData.map(function (pd) {
      var isCurrent = pd.phase.key === currentKey;
      var isDone = pd.doneCount === pd.total;
      return '<button type="button" class="phase-tile' + (isCurrent ? " current" : "") + (isDone ? " phase-done" : "") + '" data-phase-jump="' + pd.phase.key + '">' +
        '<div class="p-eyebrow">' + (isCurrent ? "Now" : (isDone ? "Done" : "Ahead")) + '</div>' +
        '<h4>' + escapeHtml(pd.phase.label) + '</h4>' +
        '<div class="p-count">' + pd.doneCount + ' of ' + pd.total + ' done</div>' +
        '<div class="p-fill"><i style="width:' + pd.pct + '%"></i></div>' +
        "</button>";
    }).join("") + "</div>";

    var html = phaseData.map(function (pd) {
      var isOpen = checklistPhaseOverride.hasOwnProperty(pd.phase.key) ? checklistPhaseOverride[pd.phase.key] : (pd.phase.key === currentKey);
      var rowsHtml = pd.rows.map(function (it) {
        var due = dueDateFor(it);
        var overdue = due && !it.done && due.getTime() < today().getTime();
        return '<div class="check-row' + (it.done ? " done" : "") + '"><input type="checkbox" data-check="' + it.id + '" ' + (it.done ? "checked" : "") + (canWrite ? "" : " disabled") + '/><div style="flex:1"><div class="check-title">' + escapeHtml(it.title) + (it.category ? ' <span class="tiny">· ' + categoryLabel(it.category) + "</span>" : "") + '</div><div class="check-due' + (overdue ? " overdue" : "") + '">' + (due ? (overdue ? "Overdue — was due " : "Due ") + fmtDate(due) : "Set a wedding date for a due date") + "</div></div>" +
          (canWrite && it.custom ? '<button class="btn btn-ghost btn-sm check-remove" data-remove-check="' + it.id + '">Remove</button>' : "") +
          "</div>";
      }).join("");
      return '<div class="checklist-phase-group' + (isOpen ? " open" : "") + '">' +
        '<button type="button" class="phase-toggle" data-phase-toggle="' + pd.phase.key + '"><span><span class="pt-title">' + escapeHtml(pd.phase.label) + '</span> · <span class="tiny">' + escapeHtml(pd.phase.blurb) + '</span></span><span class="pt-meta">' + pd.doneCount + '/' + pd.total + ' <span class="pt-chevron">›</span></span></button>' +
        (isOpen ? '<div class="checklist-phase-body">' + rowsHtml + "</div>" : "") +
        "</div>";
    }).join("");

    var addRow = canWrite ? '<div class="grid-2" style="margin-top:0.5rem"><div class="field"><label for="f-new-check">Add a custom to-do</label><input id="f-new-check" type="text" placeholder="e.g. Order welcome bags"/></div><div class="field"><label for="f-new-check-offset">Due (days before wedding)</label><input id="f-new-check-offset" type="number" placeholder="e.g. 30"/></div></div><div class="save-row"><button class="btn btn-secondary" id="add-check-btn">Add to-do</button><span class="save-status" id="save-status-badge-2"></span><button class="btn btn-primary" id="save-checklist-btn">Save checklist</button></div>' : "";

    return panel("checklist", '<div class="card"><h2>Wedding timeline</h2><p class="muted">Grouped into four phases, in the order most couples tackle them — the phase you\'re in stays open, the rest tuck away until you need them. Check items off as you go.</p>' + compressionNote + rail + html + addRow + "</div>");
  }

  function renderBudgetBars(compact) {
    var rows = CATEGORY_META.map(function (c) {
      var cat = state.categories[c.key];
      var alloc = Number(cat.allocated) || 0;
      var act = Number(cat.actual) || 0;
      return { key: c.key, label: c.label, alloc: alloc, act: act };
    }).filter(function (r) { return !compact || r.alloc || r.act; });
    var max = Math.max(1, Math.max.apply(null, rows.map(function (r) { return Math.max(r.alloc, r.act); }).concat([1])));
    if (!rows.length) return '<div class="empty-note">Add allocated or actual costs per category to see this chart.</div>';
    var body = rows.map(function (r) {
      var allocPct = Math.min(100, (r.alloc / max) * 100);
      var actPct = Math.min(100, (r.act / max) * 100);
      return '<div class="barrow"><div class="barlabel">' + r.label + '</div><div class="bartrack"><div class="barfill s1" style="width:' + allocPct + '%"></div><div class="barfill s2" style="width:' + actPct + '%"></div></div><div class="barval">' + fmtMoney(r.act || r.alloc) + "</div></div>";
    }).join("");
    return '<div class="barchart">' + body + '</div><div class="legend"><span><i style="background:var(--series-1)"></i>Allocated</span><span><i style="background:var(--series-2)"></i>Actual</span></div>';

  function renderVendors() {

        var rows = cat.vendors.map(function (v) {

    if (dist <= h) return { x: -halfW, y: halfH - dist };
    dist -= h;
    return { x: -halfW + dist, y: -halfH };
  }

  // Rotates an (x,y) offset from a table's center by `deg` degrees, so a
  // rotated table's seats stay lined up with its (also rotated) edges
  // instead of sitting where the seats would be at rotation 0.
  function rotateOffset(x, y, deg) {
    if (!deg) return { x: x, y: y };
    var rad = deg * Math.PI / 180;
    var cos = Math.cos(rad), sin = Math.sin(rad);
    return { x: x * cos - y * sin, y: x * sin + y * cos };
  }

  function renderSeatingVisual(invited) {
    if (!state.tables.length) return '<div class="empty-note">Add a table below to start the seating chart.</div>';
    var pillWidth = 108, pillGap = 16;
    var cards = state.tables.map(function (t, idx) {
      var seated = invited.filter(function (g) { return g.tableId === t.id; });
      var capacity = Math.max(Number(t.capacity) || 0, seated.length, 1);
      var over = t.capacity && seated.length > Number(t.capacity);
      var shape = t.shape === "rectangle" ? "rectangle" : "round";
      var rotation = Number(t.rotation) || 0;
      var pos = tablePosition(t, idx);
      var seats = [];
      var size, center, tableW, tableH;

      if (shape === "rectangle") {
        // The table grows with capacity (long side scales), seats walk an
        // evenly-spaced loop just outside the table's own edges.
        tableW = Math.min(220, Math.max(120, capacity * 15));
        tableH = 72;
        var seatGap = 14;
        var loopW = tableW + seatGap * 2, loopH = tableH + seatGap * 2;
        size = Math.round(Math.max(loopW, loopH) + pillWidth + 48);
        center = size / 2;
        var loopPerim = 2 * (loopW + loopH);
        for (var i = 0; i < capacity; i++) {
          var g = seated[i] || null;
          var pt = pointOnRectPerimeter((loopPerim / capacity) * i, loopW, loopH);
          var off = rotateOffset(pt.x, pt.y, rotation);
          seats.push(seatHtml(g, center + off.x, center + off.y));
        }
      } else {
        // The table itself grows a little with capacity so bigger tables
        // read as bigger, and the ring of name pills sits far enough
        // outside it (based on how many seats have to fit around the
        // circumference) that neighboring names don't overlap.
        tableW = tableH = Math.min(150, Math.max(84, capacity * 9));
        var tableRadius = tableW / 2;
        var seatRadius = Math.max(tableRadius + 46, (capacity * (pillWidth + pillGap)) / (2 * Math.PI));
        size = Math.round(seatRadius * 2 + pillWidth + 24);
        center = size / 2;
        for (var j = 0; j < capacity; j++) {
          var g2 = seated[j] || null;
          var angle = (360 / capacity) * j - 90;
          var rad = angle * Math.PI / 180;
          var off2 = rotateOffset(seatRadius * Math.cos(rad), seatRadius * Math.sin(rad), rotation);
          seats.push(seatHtml(g2, center + off2.x, center + off2.y));
        }
      }

      // The shape itself is rotated; its name/count label is counter-
      // rotated by the same amount so the text always reads upright, and
      // sits directly inside the table shape (not floating below the whole
      // stage) so it's easy to tell which label belongs to which table.
      var shapeTransform = "translate(-50%,-50%)" + (rotation ? " rotate(" + rotation + "deg)" : "");
      var centerTransform = "translate(-50%,-50%)" + (rotation ? " rotate(" + (-rotation) + "deg)" : "");

      return '<div class="floor-table" data-table-id="' + t.id + '" style="left:' + pos.x + '%;top:' + pos.y + '%">' +
        '<div class="seat-visual-stage" style="width:' + size + 'px;height:' + size + 'px">' +
        '<div class="seat-table-visual ' + shape + (over ? " over" : "") + '" style="width:' + tableW + 'px;height:' + tableH + 'px;left:' + center + 'px;top:' + center + 'px;transform:' + shapeTransform + '"' + (canWrite ? ' data-table-drag="' + t.id + '"' : "") + '>' +
        '<div class="seat-table-center" style="transform:' + centerTransform + '"><div class="tiny seat-table-name">' + escapeHtml(t.name) + '</div><div class="tiny">' + seated.length + " / " + (t.capacity || capacity) + "</div></div>" +
        "</div>" + seats.join("") + "</div>" +
        (canWrite ? '<div class="floor-table-actions"><button class="seat-remove-link" data-table-rotate="' + t.id + '">Rotate ⟳</button><button class="seat-remove-link" data-table-remove="' + t.id + '">Remove</button></div>' : "") +
        "</div>";
    }).join("");
    return '<div class="floor-plan-canvas' + (seatingFullscreen ? " fullscreen" : "") + '" id="floor-plan-canvas">' +
      (seatingFullscreen ? '<button class="btn btn-secondary btn-sm floor-plan-exit" id="exit-fullscreen-btn" type="button">✕ Exit full screen</button>' : "") +
      cards + "</div>" +
      (seatingFullscreen ? '<div class="floor-plan-backdrop" id="floor-plan-backdrop"></div>' : "") +
      '<p class="tiny" style="margin-top:0.75rem">' + (canWrite ? "Drag a table to rearrange the floor plan. " : "") + 'Click a name to unseat that guest. Colors follow RSVP: green attending, red declined, gray awaiting a response.</p>';
  }

  // "Alex Chen" -> "Alex C." — keeps pills legible in a crowded floor
  // plan; the full name is still always available in the tooltip and in
  // the List view.
  function shortGuestName(name) {
    var parts = (name || "").trim().split(/\s+/).filter(Boolean);
    if (parts.length < 2) return name || "";
    return parts[0] + " " + parts[parts.length - 1].charAt(0).toUpperCase() + ".";
  }

  function seatHtml(g, x, y) {
    if (g) {
      return '<div class="seat-pill ' + seatChipClass(g) + '" style="left:' + x.toFixed(1) + 'px;top:' + y.toFixed(1) + 'px" title="' + escapeHtml(g.name) + (g.rsvp ? " · " + rsvpLabel(g.rsvp) : "") + '"' + (canWrite ? ' data-table-unseat="' + g.id + '"' : "") + ">" + escapeHtml(shortGuestName(g.name)) + "</div>";
    }
    return '<div class="seat-dot" style="left:' + x.toFixed(1) + 'px;top:' + y.toFixed(1) + 'px" title="Empty seat"></div>';
  }

  function renderSeatingList(invited) {
    if (!state.tables.length) return '<div class="empty-note">Add a table below to start the seating chart.</div>';
    return state.tables.map(function (t) {
      var seated = invited.filter(function (g) { return g.tableId === t.id; });
      var over = t.capacity && seated.length > Number(t.capacity);
      var guestRows = seated.map(function (g) {
        return '<div class="import-item"><div style="flex:1">' + escapeHtml(g.name) + "</div>" + (canWrite ? '<button class="btn btn-ghost btn-sm" data-table-unseat="' + g.id + '">Unseat</button>' : "") + "</div>";
      }).join("");
      return '<div class="cat-card" style="margin-bottom:1rem"><div class="cat-card-head"><h3>' + escapeHtml(t.name) + '</h3><span class="pill"><span class="dot ' + (over ? "critical" : "good") + '"></span>' + seated.length + (t.capacity ? " / " + t.capacity : "") + "</span></div><div class=\"cat-card-body\">" +
        (guestRows || '<div class="empty-note">No one seated here yet.</div>') +
        (canWrite ? '<div style="margin-top:0.6rem"><button class="btn btn-ghost btn-sm" data-table-remove="' + t.id + '">Remove table</button></div>' : "") +
        "</div></div>";
    }).join("");
  }

  function renderSeating() {
    // Seating-eligible = RSVP'd attending. A guest already seated stays
    // visible even if their RSVP later changes, so a table assignment never
    // just silently vanishes — but the normal path onto this tab is
    // clicking "Attending" on the Guest List tab.
    var invited = state.guests.filter(function (g) { return g.rsvp === "attending" || !!g.tableId; });
    var unseated = invited.filter(function (g) { return !g.tableId || !state.tables.some(function (t) { return t.id === g.tableId; }); });

    var toggle = '<div class="filter-group seating-toolbar" style="margin-bottom:1rem">' +
      '<div><button class="filter-btn' + (seatingView === "visual" ? " active" : "") + '" data-seating-view="visual">Visual</button>' +
      '<button class="filter-btn' + (seatingView === "list" ? " active" : "") + '" data-seating-view="list">List</button></div>' +
      '<div>' + (seatingView === "visual" ? '<button class="btn btn-secondary btn-sm" id="fullscreen-seating-btn" type="button">' + (seatingFullscreen ? "Exit full screen" : "⤢ Full screen") + "</button> " : "") +
      '<button class="btn btn-secondary btn-sm" id="print-seating-btn" type="button">🖨 Print run sheet</button></div>' +
      "</div>";
    var tablesBlock = seatingView === "visual" ? renderSeatingVisual(invited) : renderSeatingList(invited);

    var unseatedRows = unseated.length ? '<div class="table-scroll"><table><thead><tr><th>Name</th><th>Assign to table</th></tr></thead><tbody>' +
      unseated.map(function (g) {
        return "<tr><td>" + escapeHtml(g.name) + '</td><td><select data-guest-field="tableId|' + g.id + '" ' + (canWrite ? "" : "disabled") + '><option value="">— unseated —</option>' +
          state.tables.map(function (t) { return '<option value="' + t.id + '">' + escapeHtml(t.name) + "</option>"; }).join("") + "</select></td></tr>";
      }).join("") + "</tbody></table></div>" : '<div class="empty-note">' + (invited.length ? "Everyone attending has a seat." : "Mark guests “Attending” on the Guest List tab and they’ll show up here to seat.") + "</div>";

    var addTableForm = canWrite ? '<div class="grid-3" style="margin-top:1rem"><div class="field"><label for="f-table-name">Table name</label><input type="text" id="f-table-name" placeholder="e.g. Table 1"/></div>' +
      '<div class="field"><label for="f-table-capacity">Capacity</label><input type="number" min="1" id="f-table-capacity"/></div>' +
      '<div class="field"><label for="f-table-shape">Shape</label><select id="f-table-shape"><option value="round">Round</option><option value="rectangle">Rectangular</option></select></div></div>' +
      '<div class="save-row"><button class="btn btn-secondary" id="add-table-btn">Add table</button></div>' : "";

    return '<div class="card"><h2>Seating chart</h2><p class="muted">Add tables, then assign each invited guest to one — the visual view updates live from your guest list. Round or rectangular, and drag any table to lay out the room.</p>' + toggle + tablesBlock + addTableForm + "</div>" +
      '<div class="card"><h3>Unseated</h3>' + unseatedRows + "</div>" +
      '<div class="save-row"><span class="save-status" id="save-status-badge-6"></span>' + (canWrite ? '<button class="btn btn-primary" id="save-seating-btn">Save seating chart</button>' : "") + "</div>" +
      renderSeatingPrintSheet(invited);
  }

  // A plain, page-friendly table-by-table list plus the day's schedule —
  // hidden on screen (see .print-run-sheet CSS), shown only when the
  // "Print run sheet" button triggers window.print().
  function renderSeatingPrintSheet(invited) {
    var p = state.profile;
    var header = '<div class="prs-header" style="margin-bottom:1rem"><h2 style="margin-bottom:0.2rem">' + escapeHtml(p.coupleNames || "Our Wedding") + " — Seating & Day-Of Run Sheet</h2>" +
      '<div class="tiny">' + [p.weddingDate ? fmtDate(new Date(p.weddingDate + "T00:00:00")) : "", p.location].filter(Boolean).join(" · ") + "</div></div>";

    var tablesHtml = state.tables.length ? state.tables.map(function (t) {
      var seated = invited.filter(function (g) { return g.tableId === t.id; });
      return '<div class="prs-table"><h4>' + escapeHtml(t.name) + (t.capacity ? " (" + seated.length + "/" + t.capacity + ")" : " (" + seated.length + ")") + "</h4>" +
        (seated.length ? "<ul>" + seated.map(function (g) { return "<li>" + escapeHtml(g.name) + (g.mealChoice ? " — " + escapeHtml(g.mealChoice) : "") + "</li>"; }).join("") + "</ul>" : '<div class="tiny">Empty</div>') +
        "</div>";
    }).join("") : '<div class="tiny">No tables added yet.</div>';

    var unseated = invited.filter(function (g) { return !g.tableId; });
    var unseatedHtml = unseated.length ? '<div class="prs-table"><h4>Unseated</h4><ul>' + unseated.map(function (g) { return "<li>" + escapeHtml(g.name) + "</li>"; }).join("") + "</ul></div>" : "";

    var scheduleHtml = state.timeline.length ? '<div class="prs-table"><h4>Schedule</h4><ul>' +
      state.timeline.slice().sort(function (a, b) { return (a.time || "").localeCompare(b.time || ""); }).map(function (t) {
        return "<li><strong>" + escapeHtml(fmtTime(t.time)) + "</strong> — " + escapeHtml(t.title) + (t.notes ? " (" + escapeHtml(t.notes) + ")" : "") + "</li>";
      }).join("") + "</ul></div>" : "";

    return '<div class="print-run-sheet">' + header + tablesHtml + unseatedHtml + scheduleHtml + "</div>";
  }

  function renderSeatingTab() {
    return panel("seating", renderSeating());
  }

  function renderDayOf() {
    return panel("dayof",
      renderTimeline() +
      '<div class="save-row"><span class="save-status" id="save-status-badge-5"></span>' + (canWrite ? '<button class="btn btn-primary" id="save-dayof-btn">Save timeline</button>' : "") + "</div>"
    );
  }

  function renderFooter() {
    return '<footer class="note">Everything here is saved to your shared planner as soon as you hit Save — no need to keep this tab open.</footer>';
  }

  /* ---------- events ---------- */

  function bindEvents() {
    var root = document.getElementById("app-root");

    var logoutBtn = document.getElementById("logout-btn");
    if (logoutBtn) logoutBtn.addEventListener("click", function () {
      fetch("/api/logout", { method: "POST", credentials: "same-origin" }).then(function () {
        currentUser = null;
        state = defaultState();
        render();
      });
    });

    root.querySelectorAll(".tab-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        activeTab = btn.getAttribute("data-tab");
        navOpen = false;
        render();
      });
    });

    var navToggleBtn = document.getElementById("nav-toggle-btn");
    if (navToggleBtn) navToggleBtn.addEventListener("click", function () { navOpen = true; render(); });
    var navCloseBtn = document.getElementById("nav-close-btn");
    if (navCloseBtn) navCloseBtn.addEventListener("click", function () { navOpen = false; render(); });
    var navBackdrop = document.getElementById("nav-backdrop");
    if (navBackdrop) navBackdrop.addEventListener("click", function () { navOpen = false; render(); });

    // Reads whatever's currently typed into the profile form fields, when
    // they're on screen (i.e. we're on the Profile tab). Shared by the Save
    // Profile button and the colorway picker below — picking a colorway
    // saves+re-renders on its own, and without this, that re-render would
    // silently overwrite the visible inputs with the last-saved (stale)
    // values, wiping out anything typed but not yet saved.
    function profileFieldsFromForm(profile) {
      if (!document.getElementById("f-names")) return profile;
      return Object.assign({}, profile, {
        coupleNames: val("f-names"),
        weddingDate: val("f-date"),
        location: val("f-location"),
        address: val("f-address"),
        guestCount: numOrNull(val("f-guests")),
        budgetTotal: numOrNull(val("f-budget")),
        style: val("f-style"),
        notes: val("f-notes", true)
      });
    }

    var saveProfileBtn = document.getElementById("save-profile-btn");
    if (saveProfileBtn) saveProfileBtn.addEventListener("click", function () {
      var next = clone(state);
      next.profile = profileFieldsFromForm(next.profile);
      saveState(next, { doneLabel: "Profile saved." });
    });

    var changePasswordBtn = document.getElementById("change-password-btn");
    if (changePasswordBtn) changePasswordBtn.addEventListener("click", function () {
      var currentPassword = val("f-current-password");
      var newPassword = val("f-new-password");
      changePasswordMsg = "";
      changePasswordErr = "";
      if (!currentPassword || !newPassword) {
        changePasswordErr = "Enter your current and new password.";
        render();
        return;
      }
      if (newPassword.length < 8) {
        changePasswordErr = "New password must be at least 8 characters.";
        render();
        return;
      }
      changePasswordBtn.disabled = true;
      changePasswordBtn.textContent = "Changing…";
      fetch("/api/change-password", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ currentPassword: currentPassword, newPassword: newPassword })
      }).then(function (res) {
        if (res.status === 401) { currentUser = null; render(); return null; }
        return res.json().then(function (data) { return { ok: res.ok, data: data }; });
      }).then(function (r) {
        if (!r) return;
        if (!r.ok) {
          changePasswordErr = (r.data && r.data.error) || "Could not change your password.";
          render();
          return;
        }
        changePasswordMsg = "Password changed.";
        render();
      }).catch(function () {
        changePasswordErr = "Network error — try again.";
        render();
      });
    });

    root.querySelectorAll("[data-colorway-pick]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var key = btn.getAttribute("data-colorway-pick");
        if (key === (state.settings && state.settings.colorway)) return;
        applyColorway(key); // instant preview, doesn't wait on the save round-trip
        var next = clone(state);
        next.profile = profileFieldsFromForm(next.profile);
        next.settings = Object.assign({}, next.settings, { colorway: key });
        var picked = COLORWAYS.filter(function (c) { return c.key === key; })[0];
        saveState(next, { doneLabel: (picked ? picked.label : "Colorway") + " applied." }).then(function () {
          // If the save failed or hit a conflict, fall back to whatever
          // colorway the reconciled/reverted state actually has.
          applyColorway(state.settings && state.settings.colorway);
        });
      });
    });

    var couplePhotoInput = document.getElementById("f-couple-photo");
    if (couplePhotoInput) couplePhotoInput.addEventListener("change", function () {
      var file = couplePhotoInput.files && couplePhotoInput.files[0];
      if (!file) return;
      readAndResizeImage(file).then(function (dataUrl) {
        var next = clone(state);
        next.profile = Object.assign({}, profileFieldsFromForm(next.profile), { couplePhoto: dataUrl });
        photoError = "";
        saveState(next, { doneLabel: "Photo updated." });
      }).catch(function (e) {
        photoError = e.message || "Could not use that photo.";
        render();
      });
    });
    var removePhotoBtn = document.getElementById("remove-couple-photo-btn");
    if (removePhotoBtn) removePhotoBtn.addEventListener("click", function () {
      var next = clone(state);
      next.profile = Object.assign({}, profileFieldsFromForm(next.profile), { couplePhoto: "" });
      saveState(next, { doneLabel: "Photo removed." });
    });

    /* guest site (story, wedding party, FAQ, registry links) */

    // Shared by every Guest Site action below — every tab panel is always
    // in the DOM (just hidden), so this also carries over anything typed
    // but not yet saved on the Profile tab, the same way the colorway
    // picker and photo controls already do.
    function nextWithGuestSiteForm() {
      var next = clone(state);
      next.profile = profileFieldsFromForm(next.profile);
      return guestSiteFieldsFromForm(next);
    }

    var saveGuestSiteBtn = document.getElementById("save-guestsite-btn");
    if (saveGuestSiteBtn) saveGuestSiteBtn.addEventListener("click", function () {
      saveState(nextWithGuestSiteForm(), { doneLabel: "Guest site saved." });
    });

    var addPartyBtn = document.getElementById("add-party-btn");
    if (addPartyBtn) addPartyBtn.addEventListener("click", function () {
      var next = nextWithGuestSiteForm();
      if (!next.weddingParty) next.weddingParty = [];
      next.weddingParty.push({ id: makePartyId(), name: "", role: "", photo: "", blurb: "" });
      saveState(next, { doneLabel: "Added to the wedding party." });
    });
    root.querySelectorAll("[data-party-remove]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-party-remove");
        var next = nextWithGuestSiteForm();
        next.weddingParty = (next.weddingParty || []).filter(function (p) { return p.id !== id; });
        saveState(next, { doneLabel: "Removed." });
      });
    });
    root.querySelectorAll("[data-party-photo]").forEach(function (inp) {
      inp.addEventListener("change", function () {
        var id = inp.getAttribute("data-party-photo");
        var file = inp.files && inp.files[0];
        if (!file) return;
        readAndResizeImage(file, 500, 0.8).then(function (dataUrl) {
          var next = nextWithGuestSiteForm();
          var p = (next.weddingParty || []).filter(function (x) { return x.id === id; })[0];
          if (p) p.photo = dataUrl;
          saveState(next, { doneLabel: "Photo updated." });
        }).catch(function (e) {
          showToast(e.message || "Could not use that photo.");
        });
      });
    });

    var addFaqBtn = document.getElementById("add-faq-btn");
    if (addFaqBtn) addFaqBtn.addEventListener("click", function () {
      var next = nextWithGuestSiteForm();
      if (!next.faq) next.faq = [];
      next.faq.push({ id: makeFaqId(), question: "", answer: "" });
      saveState(next, { doneLabel: "Question added." });
    });
    root.querySelectorAll("[data-faq-remove]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-faq-remove");
        var next = nextWithGuestSiteForm();
        next.faq = (next.faq || []).filter(function (q) { return q.id !== id; });
        saveState(next, { doneLabel: "Removed." });
      });
    });

    var addRegistryBtn = document.getElementById("add-registry-btn");
    if (addRegistryBtn) addRegistryBtn.addEventListener("click", function () {
      var next = nextWithGuestSiteForm();
      if (!next.registryLinks) next.registryLinks = [];
      next.registryLinks.push({ id: makeRegistryId(), label: "", url: "", type: "store" });
      saveState(next, { doneLabel: "Link added." });
    });
    root.querySelectorAll("[data-registry-remove]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-registry-remove");
        var next = nextWithGuestSiteForm();
        next.registryLinks = (next.registryLinks || []).filter(function (r) { return r.id !== id; });
        saveState(next, { doneLabel: "Removed." });
      });
    });

    root.querySelectorAll("[data-request-cat]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var key = btn.getAttribute("data-request-cat");
        var next = clone(state);
        next.categories[key].requestStatus = "pending";
        next.requests.push({ id: "req-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7), kind: "category", category: key, text: "Find and compare vendors for " + categoryLabel(key) + ".", status: "pending", createdAt: Date.now(), response: null });
        saveState(next, { doneLabel: "Request sent — researching " + categoryLabel(key) + "." });
      });
    });

    var submitReqBtn = document.getElementById("submit-request-btn");
    if (submitReqBtn) submitReqBtn.addEventListener("click", function () {
      var text = val("f-adhoc", true).trim();
      if (!text) return;
      var next = clone(state);
      next.requests.push({ id: "req-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7), kind: "adhoc", category: null, text: text, status: "pending", createdAt: Date.now(), response: null });
      saveState(next, { doneLabel: "Request submitted." });
    });

    root.querySelectorAll("[data-check]").forEach(function (cb) {
      cb.addEventListener("change", function () {
        var id = cb.getAttribute("data-check");
        // Toggle the class immediately (before the save round-trip triggers
        // a full re-render) so the line-draw strikethrough transition in
        // CSS actually gets to play, instead of the row being destroyed
        // and recreated already in its final state.
        var row = cb.closest(".check-row");
        if (row) row.classList.toggle("done", cb.checked);
        var next = clone(state);
        next.checklist = next.checklist.map(function (it) { return it.id === id ? Object.assign({}, it, { done: cb.checked }) : it; });
        saveState(next, { doneLabel: "Checklist updated." });
      });
    });

    root.querySelectorAll("[data-phase-toggle]").forEach(function (b) {
      b.addEventListener("click", function () {
        var key = b.getAttribute("data-phase-toggle");
        var group = b.closest(".checklist-phase-group");
        var nowOpen = !group.classList.contains("open");
        checklistPhaseOverride[key] = nowOpen;
        render();
      });
    });

    root.querySelectorAll("[data-phase-jump]").forEach(function (b) {
      b.addEventListener("click", function () {
        var key = b.getAttribute("data-phase-jump");
        checklistPhaseOverride[key] = true;
        render();
        var group = document.querySelector('.checklist-phase-group [data-phase-toggle="' + key + '"]');
        if (group) group.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });

    root.querySelectorAll("[data-remove-check]").forEach(function (b) {
      b.addEventListener("click", function () {

    // Fluid budget sliders: dragging one category's allocation redistributes
    // the delta across every other category, proportional to its current
    // share of the remainder, so the total placed never drifts on its own —
    // then renormalizes against the largest remaining category to absorb
    // rounding drift. Values are painted straight to the DOM on every
    // "input" tick (no full render — that would fight the drag), and only
    // committed into `state` on "change" (drag release), matching this
    // file's existing pattern for every other budget field.
    var budgetSliders = Array.prototype.slice.call(root.querySelectorAll("[data-budget-slider]"));
    if (budgetSliders.length) {
      var paintBudgetSlider = function (sl, val) {
        val = Math.max(0, Math.round(val / 25) * 25);
        var row = sl.closest(".fluid-row");
        var max = Number(sl.getAttribute("max")) || 1;
        var pct = Math.max(0, Math.min(100, (val / max) * 100));
        sl.value = val;
        sl.setAttribute("data-prev", val);
        if (row) {
          var fill = row.querySelector("[data-fill]");
          if (fill) fill.style.width = pct + "%";
          var amt = row.querySelector("[data-fr-amt]");
          if (amt) amt.textContent = fmtMoney(val);
          var allocInput = row.querySelector("[data-budget-alloc]");
          if (allocInput) allocInput.value = val || "";
        }
        return val;
      };
      budgetSliders.forEach(function (sl) {
        sl.addEventListener("input", function () {
          var newVal = Math.max(0, Number(sl.value) || 0);
          var oldVal = Number(sl.getAttribute("data-prev")) || 0;
          var delta = newVal - oldVal;
          var others = budgetSliders.filter(function (s) { return s !== sl; });
          var othersTotal = others.reduce(function (s, o) { return s + (Number(o.getAttribute("data-prev")) || 0); }, 0);
          paintBudgetSlider(sl, newVal);
          if (delta !== 0 && othersTotal > 0.0001) {
            var adjusted = others.map(function (o) {
              var ov = Number(o.getAttribute("data-prev")) || 0;
              var share = ov / othersTotal;
              return { el: o, val: Math.max(0, ov - delta * share) };
            });
            var totalBefore = oldVal + othersTotal;
            var totalAfter = newVal + adjusted.reduce(function (s, a) { return s + a.val; }, 0);
            var drift = totalBefore - totalAfter;
            if (Math.abs(drift) >= 1 && adjusted.length) {
              adjusted.sort(function (a, b) { return b.val - a.val; });
              adjusted[0].val = Math.max(0, adjusted[0].val + drift);
            }
            adjusted.forEach(function (a) { paintBudgetSlider(a.el, a.val); });
          }
        });
        sl.addEventListener("change", function () {
          budgetSliders.forEach(function (s) {
            var key = s.getAttribute("data-budget-slider");
            state.categories[key].allocated = Number(s.value) || null;
          });
        });
      });
    }

        render();
        return;
      }
      if (!window.confirm("Send this to " + count + (count === 1 ? " guest" : " guests") + "? This can't be undone.")) return;
      // Plain textarea input, one blank-line-separated paragraph per <p> —
      // good enough for an update email without asking for raw HTML.
      var html = bodyText.split(/\n{2,}/).map(function (para) {
        return "<p>" + escapeHtml(para).replace(/\n/g, "<br/>") + "</p>";

        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ subject: subject, html: html, audience: messageAudience })
      }).then(function (res) {
        return res.json().then(function (data) { return { status: res.status, data: data }; });
      }).then(function (r) {
        messageSending = false;
        if (r.status !== 200 || !r.data.ok) {
          messageFeedback = { ok: false, text: (r.data && r.data.error) || "Could not send that message." };
          render();
          return;

        var d = r.data;
        var parts = [d.sent + " sent"];
        if (d.skipped) parts.push(d.skipped + " skipped (email isn't set up yet)");
        if (d.failed) parts.push(d.failed + " failed");
        messageFeedback = { ok: true, text: parts.join(", ") + "." };

        messageFeedback = { ok: false, text: "Network error — try again." };

        name: name,
        capacity: numOrNull(val("f-table-capacity")),
        shape: val("f-table-shape") === "rectangle" ? "rectangle" : "round",
        x: pos.x,
        y: pos.y
      });
      saveState(next, { doneLabel: "Added " + name + "." });
    });
    root.querySelectorAll("[data-table-remove]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-table-remove");
        state.tables = state.tables.filter(function (t) { return t.id !== id; });
        state.guests.forEach(function (g) { if (g.tableId === id) g.tableId = ""; });
        render();
      });
    });
    root.querySelectorAll("[data-table-rotate]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-table-rotate");
        var t = state.tables.filter(function (x) { return x.id === id; })[0];
        if (t) t.rotation = ((Number(t.rotation) || 0) + 45) % 360;
        render();
      });
    });

    // Dragging a table: move it live with plain style updates on the one
    // element being dragged (not a full render(), which would rebuild the
    // whole app and interrupt the gesture), and only commit the new
    // position into `state` — for the next Save click — once the drag ends.
    root.querySelectorAll("[data-table-drag]").forEach(function (shapeEl) {
      shapeEl.addEventListener("pointerdown", function (e) {
        if (e.button !== undefined && e.button !== 0) return;
        var tableId = shapeEl.getAttribute("data-table-drag");
        var wrap = shapeEl.closest(".floor-table");
        var canvas = document.getElementById("floor-plan-canvas");
        if (!wrap || !canvas) return;
        e.preventDefault();
        shapeEl.setPointerCapture(e.pointerId);
        var canvasRect = canvas.getBoundingClientRect();
        wrap.classList.add("dragging");
        var pendingX = null, pendingY = null;
        function onMove(ev) {
          var xPct = ((ev.clientX - canvasRect.left) / canvasRect.width) * 100;
          var yPct = ((ev.clientY - canvasRect.top) / canvasRect.height) * 100;
          xPct = Math.max(4, Math.min(96, xPct));
          yPct = Math.max(6, Math.min(94, yPct));
          wrap.style.left = xPct.toFixed(2) + "%";
          wrap.style.top = yPct.toFixed(2) + "%";
          pendingX = xPct;
          pendingY = yPct;
        }
        function onUp() {
          shapeEl.removeEventListener("pointermove", onMove);
          shapeEl.removeEventListener("pointerup", onUp);
          shapeEl.removeEventListener("pointercancel", onUp);
          wrap.classList.remove("dragging");
          if (pendingX !== null) {
            var t = state.tables.filter(function (x) { return x.id === tableId; })[0];
            if (t) { t.x = pendingX; t.y = pendingY; }
          }
        }
        shapeEl.addEventListener("pointermove", onMove);
        shapeEl.addEventListener("pointerup", onUp);
        shapeEl.addEventListener("pointercancel", onUp);
      });
    });

    root.querySelectorAll("[data-table-unseat]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-table-unseat");
        var g = state.guests.filter(function (x) { return x.id === id; })[0];
        if (g) g.tableId = "";
        render();
      });
    });

    var saveDayOfBtn = document.getElementById("save-dayof-btn");
    if (saveDayOfBtn) saveDayOfBtn.addEventListener("click", function () { saveState(clone(state), { doneLabel: "Timeline saved." }); });

    var saveSeatingBtn = document.getElementById("save-seating-btn");
    if (saveSeatingBtn) saveSeatingBtn.addEventListener("click", function () { saveState(clone(state), { doneLabel: "Seating chart saved." }); });
  }

  function val(id, isTextarea) { var el = document.getElementById(id); return el ? el.value : ""; }
  function numOrNull(v) { if (v === "" || v === null || v === undefined) return null; var n = Number(v); return isNaN(n) ? null : n; }
  function clone(obj) { return JSON.parse(JSON.stringify(obj)); }

  /* ---------- boot ---------- */

  function loadStateAndRender() {
    fetch("/api/state", { credentials: "same-origin" }).then(function (res) {
      if (res.status === 401) { currentUser = null; render(); return null; }
      return res.json();
    }).then(function (data) {
      if (!data) return;
      applyLoadedState(data.state);
      state._rev = data.rev;
      render();
    }).catch(function (err) {
      console.error(err);
      setSaveStatus("Could not load your data. Refresh to try again.", "err");
    });
  }

  // Bound once (not inside bindEvents, which reruns on every render — that
  // would stack up a fresh listener each time). Lets Escape close the
  // full-screen floor plan from anywhere, same as the ✕ button or backdrop.
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && seatingFullscreen) {
      seatingFullscreen = false;
      render();
    }
  });

  /* ---------- guest portal (unauthenticated, token-gated RSVP page) ----------
     Reached at /rsvp/<token> — completely separate from the login/app-shell
     flow above (no session, no `state`, no access to budget/vendors/other
     guests). It only ever talks to /api/guest-portal/:token, which the
     server scopes to just this token's household (or single guest). */
  var portalToken = null;
  var portalData = null;
  var portalError = "";
  var portalSaving = false;
  var portalDone = false;
  // portalStep walks: "search" (type your name) -> "choose" (multiple name
  // matches) or "notfound" (no match) -> "attend" (the actual RSVP form).
  // Reusing the household's full member list for the "attend" step (rather
  // than only the person who searched) keeps the existing, valuable "one
  // person manages the whole family's RSVP" behavior once they've gotten in.
  var portalStep = "search";
  var portalQuery = "";
  var portalMatches = [];
  var portalIdentified = null;
  var portalAddName = "";
  // New family members/+1s a guest adds that weren't already on the list.
  // Queued locally until Save RSVP; submitted as `additions` and land on
  // the couple's Guest tab flagged pendingApproval for them to confirm.
  var portalNewAdditions = [];

  function loadGuestPortal(token) {
    portalToken = token;
    portalStep = "search";
    portalQuery = "";
    portalMatches = [];
    portalIdentified = null;
    portalNewAdditions = [];
    fetch("/api/guest-portal/" + encodeURIComponent(token), { credentials: "same-origin" })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (r) {
        if (!r.ok) {
          portalError = (r.data && r.data.error) || "This RSVP link isn't valid.";
        } else {
          portalData = r.data;
          // Match the same theme the couple picked during setup — the RSVP
          // page is a guest's first impression, so it should look like the
          // same wedding (colors, background, and their photo), not a
          // generic gray form.
          applyColorway(portalData.colorway);
          // Local edit buffer, seeded from the server's current values.
          portalData.members.forEach(function (m) { m._draft = { rsvp: m.rsvp, mealChoice: m.mealChoice, email: m.email }; });
        }
        renderGuestPortalPage();
      }).catch(function () {
        portalError = "Network error — try reloading this page.";
        renderGuestPortalPage();
      });
  }

  var PORTAL_EYEBROW = '<div class="portal-eyebrow">The Wedding Ledger</div>';

  function portalCountdown(weddingDateStr) {
    var days = daysUntil(weddingDateStr);
    if (days === null) return "";
    if (days > 0) return '<div class="portal-countdown"><span class="num">' + days + "</span> day" + (days === 1 ? "" : "s") + " to go</div>";
    if (days === 0) return '<div class="portal-countdown">Today’s the day!</div>';
    return "";
  }

  function portalMap(address) {
    if (!address) return "";
    return '<iframe class="portal-map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=' + encodeURIComponent(address) + '&output=embed" title="Venue map"></iframe>';
  }

  function portalHeader() {
    var p = (portalData && portalData.profile) || {};
    var dateStr = p.weddingDate ? fmtDate(new Date(p.weddingDate + "T00:00:00")) : "";
    var photo = p.couplePhoto ? '<img class="couple-photo-frame" src="' + p.couplePhoto + '" alt="' + escapeHtml(p.coupleNames || "The couple") + '"/>' : "";
    return photo + PORTAL_EYEBROW + "<h1>" + escapeHtml(p.coupleNames || "Our Wedding") + "</h1>" +
      '<div class="portal-sub">' + [dateStr, p.location].filter(Boolean).join(" · ") + (p.address ? "<br/>" + escapeHtml(p.address) : "") + "</div>" +
      portalCountdown(p.weddingDate) +
      portalMap(p.address);
  }

  // Story, wedding party, FAQ, and registry links — shown on both the
  // landing/search page and the RSVP page itself, so a guest gets the same
  // "wedding website" content regardless of where they land.
  function renderPortalExtras() {
    if (!portalData) return "";
    var p = portalData.profile || {};
    var storyHtml = p.story ? '<div class="portal-card"><h2>Our story</h2><div class="portal-story">' + escapeHtml(p.story) + "</div></div>" : "";

    var party = portalData.weddingParty || [];
    var partyHtml = party.length ? '<div class="portal-card"><h2>Wedding party</h2><div class="portal-party-grid">' +
      party.map(function (m) {
        var photo = m.photo ? '<img class="portal-party-photo" src="' + m.photo + '" alt="' + escapeHtml(m.name || "") + '"/>' : '<div class="portal-party-photo-empty"></div>';
        return '<div>' + photo + '<div class="portal-party-name">' + escapeHtml(m.name || "") + "</div>" +
          (m.role ? '<div class="portal-party-role">' + escapeHtml(m.role) + "</div>" : "") +
          (m.blurb ? '<div class="portal-party-blurb">' + escapeHtml(m.blurb) + "</div>" : "") + "</div>";
      }).join("") + "</div></div>" : "";

    var faq = portalData.faq || [];
    var faqHtml = faq.length ? '<div class="portal-card"><h2>Good to know</h2>' +
      faq.map(function (q) {
        return '<div class="portal-faq-item"><div class="q">' + escapeHtml(q.question || "") + '</div><div class="a">' + escapeHtml(q.answer || "") + "</div></div>";
      }).join("") + "</div>" : "";

    var links = portalData.registryLinks || [];
    var registryHtml = links.length ? '<div class="portal-card"><h2>Registry</h2><div class="portal-registry-links">' +
      links.map(function (r) {
        return '<a class="portal-registry-link" href="' + escapeHtml(r.url || "#") + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(r.label || "Registry") + "</a>";
      }).join("") + "</div></div>" : "";

    return storyHtml + partyHtml + faqHtml + registryHtml;
  }

  // Loose, forgiving name matching — case-insensitive substring in either
  // direction, plus a per-word check, so "jordan" finds "Jordan Reyes" and
  // "reyes" finds it too.
  function portalSearchMembers(query) {
    var q = query.trim().toLowerCase();
    if (!q) return [];
    return portalData.members.filter(function (m) {
      var name = m.name.toLowerCase();
      if (name.indexOf(q) !== -1 || q.indexOf(name) !== -1) return true;
      return name.split(/\s+/).some(function (part) { return part && (part.indexOf(q) !== -1 || q.indexOf(part) !== -1); });
    });
  }

  function renderGuestPortalPage() {
    var root = document.getElementById("app-root");
    if (portalError && !portalData) {
      root.innerHTML = '<div class="themed-page"><div class="portal-search-shell">' + PORTAL_EYEBROW + "<h1>RSVP</h1>" +
        '<div class="login-error">' + escapeHtml(portalError) + "</div></div></div>";
      return;
    }
    if (!portalData) {
      root.innerHTML = '<div class="themed-page"><div class="portal-search-shell">' + PORTAL_EYEBROW + '<h1>RSVP</h1><div class="portal-sub">Loading your invitation…</div></div></div>';
      return;
    }
    if (portalDone) {
      root.innerHTML = '<div class="themed-page"><div class="portal-shell">' + portalHeader() +
        '<div class="login-notice">Thank you — your RSVP is saved. You can come back to this link any time to update it.</div></div></div>';
      return;
    }
    if (portalStep === "attend") { root.innerHTML = renderPortalAttend(); bindGuestPortalEvents(); return; }
    if (portalStep === "choose") { root.innerHTML = renderPortalChoose(); bindGuestPortalEvents(); return; }
    if (portalStep === "notfound") { root.innerHTML = renderPortalNotFound(); bindGuestPortalEvents(); return; }
    root.innerHTML = renderPortalSearch();
    bindGuestPortalEvents();
  }

  function renderPortalSearch() {
    return '<div class="themed-page"><div class="portal-search-shell">' + portalHeader() +
      '<div class="portal-sub">Type your name to find your invitation.</div>' +
      (portalError ? '<div class="login-error">' + escapeHtml(portalError) + "</div>" : "") +
      '<div class="field"><label for="portal-search-input">Your name</label><input type="text" id="portal-search-input" placeholder="e.g. Jordan Reyes" value="' + escapeHtml(portalQuery) + '"/></div>' +
      '<div class="save-row" style="justify-content:center"><button class="btn btn-primary" id="portal-search-btn">Find my invitation</button></div>' +
      "</div><div class=\"portal-shell\" style=\"margin-top:0\">" + renderPortalExtras() + "</div></div>";
  }

  function renderPortalChoose() {
    var list = portalMatches.map(function (m) {
      return '<button type="button" class="portal-match-btn" data-portal-pick="' + m.id + '">' + escapeHtml(m.name) + "</button>";
    }).join("");
    return '<div class="themed-page"><div class="portal-search-shell">' + portalHeader() +
      '<div class="portal-sub">A few names matched &ldquo;' + escapeHtml(portalQuery) + '&rdquo; — which one are you?</div>' +
      '<div class="portal-match-list">' + list + "</div>" +
      '<div class="save-row" style="justify-content:center"><button type="button" class="link-btn" id="portal-back-to-search">None of these — try again</button></div>' +
      "</div></div>";
  }

  function renderPortalNotFound() {
    return '<div class="themed-page"><div class="portal-search-shell">' + portalHeader() +
      '<div class="portal-sub">We couldn&rsquo;t find &ldquo;' + escapeHtml(portalQuery) + '&rdquo;' + (portalData.householdName ? " on the list for " + escapeHtml(portalData.householdName) : " on the list") + '. Double-check the spelling, or let the couple know you&rsquo;ll be joining — they\'ll confirm it on their end.</div>' +
      '<div class="save-row" style="justify-content:center;gap:0.6rem"><button type="button" class="btn btn-secondary" id="portal-back-to-search">Try again</button>' +
      '<button type="button" class="btn btn-primary" id="portal-add-self-btn">Continue as &ldquo;' + escapeHtml(portalQuery) + '&rdquo;</button></div>' +
      "</div></div>";
  }

  function renderPortalAttend() {
    var scheduleHtml = (portalData.timeline || []).length
      ? '<div class="portal-card"><h2>Schedule</h2>' + portalData.timeline.map(function (t) {
          return '<div class="portal-schedule-item"><div class="ps-time">' + escapeHtml(fmtTime(t.time)) + '</div><div>' + escapeHtml(t.title || "") + "</div>" +
            (t.notes ? '<div class="tiny">' + escapeHtml(t.notes) + "</div>" : "") + "</div>";
        }).join("") + "</div>"
      : "";

    // A single checkbox per person — check off everyone from the household
    // who's coming, rather than an accept/decline choice per person. Meal
    // choice only makes sense once someone's marked as attending.
    var membersHtml = portalData.members.map(function (m) {
      var attending = m._draft.rsvp === "attending";
      return '<div class="portal-member"><label class="portal-attend-row">' +
        '<input type="checkbox" data-portal-attending="' + m.id + '"' + (attending ? " checked" : "") + '/>' +
        '<span class="portal-member-name">' + escapeHtml(m.name) + "</span></label>" +
        (attending ? '<div class="field"><label>Meal choice</label><input type="text" data-portal-meal="' + m.id + '" value="' + escapeHtml(m._draft.mealChoice || "") + '" placeholder="e.g. Vegetarian, no allergies"/></div>' : "") +
        '<div class="field"><label>Email (optional — for updates from us)</label><input type="email" data-portal-email="' + m.id + '" value="' + escapeHtml(m._draft.email || "") + '" placeholder="name@example.com"/></div>' +
        "</div>";
    }).join("");

    var additionsHtml = portalNewAdditions.length ? '<div class="portal-addition-list">' + portalNewAdditions.map(function (a, i) {
      return '<div class="portal-addition-chip"><label style="display:flex;align-items:center;gap:0.5em;flex:1;font-weight:600;cursor:pointer">' +
        '<input type="checkbox" data-portal-addition-attending="' + i + '"' + (a.rsvp === "attending" ? " checked" : "") + '/>' +
        escapeHtml(a.name) + ' <span class="tiny" style="font-weight:400">(new — pending review)</span></label>' +
        '<button type="button" data-portal-addition-remove="' + i + '">Remove</button></div>';
    }).join("") + "</div>" : "";

    var addForm = '<div class="portal-addition-row"><div class="field"><label for="portal-add-name">Add a family member or +1 we missed</label>' +
      '<input type="text" id="portal-add-name" placeholder="Full name" value="' + escapeHtml(portalAddName) + '"/></div>' +
      '<button type="button" class="btn btn-secondary btn-sm" id="portal-add-btn">Add</button></div>';

    var greeting = portalIdentified ? "Hi " + escapeHtml(portalIdentified.name) + "! " : "";
    var rsvpIntro = greeting + (portalData.members.length > 1
      ? "Check off everyone from " + (portalData.householdName ? escapeHtml(portalData.householdName) : "your household") + " who'll be joining us."
      : "Let us know if you'll be joining us.");

    return '<div class="themed-page"><div class="portal-shell">' + portalHeader() + scheduleHtml +
      '<div class="portal-card"><h2>RSVP' + (portalData.householdName ? " — " + escapeHtml(portalData.householdName) : "") + "</h2>" +
      '<p class="muted">' + rsvpIntro + "</p>" +
      membersHtml + additionsHtml + addForm +
      (portalError ? '<div class="login-error">' + escapeHtml(portalError) + "</div>" : "") +
      '<div class="save-row"><button class="btn btn-primary" id="portal-submit-btn"' + (portalSaving ? " disabled" : "") + ">" + (portalSaving ? "Saving…" : "Save RSVP") + "</button></div></div>" +
      renderPortalExtras() +
      "</div></div>";
  }

  function bindGuestPortalEvents() {
    var root = document.getElementById("app-root");

    var searchInput = document.getElementById("portal-search-input");
    var searchBtn = document.getElementById("portal-search-btn");
    function doPortalSearch() {
      portalQuery = searchInput ? searchInput.value : portalQuery;
      if (!portalQuery.trim()) { portalError = "Enter your name to continue."; renderGuestPortalPage(); return; }
      var matches = portalSearchMembers(portalQuery);
      portalError = "";
      if (matches.length === 0) { portalStep = "notfound"; }
      else if (matches.length === 1) { portalIdentified = matches[0]; portalStep = "attend"; }
      else { portalMatches = matches; portalStep = "choose"; }
      renderGuestPortalPage();
    }
    if (searchBtn) searchBtn.addEventListener("click", doPortalSearch);
    if (searchInput) searchInput.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); doPortalSearch(); } });

    root.querySelectorAll("[data-portal-pick]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-portal-pick");
        portalIdentified = portalData.members.filter(function (m) { return m.id === id; })[0] || null;
        portalStep = "attend";
        renderGuestPortalPage();
      });
    });

    var backBtn = document.getElementById("portal-back-to-search");
    if (backBtn) backBtn.addEventListener("click", function () {
      portalStep = "search"; portalError = ""; portalMatches = [];
      renderGuestPortalPage();
    });

    var addSelfBtn = document.getElementById("portal-add-self-btn");
    if (addSelfBtn) addSelfBtn.addEventListener("click", function () {
      portalNewAdditions.push({ name: portalQuery.trim(), rsvp: "attending", mealChoice: "" });
      portalIdentified = null;
      portalStep = "attend";
      renderGuestPortalPage();
    });

    root.querySelectorAll("[data-portal-attending]").forEach(function (el) {
      el.addEventListener("change", function () {
        var id = el.getAttribute("data-portal-attending");
        var m = portalData.members.filter(function (x) { return x.id === id; })[0];
        if (m) { m._draft.rsvp = el.checked ? "attending" : "declined"; renderGuestPortalPage(); }
      });
    });
    root.querySelectorAll("[data-portal-meal]").forEach(function (el) {
      el.addEventListener("change", function () {
        var id = el.getAttribute("data-portal-meal");
        var m = portalData.members.filter(function (x) { return x.id === id; })[0];
        if (m) m._draft.mealChoice = el.value;
      });
    });
    root.querySelectorAll("[data-portal-email]").forEach(function (el) {
      el.addEventListener("change", function () {
        var id = el.getAttribute("data-portal-email");
        var m = portalData.members.filter(function (x) { return x.id === id; })[0];
        if (m) m._draft.email = el.value;
      });
    });

    root.querySelectorAll("[data-portal-addition-attending]").forEach(function (el) {
      el.addEventListener("change", function () {
        var i = Number(el.getAttribute("data-portal-addition-attending"));
        if (portalNewAdditions[i]) portalNewAdditions[i].rsvp = el.checked ? "attending" : "declined";
      });
    });
    root.querySelectorAll("[data-portal-addition-remove]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var i = Number(btn.getAttribute("data-portal-addition-remove"));
        portalNewAdditions.splice(i, 1);
        renderGuestPortalPage();
      });
    });

    var addNameInput = document.getElementById("portal-add-name");
    var addBtn = document.getElementById("portal-add-btn");
    function addPortalAddition() {
      var name = addNameInput ? addNameInput.value.trim() : "";
      if (!name) return;
      if (portalNewAdditions.length >= 6) {
        portalError = "You can add up to 6 people at once — save this RSVP, then use the link again for more.";
        renderGuestPortalPage();
        return;
      }
      portalNewAdditions.push({ name: name, rsvp: "attending", mealChoice: "" });
      portalAddName = "";
      portalError = "";
      renderGuestPortalPage();
    }
    if (addBtn) addBtn.addEventListener("click", addPortalAddition);
    if (addNameInput) addNameInput.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); addPortalAddition(); } });

    var submitBtn = document.getElementById("portal-submit-btn");
    if (submitBtn) submitBtn.addEventListener("click", function () {
      // Submitting is the definitive headcount: whatever's checked right
      // now becomes "attending" and everything else becomes "declined" —
      // including any member whose checkbox was never touched — so the
      // couple gets a real yes/no for every person, not a lingering
      // "no response yet". Read the live checkbox state before the render
      // below replaces these elements.
      root.querySelectorAll("[data-portal-attending]").forEach(function (el) {
        var id = el.getAttribute("data-portal-attending");
        var m = portalData.members.filter(function (x) { return x.id === id; })[0];
        if (m) m._draft.rsvp = el.checked ? "attending" : "declined";
      });
      root.querySelectorAll("[data-portal-addition-attending]").forEach(function (el) {
        var i = Number(el.getAttribute("data-portal-addition-attending"));
        if (portalNewAdditions[i]) portalNewAdditions[i].rsvp = el.checked ? "attending" : "declined";
      });

      portalSaving = true;
      portalError = "";
      renderGuestPortalPage();
      var updates = portalData.members.map(function (m) {
        return { id: m.id, rsvp: m._draft.rsvp, mealChoice: m._draft.mealChoice, email: m._draft.email };
      });
      var body = { updates: updates };
      if (portalNewAdditions.length) {
        body.additions = portalNewAdditions.map(function (a) { return { name: a.name, rsvp: a.rsvp, mealChoice: a.mealChoice }; });
      }
      fetch("/api/guest-portal/" + encodeURIComponent(portalToken), {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      }).then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
        .then(function (r) {
          portalSaving = false;
          if (!r.ok) {
            portalError = (r.data && r.data.error) || "Could not save your RSVP.";
          } else {
            portalDone = true;
            portalData.members.forEach(function (m) { m.rsvp = m._draft.rsvp; m.mealChoice = m._draft.mealChoice; m.email = m._draft.email; });
            portalNewAdditions = [];
          }
          renderGuestPortalPage();
        }).catch(function () {
          portalSaving = false;
          portalError = "Network error — try again.";
          renderGuestPortalPage();
        });
    });
  }

  function boot() {
    // A guest RSVP link lands here as /rsvp/<token> — a completely separate,
    // unauthenticated flow that never touches the couple's login or state.
    var portalMatch = /^\/rsvp\/([^\/?#]+)/.exec(window.location.pathname);
    if (portalMatch) {
      loadGuestPortal(decodeURIComponent(portalMatch[1]));
      renderGuestPortalPage();
      return;
    }

    // A password-reset email link lands here as /?resetToken=... — grab it
    // and scrub it from the URL bar so a reload/bookmark doesn't resubmit
    // (or leak) the token.
    var params = new URLSearchParams(window.location.search);
    var tokenFromUrl = params.get("resetToken");
    if (tokenFromUrl) {
      pendingResetToken = tokenFromUrl;
      var cleanUrl = window.location.pathname + window.location.hash;
      window.history.replaceState({}, document.title, cleanUrl);
      render();
      return;
    }
    fetch("/api/me", { credentials: "same-origin" }).then(function (res) { return res.json(); })
      .then(function (data) {
        if (data && data.authenticated) {
          currentUser = data.user;
          loadStateAndRender();
        } else {
          render();
        }
      }).catch(function () {
        render();
      });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
